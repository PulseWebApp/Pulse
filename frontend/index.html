<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse — what's happening near you</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#12233B">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<style>
  :root{
    --bg:#F4F5F7; --page:#F4F5F7; --surface:#FFFFFF; --surface-2:#F5F6F8;
    --ink:#12141C; --ink-secondary:#6B7280; --ink-muted:#9AA1AD;
    --border:#EBEDF1; --border-strong:#D8DBE1;
    --accent:#2563EB; --accent-hover:#1D4ED8; --accent-bg:#E8EFFF; --accent-text:#1D4ED8;
    --teal-bg:#E5F7EA; --teal-text:#16A34A; --teal-fill:#16A34A;
    --amber-bg:#FFF3E0; --amber-text:#B45309; --amber-fill:#F5A623;
    --coral-bg:#FDEAEA; --coral-text:#E0332F; --coral-fill:#E0332F;
    --blue-bg:#E8EFFF; --blue-text:#1D4ED8; --blue-fill:#2563EB;
    --purple:#8B5CF6; --purple-bg:#F1EBFF;
    --radius:16px;
    --shadow-card:0 10px 30px rgba(20,22,30,.08);
    --shadow-lg:0 20px 50px rgba(20,22,30,.16);
    --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:32px; --sp-6:48px; --sp-8:64px;
  }
  [data-theme="dark"]{
    --bg:#0F172A; --page:#0B1220; --surface:#182234; --surface-2:#212D42;
    --ink:#FFFFFF; --ink-secondary:#B0BAC9; --ink-muted:#8B98A3;
    --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.14);
    --accent:#3B82F6; --accent-hover:#60A5FA; --accent-bg:#1E3A5F; --accent-text:#93C5FD;
    --teal-bg:#0F3A2E; --teal-text:#5DCAA5; --teal-fill:#22C55E;
    --amber-bg:#4A3208; --amber-text:#F9C765; --amber-fill:#F59E0B;
    --coral-bg:#4A2013; --coral-text:#F0997B; --coral-fill:#EF4444;
    --blue-bg:#1E3A5F; --blue-text:#93C5FD; --blue-fill:#3B82F6;
    --purple:#A78BFA; --purple-bg:#2D2450;
    --shadow-card:0 20px 50px rgba(0,0,0,.35);
    --shadow-lg:0 20px 60px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--page); font-family:'Inter',sans-serif; color:var(--ink); display:flex; justify-content:center; transition:background .3s;}
  .frame{width:100%; max-width:460px; min-height:100vh; background:var(--bg); padding:0;}
  .screen{background:var(--surface); height:100vh; display:flex; flex-direction:column; overflow:hidden; position:relative;}
  @media (min-width:461px){
    body{padding:32px 16px;}
    .frame{min-height:auto; border-radius:36px; padding:12px; box-shadow:var(--shadow-lg);}
    .screen{height:700px; border-radius:26px;}
  }
  .mode-banner{font-size:11px; text-align:center; padding:6px; background:var(--amber-bg); color:var(--amber-text); display:none; font-family:'IBM Plex Mono',monospace;}
  .mode-banner.show{display:block;}

  .topbar{padding:18px 18px 10px;}
  .brand{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .wordmark{font-family:'Inter',sans-serif; font-size:22px; font-weight:800; color:var(--accent); display:flex; align-items:center; gap:8px;}
  .pulse-dot{width:9px; height:9px; border-radius:50%; background:var(--teal-fill); animation:breathe 1.8s ease-in-out infinite;}
  @keyframes breathe{0%,100%{opacity:1; transform:scale(1);} 50%{opacity:0.4; transform:scale(0.75);}}
  @keyframes marker-pulse{0%{transform:scale(1); opacity:.55;} 100%{transform:scale(2.1); opacity:0;}}
  .marker-pulse-ring{position:absolute; top:0; left:0; width:32px; height:32px; border-radius:50%; animation:marker-pulse 2.2s ease-out infinite;}

  .persona{display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:3px;}
  .persona button{flex:1; border:none; background:none; padding:7px 8px; font-family:'Inter',sans-serif; font-size:12px; font-weight:500; color:var(--ink-secondary); border-radius:8px; cursor:pointer;}
  .persona button.active{background:var(--surface); color:var(--accent); box-shadow:0 3px 12px rgba(0,0,0,.08);}

  .filters{display:flex; gap:6px; overflow-x:auto; padding:0 18px 12px; }
  .filters::-webkit-scrollbar{display:none;}
  .chip{white-space:nowrap; font-size:13px; padding:9px 15px; border-radius:20px; border:none; color:var(--ink-secondary); background:var(--surface-2); cursor:pointer; font-family:'Inter',sans-serif; font-weight:600; transition:.15s; display:inline-flex; align-items:center; gap:6px;}
  .chip.active{background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 6px 16px rgba(37,99,235,.3);}

  .content{flex:1; overflow-y:auto; padding:0 14px 14px; display:flex; flex-direction:column; gap:10px;}

  .card{background:var(--surface); border-radius:18px; padding:16px; cursor:pointer; border:1px solid var(--border); transition:transform .3s cubic-bezier(.2,.9,.3,1), box-shadow .3s;}
  .card:hover{transform:translateY(-2px); box-shadow:var(--shadow-card); border-color:var(--border-strong);}
  .card-row{display:flex; gap:11px; align-items:flex-start;}
  .icon-badge{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:17px;}
  .card-body{flex:1; min-width:0;}
  .card-title{font-size:14px; font-weight:600; margin:0; display:flex; align-items:center; gap:6px;}
  .card-sub{font-size:12px; color:var(--ink-secondary); margin:3px 0 0;}
  .card-right{text-align:right; flex-shrink:0;}
  .card-metric{font-family:'Inter',sans-serif; font-size:17px; font-weight:700; animation:num-pulse 2.4s ease-in-out infinite;}
  @keyframes num-pulse{0%,100%{opacity:1;} 50%{opacity:.75;}}
  .card-label{font-size:10px; color:var(--ink-muted); margin-top:2px; font-family:'IBM Plex Mono',monospace; letter-spacing:.02em;}
  .badge-owner{font-size:10px; background:var(--blue-bg); color:var(--blue-text); padding:2px 7px; border-radius:20px; display:inline-flex; align-items:center; gap:3px; font-family:'Inter',sans-serif; font-weight:500;}
  .status-dot{width:7px; height:7px; border-radius:50%; display:inline-block; animation:breathe 1.8s ease-in-out infinite;}

  .section-label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-muted); font-family:'IBM Plex Mono',monospace; padding:6px 6px 2px; scroll-margin-top:10px;}
  .jump-nav{display:flex; gap:6px; padding:2px 0 8px; position:sticky; top:0; background:var(--surface); z-index:5;}
  .jump-nav button{font-size:11px; padding:6px 12px; border-radius:14px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink-secondary); cursor:pointer; font-family:'Inter',sans-serif;}
  .summary-strip{display:flex; gap:8px; padding:0; margin-bottom:10px;}
  .summary-stat{text-align:left; flex:1; min-width:0; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:10px 12px; box-shadow:0 4px 14px rgba(15,23,42,.04); transition:transform .3s cubic-bezier(.2,.9,.3,1), box-shadow .3s;}
  .summary-stat:hover{transform:translateY(-2px); box-shadow:var(--shadow-card);}
  .summary-stat .n{font-size:18px; font-weight:800; font-family:'Inter',sans-serif; font-variant-numeric:tabular-nums;}
  .summary-stat .l{font-size:9.5px; color:var(--ink-muted); margin-top:2px; text-transform:uppercase; letter-spacing:.04em; font-family:'IBM Plex Mono',monospace;}

  .bottomnav{display:flex; border-top:1px solid var(--border); background:var(--surface);}
  .bottomnav button{flex:1; border:none; background:none; padding:12px 0 10px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; color:var(--ink-muted); cursor:pointer; font-family:'Inter',sans-serif;}
  .bottomnav button i{font-size:20px;}
  .bottomnav button.active{color:var(--ink);}

  .fab{position:absolute; right:16px; bottom:78px; z-index:1200; background:var(--accent); color:#fff; border:none; border-radius:24px; padding:11px 18px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; cursor:pointer; font-family:'Inter',sans-serif; box-shadow:0 15px 35px rgba(37,99,235,.35);}

  .overlay{position:absolute; inset:0; background:rgba(18,35,59,0.45); display:flex; align-items:flex-end; justify-content:center; z-index:1300;}
  .overlay .sheet{max-width:460px;}
  .sheet{background:var(--surface); width:100%; border-radius:22px 22px 0 0; padding:18px; max-height:90%; overflow-y:auto; transform:translateY(100%); transition:transform .3s cubic-bezier(.2,.9,.3,1);}
  .sheet.in{transform:translateY(0);}
  .sheet-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;}
  .sheet-title{font-family:'Sora',sans-serif; font-size:16px; font-weight:700; margin:0;}
  .sheet-sub{font-size:12px; color:var(--ink-secondary); margin:3px 0 0;}
  .close-btn{background:var(--surface-2); border:none; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-secondary);}
  .detail-grid{display:block;}
  .dg-header{display:flex; gap:12px; align-items:center;}
  @media (min-width:900px){
    .overlay .sheet.place-detail{max-width:900px; border-radius:20px; background:rgba(255,255,255,.9); -webkit-border:1px solid rgba(255,255,255,.7);}
    .sheet.place-detail .sheet-title{font-size:20px;}
    .place-detail .detail-grid{display:grid; grid-template-columns:1.4fr 1fr; grid-template-areas:"header crowd" "wait actions"; gap:20px 24px; align-items:start;}
    .place-detail .dg-header{grid-area:header;}
    .place-detail .dg-crowd{grid-area:crowd;}
    .place-detail .dg-wait{grid-area:wait;}
    .place-detail .dg-actions{grid-area:actions; align-self:end;}
    .place-detail .d-photo{width:96px; height:96px;}
  }

  .big-metric{text-align:center; padding:14px 0;}
  .big-metric .num{font-family:'Sora',sans-serif; font-size:40px; font-weight:800; line-height:1;}
  .big-metric .cap{font-size:11px; color:var(--ink-muted); font-family:'IBM Plex Mono',monospace; margin-top:6px;}

  .opt-btn{width:100%; text-align:left; padding:13px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface); margin-bottom:8px; font-size:13px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; font-family:'Inter',sans-serif; color:var(--ink); transition:background .2s, border-color .2s;}
  .opt-btn:hover{border-color:var(--border-strong); background:var(--surface-2);}
  .opt-btn.selected{border-color:var(--blue-fill); background:var(--blue-bg); color:var(--blue-text);}

  .type-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; margin-bottom:14px;}
  .type-opt{padding:14px 6px; border-radius:12px; border:1px solid var(--border); display:flex; flex-direction:column; align-items:center; gap:7px; cursor:pointer; font-size:11px; color:var(--ink-secondary); background:var(--surface);}
  .type-opt i{font-size:20px;}
  .type-opt.selected{border-color:var(--accent); background:var(--accent-bg); color:var(--accent-text);}

  select, input[type=text]{width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--border); font-size:13px; font-family:'Inter',sans-serif; background:var(--surface); color:var(--ink); margin-bottom:12px;}

  .primary-btn{width:100%; padding:13px; background:linear-gradient(135deg,#3B82F6,var(--accent)); color:#fff; border:none; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; transition:transform .2s, box-shadow .2s; box-shadow:0 8px 20px rgba(37,99,235,.25);}
  .primary-btn:hover{transform:translateY(-1px); box-shadow:0 12px 28px rgba(37,99,235,.35);}
  .status-set{display:flex; gap:8px; margin-bottom:12px;}
  .status-set button{flex:1; padding:11px 4px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface); font-size:12px; font-weight:500; cursor:pointer; font-family:'Inter',sans-serif; color:var(--ink-secondary);}
  .status-set button.sel-green.selected{border-color:var(--teal-fill); background:var(--teal-bg); color:var(--teal-text);}
  .status-set button.sel-amber.selected{border-color:var(--amber-fill); background:var(--amber-bg); color:var(--amber-text);}
  .status-set button.sel-red.selected{border-color:var(--coral-fill); background:var(--coral-bg); color:var(--coral-text);}

  .owner-card{background:var(--surface-2); border-radius:16px; padding:16px; margin-bottom:14px;}
  .owner-card-head{display:flex; gap:10px; align-items:center; margin-bottom:14px;}
  .owner-note{font-size:12px; color:var(--ink-secondary); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 10px; margin-top:2px;}

  .toast{position:absolute; bottom:88px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:24px; font-size:12px; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:20; white-space:nowrap; font-family:'Inter',sans-serif;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .empty{text-align:center; padding:40px 20px; color:var(--ink-muted); font-size:13px;}

  svg text{font-family:'Inter',sans-serif;}
  .map-pin{cursor:pointer;}
  .search-bar-wrap{position:absolute; top:14px; left:14px; right:130px; z-index:450; flex-shrink:0;}
  .search-pill{display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.85); -webkit-border:1px solid rgba(255,255,255,.7); border-radius:18px; box-shadow:var(--shadow-card); padding:0 14px; transition:box-shadow .3s, border-color .3s;}
  .search-pill:focus-within{box-shadow:var(--shadow-card), 0 0 0 3px var(--accent-bg); border-color:var(--accent);}
  .search-pill .search-icon{font-size:15px; flex-shrink:0; color:var(--ink-muted); pointer-events:none; width:30px; text-align:center;}
  .search-kbd{flex-shrink:0; font-size:10px; font-weight:700; color:var(--ink-muted); background:var(--surface-2); padding:3px 7px; border-radius:6px; pointer-events:none;}
  .search-input{flex:1; min-width:0; padding:15px 0; border:none; font-size:14.5px; font-family:'Inter',sans-serif; background:none; color:var(--ink); outline:none;}
  [data-theme="dark"] .search-pill{background:rgba(24,34,52,.85); border-color:rgba(255,255,255,.08);}
  .search-results{position:absolute; left:0; right:0; top:calc(100% + 10px); background:var(--surface); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow-lg); z-index:1250; max-height:340px; overflow-y:auto; display:none; padding:14px;}
  [data-theme="dark"] .search-results{background:var(--surface);}
  .search-results.show{display:block;}
  @media (min-width:900px){
    .search-bar-wrap{top:24px; left:calc(355px + (100% - 355px)/2); transform:translateX(-50%); right:auto; width:min(500px, 50%); transition:left .25s;}
    .app-shell.collapsed ~ .map-pane-desktop .search-bar-wrap{left:calc(132px + (100% - 132px)/2);}
    .search-input{font-size:14.5px;}
  }
  .search-panel-head{display:flex; align-items:center; justify-content:space-between; font-size:12.5px; font-weight:700; color:var(--ink); padding:4px 8px 8px;}
  .search-clear{font-size:12px; font-weight:700; color:var(--accent-text); cursor:pointer;}
  .search-result-item{padding:9px 10px; font-size:13.5px; cursor:pointer; border-radius:9px; display:flex; align-items:center; gap:10px;}
  .search-result-item:hover{background:var(--surface-2);}
  .search-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0; display:inline-block;}

  .legend{position:absolute; bottom:0; left:0; right:0; background:rgba(255,255,255,0.96); border-top:1px solid var(--border); padding:10px 14px; display:flex; flex-wrap:wrap; gap:10px 14px;}
  .legend span{font-size:10px; color:var(--ink-secondary); display:flex; align-items:center; gap:5px;}
  .legend .dot{width:8px; height:8px; border-radius:50%;}

  /* Real map */
  #leaflet-map{width:100%; height:100%; background:var(--surface-1, #EEF2F1);}
  #leaflet-map .leaflet-tile-pane{filter:saturate(3) brightness(0.85) contrast(1.3) opacity(0.9);}
  [data-theme="dark"] #leaflet-map .leaflet-tile-pane{filter:saturate(1.15) brightness(1.04);}
  .map-wrap{position:relative; flex:1; min-height:0; border-radius:0; overflow:hidden;}
  .map-frame-overlay{display:none;}
  @media (min-width:900px){
    .map-frame-overlay{display:block; position:fixed; top:24px; left:355px; right:24px; bottom:24px; z-index:350; pointer-events:none; border-radius:32px; border:1px solid rgba(255,255,255,.5); box-shadow:0 20px 50px rgba(20,22,30,.14); background:rgba(255,255,255,.06); transition:left .25s;}
    .app-shell.collapsed ~ .map-pane-desktop .map-frame-overlay{left:132px;}
  }
  .leaflet-div-icon{background:none; border:none;}
  .pin-dot{width:26px; height:26px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(18,35,59,0.3); border:2px solid #fff;}
  .pin-dot i{transform:rotate(45deg); font-size:12px; color:#fff;}
  .badge-demo{font-size:9px; background:var(--surface-1); color:var(--ink-muted); padding:1px 6px; border-radius:20px; font-family:'IBM Plex Mono',monospace;}
  .badge-real{font-size:9px; background:var(--blue-bg); color:var(--blue-text); padding:1px 6px; border-radius:20px; font-family:'IBM Plex Mono',monospace;}
  .layers-btn{position:absolute; top:14px; right:66px; z-index:400; background:rgba(255,255,255,.85); -webkit-color:var(--ink); border:1px solid rgba(255,255,255,.7); border-radius:18px; padding:12px 18px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; cursor:pointer; box-shadow:var(--shadow-card); font-family:'Inter',sans-serif;}
  [data-theme="dark"] .layers-btn{background:rgba(24,34,52,.85); border-color:rgba(255,255,255,.08);}
  .top-right-controls{position:absolute; right:14px; top:14px; z-index:410; display:flex; align-items:center; gap:8px;}
  .mode-pill{background:rgba(255,255,255,.85); -webkit-border:1px solid rgba(255,255,255,.7); border-radius:22px; box-shadow:var(--shadow-card); padding:4px; display:flex; gap:3px;}
  [data-theme="dark"] .mode-pill{background:rgba(24,34,52,.85);}
  .mode-pill-btn{border:none; background:transparent; width:32px; height:32px; border-radius:18px; display:flex; align-items:center; justify-content:center; color:var(--ink-muted); cursor:pointer;}
  [data-theme="light"] #mode-light-btn, :root:not([data-theme]) #mode-light-btn{background:var(--accent); color:#fff;}
  [data-theme="dark"] #mode-dark-btn{background:var(--accent); color:#fff;}
  .avatar-btn{width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#6366F1,#8B5CF6); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:13.5px; box-shadow:var(--shadow-card); flex-shrink:0; font-family:'Sora',sans-serif;}
  .map-controls{position:absolute; right:14px; top:66px; z-index:400; display:flex; flex-direction:column; gap:10px;}
  .map-control{width:44px; height:44px; background:rgba(255,255,255,.85); -webkit-border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; box-shadow:var(--shadow-card); cursor:pointer; border:1px solid rgba(255,255,255,.7); transition:transform .3s cubic-bezier(.2,.9,.3,1), color .2s; color:var(--ink-secondary);}
  [data-theme="dark"] .map-control{background:rgba(24,34,52,.85); border-color:rgba(255,255,255,.08);}
  .map-control.dark{background:var(--ink); color:#fff;}
  @media (min-width:900px){
    .map-control{width:56px; height:56px; font-size:21px;}
    .map-control:hover{transform:scale(1.1);}
  }
  .map-control:hover{transform:scale(1.08); color:var(--accent);}
  .map-control.dark:hover{color:#fff;}
  .map-control.on{background:var(--accent); color:#fff;}
  .map-control.locate{background:var(--accent); color:#fff; box-shadow:0 10px 26px rgba(37,99,235,.35);}
  .map-control.locate:hover{color:#fff; background:var(--accent-hover);}
  .layers-btn .filter-dot{width:8px; height:8px; border-radius:50%; background:var(--coral-fill);}
  .live-pill{position:absolute; bottom:14px; right:14px; z-index:400; background:var(--surface); padding:8px 14px; border-radius:20px; box-shadow:var(--shadow-card); font-size:11.5px; font-weight:600; display:flex; align-items:center; gap:7px; color:var(--ink);}
  [data-theme="dark"] .live-pill{background:var(--surface);}
  .live-pill .dot{width:8px; height:8px; background:#10B981; border-radius:50%; display:inline-block; animation:breathe 1.8s ease-in-out infinite;}

  .heat-toggle{position:absolute; bottom:14px; left:14px; z-index:400; background:rgba(255,255,255,.85); -webkit-border:1px solid rgba(255,255,255,.7); border-radius:18px; padding:9px 14px; box-shadow:var(--shadow-card); display:flex; align-items:center; gap:9px; font-size:12px; font-weight:600; color:var(--ink-secondary); cursor:pointer;}
  [data-theme="dark"] .heat-toggle{background:rgba(24,34,52,.85); border-color:rgba(255,255,255,.08);}
  .heat-switch{width:32px; height:18px; border-radius:20px; background:var(--border-strong); position:relative; transition:.2s; flex-shrink:0;}
  .heat-switch.on{background:var(--accent);}
  .heat-switch .knob{position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .heat-switch.on .knob{left:16px;}
  .layer-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:6px;}
  .layer-opt{display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 4px; border-radius:12px; border:1.5px solid var(--border); cursor:pointer; font-size:11px; color:var(--ink-secondary); background:var(--surface);}
  .layer-opt.on{border-color:var(--accent); background:var(--accent-bg); color:var(--accent-text);}
  .layer-opt i{font-size:19px;}
  .loc-banner{font-size:11px; text-align:center; padding:6px; background:var(--blue-bg); color:var(--blue-text); font-family:'IBM Plex Mono',monospace; align-items:center; justify-content:center;}

  /* Sliding bottom sheet (mobile map view) */
  .bottom-sheet{position:absolute; left:10px; right:10px; bottom:10px; z-index:500; background:rgba(255,255,255,.95); border-radius:20px; box-shadow:0 -6px 30px rgba(15,23,42,.16); max-height:64%; display:flex; flex-direction:column; transition:transform .35s cubic-bezier(.2,.9,.3,1); transform:translateY(calc(100% - 60px));}
  [data-theme="dark"] .bottom-sheet{background:rgba(26,36,54,.92);}
  .bottom-sheet.open{transform:translateY(0);}
  .bs-handle{padding:10px 16px 8px; cursor:pointer; position:relative;}
  .bs-bar{width:34px; height:4px; border-radius:4px; background:var(--border-strong); margin:0 auto 8px;}
  .bs-head-row{display:flex; align-items:center; justify-content:space-between;}
  .bs-title{font-size:13px; font-weight:700; text-transform:capitalize;}
  .bs-list{overflow-y:auto; padding:0 12px 12px; display:flex; flex-direction:column; gap:8px;}
  .place-card{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:10px 11px; cursor:pointer;}
  .p-icon{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0;}
  .p-body{flex:1; min-width:0;}
  .p-title{font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .p-sub{font-size:10.5px; color:var(--ink-muted); margin-top:1px;}
  .wait-badge{font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:20px; flex-shrink:0; display:flex; align-items:center; gap:5px;}
  .wait-badge .d{width:6px; height:6px; border-radius:50%; animation:breathe 1.8s ease-in-out infinite;}

  .weather-card{position:absolute; bottom:14px; right:14px; z-index:450; background:rgba(255,255,255,.85); -webkit-border:1px solid rgba(255,255,255,.7); border-radius:16px; padding:10px 14px; box-shadow:var(--shadow-card); display:none; align-items:center; gap:9px;}
  .leaflet-bottom.leaflet-right{right:auto !important; left:0 !important;}
  .leaflet-control-attribution{display:none !important;}
  [data-theme="dark"] .weather-card{background:rgba(24,34,52,.85); border-color:rgba(255,255,255,.08);}
  .weather-card.show{display:flex;}
  .weather-card i{font-size:22px; color:var(--amber-fill);}
  .weather-card .t{font-size:15px; font-weight:800;}
  .weather-card .d{font-size:10px; color:var(--ink-muted);}

  .d-photo{width:150px; height:104px; border-radius:14px; flex-shrink:0; background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; font-size:28px;}
  .d-crowd-panel{background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.6); border-radius:14px; padding:14px 16px; margin-top:12px;}
  .d-crowd-panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .d-crowd-panel-title{font-size:13px; font-weight:700;}
  .d-crowd-figs i{font-size:13px; margin-right:1px;}
  .crowd-badge{font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px;}

  .desktop-sidebar-body{display:none;}
  .nearby-page{position:fixed; top:24px; left:355px; right:24px; bottom:24px; z-index:900; overflow-y:auto; padding:28px 32px; border-radius:32px; background:rgba(255,255,255,.85); border:1px solid rgba(255,255,255,.7); box-shadow:0 20px 50px rgba(20,22,30,.14); transition:left .25s; scrollbar-width:none; -ms-overflow-style:none;}
  .nearby-page::-webkit-scrollbar{display:none;}
  .np-filters-overlay{display:none; position:fixed; inset:0; background:rgba(15,23,42,.4); z-index:2000; align-items:center; justify-content:center;}
  .np-filters-modal{background:#fff; border-radius:20px; padding:24px; width:360px; max-height:85vh; overflow-y:auto; box-shadow:0 30px 70px rgba(0,0,0,.25);}
  .np-cat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .np-cat-btn{display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 4px; border-radius:12px; border:1px solid var(--border); cursor:pointer; font-size:10.5px; color:var(--ink-secondary);}
  .np-cat-btn i{font-size:15px; color:var(--ink-secondary);}
  .np-cat-btn.active{background:var(--accent-bg); border-color:var(--accent); color:var(--accent-text);}
  .np-cat-btn.active i{color:var(--accent-text);}
  .np-rating-btn{flex:1; text-align:center; padding:9px 6px; border-radius:10px; border:1px solid var(--border); font-size:12px; font-weight:600; cursor:pointer; color:var(--ink-secondary);}
  .np-rating-btn.active{background:var(--accent-bg); border-color:var(--accent); color:var(--accent-text);}
  .np-toggle{position:relative; display:inline-block; width:40px; height:22px;}
  .np-toggle input{display:none;}
  .np-toggle-slider{position:absolute; inset:0; background:var(--border-strong); border-radius:20px; cursor:pointer; transition:.2s;}
  .np-toggle-slider::before{content:''; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s;}
  .np-toggle input:checked + .np-toggle-slider{background:var(--accent);}
  .np-toggle input:checked + .np-toggle-slider::before{transform:translateX(18px);}
  .app-shell.collapsed ~ .map-pane-desktop .nearby-page{left:132px;}
  [data-theme="dark"] .nearby-page{background:rgba(24,34,52,.85); border-color:rgba(255,255,255,.08);}
  .np-search{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 16px; margin-bottom:14px; box-shadow:0 2px 8px rgba(0,0,0,.04);}
  .np-search input{flex:1; border:none; outline:none; font-size:14px; background:none; color:var(--ink);}
  .np-chips{display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;}
  .np-chip{font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:20px; background:var(--surface-2); color:var(--ink-secondary); cursor:pointer; border:1px solid var(--border);}
  .np-chip.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .np-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:16px;}
  .np-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.05); transition:transform .2s, box-shadow .2s;}
  .np-card:hover{transform:translateY(-2px); box-shadow:0 10px 24px rgba(0,0,0,.1);}
  .np-photo{height:110px; background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; font-size:32px;}
  .np-body{padding:12px 14px;}
  .np-name{font-size:13.5px; font-weight:700; color:var(--ink);}
  .np-meta-row{display:flex; align-items:center; gap:6px; font-size:11.5px; margin:5px 0;}
  .np-rating{font-size:11.5px; color:var(--ink-secondary); margin-bottom:8px;}
  .np-dir-btn{width:100%; padding:8px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); font-size:12px; font-weight:600; color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;}
  .page-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;}
  .page-title{font-family:'Sora',sans-serif; font-size:20px; font-weight:800; color:var(--ink);}
  .page-stat-row{display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap;}
  .page-stat-card{flex:1; min-width:130px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px;}
  .page-stat-card .n{font-family:'Sora',sans-serif; font-size:24px; font-weight:800;}
  .page-stat-card .l{font-size:11.5px; color:var(--ink-secondary); margin-top:2px;}
  .tab-row{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:16px;}
  .tab-btn{padding:10px 14px; font-size:13px; font-weight:600; color:var(--ink-secondary); cursor:pointer; border-bottom:2px solid transparent;}
  .tab-btn.active{color:var(--accent); border-color:var(--accent);}
  .report-row{display:flex; align-items:center; gap:12px; padding:14px; background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:8px;}
  .report-icon{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
  .status-pill{font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; flex-shrink:0;}
  .col-list{display:flex; flex-direction:column; gap:4px;}
  .col-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; cursor:pointer; font-size:13px; color:var(--ink);}
  .col-item.active{background:var(--accent-bg); color:var(--accent-text); font-weight:600;}
  .chart-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px;}
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:12px; font-size:12.5px;}
  .bar-track{flex:1; height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:4px;}
  .settings-nav-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; font-size:13px; color:var(--ink-secondary); cursor:pointer;}
  .settings-nav-item.active{background:var(--accent-bg); color:var(--accent-text); font-weight:600;}
  @media (min-width:900px){
    .persona{display:none;}
    #filters{display:none;}
    #content{display:none;}
    #fab-holder{display:none;}
    .desktop-sidebar-body{display:block; padding:0 18px;}
    .ds-section-title{display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:700; color:var(--ink); margin-bottom:10px;}
    .ds-live-badge{display:flex; align-items:center; gap:5px; font-size:11px; font-weight:700; color:var(--teal-text);}
    .ds-live-dot{width:6px; height:6px; border-radius:50%; background:var(--teal-fill); box-shadow:0 0 0 3px var(--teal-bg); animation:breathe 1.8s ease-in-out infinite;}
    .ds-view-all{font-size:12px; font-weight:700; color:var(--accent-text); cursor:pointer;}
    .ds-stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:22px;}
    .ds-stat-card{background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:10px 7px;}
    .ds-stat-icon{width:24px; height:24px; border-radius:7px; display:flex; align-items:center; justify-content:center; margin-bottom:8px; font-size:11px;}
    .ds-stat-icon-round{width:30px; height:30px; border-radius:50%; font-size:13px;}
    .ds-stat-value{font-size:17px; font-weight:800; font-family:'Sora',sans-serif; color:var(--ink); letter-spacing:-.02em;}
    .ds-stat-label{font-size:9.5px; color:var(--ink-secondary); margin:1px 0 4px;}
    .ds-stat-delta{font-size:9.5px; font-weight:700;}
    .ds-places{display:flex; flex-direction:column; gap:2px; margin-bottom:20px;}
    .ds-place-row{display:flex; align-items:center; gap:10px; padding:7px 4px; border-radius:10px; cursor:pointer;}
    .ds-place-row:hover{background:var(--surface-2);}
    .ds-place-dot{width:28px; height:28px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px;}
    .ds-place-info{flex:1; min-width:0;}
    .ds-place-name{font-size:12.5px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .ds-place-meta{font-size:10.5px; color:var(--ink-muted);}
    .ds-place-time{font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px; flex-shrink:0;}
  }
  .desktop-nav{display:none;}
  .brand-collapse-desktop{display:none;}
  @media (min-width:900px){
    .brand-icons-mobile{display:none !important;}
    .brand-collapse-desktop{display:flex; width:28px; height:28px; border-radius:50%; border:1px solid var(--border); background:var(--surface); align-items:center; justify-content:center; color:var(--ink-muted); cursor:pointer;}
    #loc-banner{display:none !important;}
  }
  .promo-card{display:none;}
  .zoom-group{display:flex; flex-direction:column; background:rgba(255,255,255,.85); -webkit-border:1px solid rgba(255,255,255,.7); border-radius:14px; overflow:hidden; box-shadow:var(--shadow-card);}
  [data-theme="dark"] .zoom-group{background:rgba(24,34,52,.85); border-color:rgba(255,255,255,.08);}
  .zoom-group button{width:44px; height:38px; border:none; background:none; cursor:pointer; color:var(--ink-secondary); font-size:16px;}
  .zoom-group button:first-child{border-bottom:1px solid var(--border);}
  @media (min-width:900px){
    .desktop-nav{display:flex; flex-direction:column; gap:2px; padding:0 18px 18px;}
    .desktop-nav .nav-item{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px; font-size:14px; font-weight:500; color:var(--ink-secondary); cursor:pointer; transition:background .15s, color .15s;}
    .desktop-nav .nav-item i{font-size:18px; width:18px;}
    .desktop-nav .nav-item.active{background:var(--accent-bg); color:var(--accent-text); font-weight:600;}
    .desktop-nav .nav-item:hover:not(.active){background:var(--surface-2); color:var(--ink);}
    .promo-card{display:block; margin:0 18px 20px; background:linear-gradient(135deg,#6366F1 0%,#8B5CF6 55%,#A855F7 100%); border-radius:16px; padding:18px; color:#fff; position:relative; overflow:hidden; flex-shrink:0;}
    .promo-card::after{content:""; position:absolute; right:-30px; top:-30px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.12);}
    .promo-card p{font-size:14.5px; font-weight:700; margin:0 0 4px; position:relative;}
    .promo-card span{font-size:11.5px; opacity:.85; display:block; margin-bottom:14px; line-height:1.4; position:relative;}
    .promo-card button{width:100%; background:#fff; color:#3B5BFF; border:none; border-radius:9px; padding:8px; font-size:12px; font-weight:700; cursor:pointer;}
  }

  /* Adaptive desktop layout: side-by-side list + map instead of tabs */
  @media (min-width:900px){
    body{padding:0;}
    .frame{max-width:none; width:100%; padding:0; box-shadow:none; border-radius:0; background:var(--page);}
    .screen{flex-direction:row; height:100vh; border-radius:0; box-shadow:none; background:var(--page); padding:0; gap:0; position:relative;}
    .app-shell{display:flex; flex-direction:column; position:fixed; top:24px; left:24px; bottom:24px; width:307px; z-index:1000; background:rgba(255,255,255,.85); -webkit-border:1px solid rgba(255,255,255,.7); border-radius:40px; box-shadow:0 20px 60px rgba(15,23,42,.12); overflow:hidden; padding:0; transition:width .25s ease;}
    .app-shell.collapsed{width:84px;}
    .app-shell.collapsed .brand-left-text, .app-shell.collapsed .nav-item span, .app-shell.collapsed .desktop-sidebar-body, .app-shell.collapsed > .promo-card{display:none !important;}
    .app-shell.collapsed .desktop-nav .nav-item{justify-content:center; padding:10px;}
    .app-shell.collapsed .desktop-nav .nav-item i{margin:0;}
    .app-shell.collapsed .brand-collapse-desktop i{transform:rotate(180deg);}
    .app-shell.collapsed .persona{display:none !important;}
    .app-shell.collapsed .brand{justify-content:center;}
    .app-shell-scroll{flex:1; min-height:0; overflow-y:auto; padding:20px 0 6px; scrollbar-width:none; -ms-overflow-style:none;}
    .app-shell-scroll::-webkit-scrollbar{display:none;}
    [data-theme="dark"] .app-shell{background:rgba(24,34,52,.68); border-color:rgba(255,255,255,.08);}
    [data-theme="dark"] .card, [data-theme="dark"] .summary-strip{background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.08);}
    .map-pane-desktop{flex:1; width:100%; display:flex !important; flex-direction:column; border-radius:0; overflow:hidden; box-shadow:none;}
    .live-pill{display:none !important;}
    #bottomnav{display:none;}
  }
</style>
</head>
<body>

<div class="frame"><div class="screen" id="screen">
  <div class="app-shell">
  <div class="app-shell-scroll">
  <div class="mode-banner" id="mode-banner"></div>
  <div class="loc-banner" id="loc-banner" style="display:none;">
    <span id="loc-banner-text"></span>
    <button onclick="retryLocation()" style="margin-left:8px; font-size:11px; background:#fff; border:1px solid var(--blue-text); color:var(--blue-text); border-radius:12px; padding:2px 10px; cursor:pointer; font-family:'Inter',sans-serif;">Try again</button>
  </div>
  <div class="topbar">
    <div class="brand">
      <div class="wordmark"><span class="pulse-dot"></span><span class="brand-left-text">Pulse</span></div>
      <div class="brand-icons-mobile" style="display:flex; align-items:center; gap:14px;">
        <i class="ti ti-moon theme-toggle-icon" id="theme-toggle" onclick="toggleTheme()" style="font-size:19px; color:var(--ink-secondary); cursor:pointer;"></i>
        <i class="ti ti-bell" style="font-size:19px; color:var(--ink-secondary);"></i>
      </div>
      <div class="brand-collapse-desktop" id="brand-collapse-btn" onclick="toggleSidebarCollapse()"><i class="fa-solid fa-chevron-left" style="font-size:10px;"></i></div>
    </div>
    <div class="persona">
      <button id="persona-resident" class="active" onclick="setPersona('resident')">Resident</button>
      <button id="persona-owner" onclick="setPersona('owner')">Business owner</button>
    </div>
  </div>

  <div class="desktop-nav">
    <div class="nav-item active" id="nav-livemap" onclick="showDesktopPage('livemap')"><i class="fa-solid fa-location-dot"></i><span>Live Map</span></div>
    <div class="nav-item" id="nav-nearby" onclick="showDesktopPage('nearby')"><i class="fa-regular fa-compass"></i><span>Nearby</span></div>
    <div class="nav-item" id="nav-saved" onclick="showDesktopPage('saved')"><i class="fa-regular fa-bookmark"></i><span>Saved Places</span></div>
    <div class="nav-item" id="nav-reports" onclick="showDesktopPage('reports')"><i class="fa-solid fa-shield-halved"></i><span>Reports</span></div>
    <div class="nav-item" id="nav-analytics" onclick="showDesktopPage('analytics')"><i class="fa-solid fa-chart-line"></i><span>Analytics</span></div>
    <div class="nav-item" id="nav-settings" onclick="showDesktopPage('settings')"><i class="fa-solid fa-gear"></i><span>Settings</span></div>
  </div>

  <div id="desktop-sidebar-body" class="desktop-sidebar-body"></div>

  <div id="filters" class="filters"></div>
  <div id="content" class="content"></div>

  <div id="fab-holder"></div>
  <div id="toast" class="toast"></div>

  <div id="bottomnav" class="bottomnav">
    <button id="nav-feed" class="active" onclick="setTab('feed')"><i class="ti ti-list"></i>Feed</button>
    <button id="nav-map" onclick="setTab('map')"><i class="ti ti-map-2"></i>Map</button>
    <button id="nav-report" onclick="openReportModal()"><i class="ti ti-alert-triangle"></i>Report</button>
  </div>
  </div>
  <div class="promo-card">
    <p>Help improve Pulse</p>
    <span>Report wait times and help others.</span>
    <button onclick="openReportModal()">+ Report now</button>
  </div>
  </div>

  <div class="map-pane-desktop" id="map-pane-desktop" style="display:none;">
    <div id="nearby-page" class="nearby-page" style="display:none;"></div>
    <div id="saved-page" class="nearby-page" style="display:none;"></div>
    <div id="reports-page" class="nearby-page" style="display:none;"></div>
    <div id="analytics-page" class="nearby-page" style="display:none;"></div>
    <div id="settings-page" class="nearby-page" style="display:none;"></div>
    <div class="map-frame-overlay" id="map-frame-overlay"></div>
    <div class="map-wrap" style="flex:1;" id="map-wrap-el">
      <div id="leaflet-map"></div>
      <div class="search-bar-wrap">

// Demo data lives on a small fixed grid (x:0-340, y:0-460). Convert
// that into a tiny real-world offset near wherever the user actually
// is, so the tested demo dataset still makes sense on a real map.
function demoToLatLng(x, y){
  if(!userLoc) return {lat:33.6, lng:73.0};
  const dLat = (230 - y) / 230 * 0.01;
  const dLng = (x - 170) / 170 * 0.01;
  return {lat: userLoc.lat + dLat, lng: userLoc.lng + dLng};
}

function getUserLocation(){
  return new Promise(resolve => {
    if(!navigator.geolocation){ resolve({error:'not_supported'}); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({lat: pos.coords.latitude, lng: pos.coords.longitude}),
      err => {
        const reasons = {1:'permission_denied', 2:'position_unavailable', 3:'timeout'};
        resolve({error: reasons[err.code] || 'unknown_error'});
      },
      {timeout: 15000}
    );
  });
}

let searchDebounce = null;
function getRecentSearches(){
  try{ return JSON.parse(localStorage.getItem('pulse_recent_searches') || '[]'); }catch(e){ return []; }
}
function clearRecentSearches(which){

const RECENT_DOT_COLORS = ['var(--accent)','var(--teal-fill)','var(--amber-fill)','var(--coral-fill)','var(--purple)'];
function showRecentSearches(which){
  const resultsEl = document.getElementById('search-results-'+which);

  }

    html += `<div class="search-panel-head" style="margin-top:${recent.length?'6px':'0'};"><span>Suggestions</span></div>`;
    html += suggestions.map(l => `<div class="search-result-item" onclick="closeSearchPanel('${which}'); openDetail('${l.id}')"><span style="font-size:15px; width:18px; text-align:center; flex-shrink:0;">${emojiFor(l.icon)}</span>${l.name}</div>`).join('');

function closeSearchPanel(which){

function iconForNominatim(cls, type){
  const map = {
    restaurant:'fa-utensils', fast_food:'fa-utensils', cafe:'fa-mug-saucer', bar:'fa-martini-glass',
    fuel:'fa-gas-pump', hospital:'fa-hospital', clinic:'fa-suitcase-medical', pharmacy:'fa-suitcase-medical', doctors:'fa-suitcase-medical',
    hotel:'fa-bed', guest_house:'fa-bed', resort:'fa-umbrella-beach', motel:'fa-bed',
    bank:'fa-building-columns', atm:'fa-building-columns',
    school:'fa-graduation-cap', university:'fa-graduation-cap', college:'fa-graduation-cap',
    supermarket:'fa-cart-shopping', mall:'fa-cart-shopping', convenience:'fa-cart-shopping', shop:'fa-store',
    bus_station:'fa-bus', railway:'fa-train', airport:'fa-plane',
    park:'fa-tree', place_of_worship:'fa-place-of-worship', police:'fa-shield-halved',

  };
  return map[type] || map[cls] || 'fa-location-dot';
}
function onSearchInput(q, which){
  clearTimeout(searchDebounce);
  const resultsEl = document.getElementById('search-results-'+which);
  if(!q || q.trim().length < 3){
    if(!q){ showRecentSearches(which); } else { resultsEl.classList.remove('show'); }
    return;
  }
  searchDebounce = setTimeout(async ()=>{
    try{
      const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=5&q=' + encodeURIComponent(q);
      const res = await fetch(url);
      const results = await res.json();
      if(!results.length){
        resultsEl.innerHTML = `<div class="search-result-item" style="color:var(--ink-muted);">No matches found</div>`;
        resultsEl.classList.add('show');
        return;
      }
      resultsEl.innerHTML = results.map((r,i)=>
        `<div class="search-result-item" onclick='selectSearchResult(${r.lat},${r.lon},${JSON.stringify(r.display_name)},"${which}")'><i class="fa-solid ${iconForNominatim(r.class, r.type)}" style="color:var(--ink-muted); width:15px; flex-shrink:0;"></i>${r.display_name}</div>`
      ).join('');
      resultsEl.classList.add('show');
    }catch(e){
      resultsEl.classList.remove('show');
    }
  }, 400);
}

async function selectSearchResult(lat, lng, label, which){
  document.getElementById('search-results-'+which).classList.remove('show');
  const input = document.getElementById('search-input-'+which);
  if(input) input.value = label.split(',')[0];

  const shortLabel = label.split(',')[0];
  let recent = getRecentSearches().filter(r => r.label !== shortLabel);
  recent.unshift({lat, lng, label: shortLabel});
  recent = recent.slice(0, 5);
  localStorage.setItem('pulse_recent_searches', JSON.stringify(recent));

  userLoc = {lat, lng};
  usingRealLocation = true;
  document.getElementById('loc-banner').style.display = 'none';

  locations = locations.filter(l => !l.osm); // drop previous real-place results
  osmPlaces = [];
  render();

  if(leafletMap) leafletMap.setView([lat, lng], 15);

  const places = await fetchNearbyPlaces(lat, lng);
  osmPlaces = places;
  locations = locations.concat(places);
  render();
  fetchWeather(lat, lng);
}

async function fetchNearbyPlaces(lat, lng){
  const r = 2000;
  const query = `[out:json][timeout:20];(
    node["amenity"="restaurant"](around:${r},${lat},${lng});
    node["amenity"="fast_food"](around:${r},${lat},${lng});
    node["amenity"="cafe"](around:${r},${lat},${lng});
    node["shop"="bakery"](around:${r},${lat},${lng});
    node["amenity"="fuel"](around:${r},${lat},${lng});
    node["amenity"="pharmacy"](around:${r},${lat},${lng});
    node["amenity"="clinic"](around:${r},${lat},${lng});
    node["amenity"="hospital"](around:${r},${lat},${lng});
    node["amenity"="dentist"](around:${r},${lat},${lng});
    node["shop"="hairdresser"](around:${r},${lat},${lng});
    node["shop"="car_repair"](around:${r},${lat},${lng});
    node["amenity"="bank"](around:${r},${lat},${lng});
    node["shop"="laundry"](around:${r},${lat},${lng});
    node["shop"="dry_cleaning"](around:${r},${lat},${lng});
    node["shop"="supermarket"](around:${r},${lat},${lng});
    node["shop"="convenience"](around:${r},${lat},${lng});
  );out body 100;`;
  try{
    const res = await fetch('https://overpass-api.de/api/interpreter', {method:'POST', body: query});
    if(!res.ok) return [];
    const data = await res.json();
    const catMap = {
      restaurant:{category:'food', icon:'ti-tools-kitchen-2'},
      fast_food:{category:'food', icon:'ti-burger'},
      cafe:{category:'food', icon:'ti-coffee'},
      bakery:{category:'food', icon:'ti-bread'},
      fuel:{category:'fuel', icon:'ti-gas-station'},
      pharmacy:{category:'health', icon:'ti-first-aid-kit'},
      clinic:{category:'health', icon:'ti-stethoscope'},
      hospital:{category:'health', icon:'ti-building-hospital'},
      dentist:{category:'health', icon:'ti-stethoscope'},
      hairdresser:{category:'service', icon:'ti-scissors'},
      car_repair:{category:'service', icon:'ti-car'},
      bank:{category:'service', icon:'ti-building-bank'},
      laundry:{category:'errand', icon:'ti-wash'},
      dry_cleaning:{category:'errand', icon:'ti-wash'},
      supermarket:{category:'errand', icon:'ti-shopping-cart'},
      convenience:{category:'errand', icon:'ti-shopping-cart'},
    };
    const mapped = (data.elements || []).filter(el => el.tags && el.tags.name).map(el => {
      const kind = el.tags.amenity || el.tags.shop;
      const c = catMap[kind] || {category:'service', icon:'ti-map-pin'};
      return {
        id: 'osm_' + el.id, name: el.tags.name, category: c.category, icon: c.icon,
        distance: 'nearby', status: 'unknown', minutes: null, confirms: 0,
        updated: 'no reports yet', ownerOwned: false, ownerVerified: false,
        osm: true, lat: el.lat, lng: el.lon,
      };
    });
    // De-dupe: OSM sometimes has two nodes for the same real place.
    // Treat same name + within ~30m as a duplicate, keep the first.
    const deduped = [];
    for(const p of mapped){
      const dupe = deduped.find(x => x.name===p.name && Math.abs(x.lat-p.lat)<0.0003 && Math.abs(x.lng-p.lng)<0.0003);
      if(!dupe) deduped.push(p);
    }
    return deduped;
  }catch(e){ return []; }
}

let persona = 'resident';
let statBaseline = null; // set on first render — real session-start counts, used for honest % deltas
function deltaLabel(current, baseline){
  if(baseline == null || baseline === 0) return null;
  const pct = Math.round(((current - baseline) / baseline) * 100);
  if(pct === 0) return null;
  const sign = pct > 0 ? '\u2191' : '\u2193';
  const color = pct > 0 ? 'var(--teal-text)' : 'var(--coral-text)';
  return `<span style="color:${color};">${sign} ${Math.abs(pct)}%</span>`;
}

let leafletMapDiv = null; // persistent node, never destroyed by innerHTML re-renders

function roadFillColor(type){
  if(type==='police' || type==='camera') return 'var(--blue-fill)';
  if(type==='jam') return 'var(--amber-fill)';
  return 'var(--coral-fill)';
}
function roadLayerFor(type){
  return (type==='police' || type==='camera') ? 'police' : 'road';
}

let baseTileLayer = null;
function initMapIfNeeded(){
  if(leafletMap || typeof L === 'undefined') return;
  const center = userLoc || {lat:33.6, lng:73.0};
  const worldBounds = L.latLngBounds([-85,-185],[85,185]);
  leafletMap = L.map(leafletMapDiv, {zoomControl:false, minZoom:3, maxBounds:worldBounds, maxBoundsViscosity:1.0}).setView([center.lat, center.lng], 15);
  const startDark = document.documentElement.dataset.theme === 'dark';
  baseTileLayer = L.tileLayer(startDark ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png' : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    maxZoom:19, attribution:'&copy; OpenStreetMap contributors &copy; CARTO'
  }).addTo(leafletMap);
  let tileErrorCount = 0;
  baseTileLayer.on('tileerror', ()=>{
    tileErrorCount++;
    if(tileErrorCount === 6 && !satelliteOn){ // CARTO seems down/rate-limited — fall back to standard OSM tiles
      leafletMap.removeLayer(baseTileLayer);
      baseTileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(leafletMap);
      toast('Map tiles switched to a backup source');
    }
  });
  ['food','fuel','health','service','errand','road','police','signal'].forEach(cat=>{
    markerLayers[cat] = L.layerGroup().addTo(leafletMap);
  });
  if(userLoc && usingRealLocation){
    L.circleMarker([userLoc.lat, userLoc.lng], {radius:7, color:'#fff', weight:2, fillColor:'#378ADD', fillOpacity:1}).addTo(leafletMap);
  }
}

function pinIcon(iconClass, fill){
  return L.divIcon({className:'', html:`<div class="pin-dot" style="background:${fill};"><span style="font-size:13px;">${emojiFor(iconClass)}</span></div>`, iconSize:[26,26], iconAnchor:[13,26]});
}
function pinIconMinutes(minutes, fill){
  const label = minutes==null ? '?' : minutes;
  return L.divIcon({className:'', html:`<div style="width:32px;height:32px;border-radius:50%;background:${fill};border:2.5px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:800;font-family:'Inter',sans-serif;">${label}${minutes!=null?'<span style="font-size:7px;font-weight:700;margin-left:1px;">min</span>':''}</div>`, iconSize:[32,32], iconAnchor:[16,16]});
}

function updateMapMarkers(){
  if(!leafletMap) return;
  Object.values(markerLayers).forEach(lg=>lg.clearLayers());

  locations.forEach(l=>{
    if(!activeLayers[l.category]) return;
    const pos = l.osm ? [l.lat, l.lng] : (()=>{const p=demoToLatLng(l.x,l.y); return [p.lat,p.lng];})();
    const c = statusColors[l.status];
    L.marker(pos, {icon:pinIconMinutes(l.minutes, c.fill)}).addTo(markerLayers[l.category]).on('click', ()=>openDetail(l.id));
  });

  roadReports.forEach(r=>{
    const layer = roadLayerFor(r.type);
    if(!activeLayers[layer]) return;
    const p = demoToLatLng(r.x, r.y);
    L.marker([p.lat,p.lng], {icon:pinIcon(r.icon, roadFillColor(r.type))}).addTo(markerLayers[layer]).on('click', ()=>openRoadDetail(r.id));
  });

  if(activeLayers.signal){
    signals.forEach(s=>{
      const p = demoToLatLng(s.x, s.y);
      const fill = s.color==='red' ? 'var(--coral-fill)' : 'var(--teal-fill)';
      L.marker([p.lat,p.lng], {icon:pinIcon('ti-traffic-lights', fill)}).addTo(markerLayers.signal).on('click', ()=>openSignalDetail(s.id));
    });
  }
  updateLayersButtons();
}

function updateLayersButtons(){
  const allOn = Object.values(activeLayers).every(v=>v);
  const html = `<i class="ti ti-layers-2"></i>Layers ${allOn ? '' : '<span class="filter-dot"></span>'}`;
  ['layers-btn-desktop','layers-btn-mobile'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.innerHTML = html;
  });
}

function openLayersPanel(){
  const defs = [
    {k:'food',icon:'ti-tools-kitchen-2',label:'Food'},
    {k:'fuel',icon:'ti-gas-station',label:'Fuel'},

    {k:'service',icon:'ti-scissors',label:'Service'},

function positionMap(){
  if(!leafletMapDiv) return;
  const isDesktop = window.matchMedia('(min-width:900px)').matches;
  if(isDesktop){
    const wrap = document.querySelector('#map-pane-desktop .map-wrap');
    document.getElementById('map-pane-desktop').style.display = 'block';
    if(wrap && leafletMapDiv.parentElement !== wrap) wrap.appendChild(leafletMapDiv);
  } else if(tab==='map'){
    const wrap = document.getElementById('mobile-map-wrap');
    if(wrap && leafletMapDiv.parentElement !== wrap) wrap.appendChild(leafletMapDiv);
  } else {
    return; // mobile, not on Map tab — leave the div wherever it last was, off-screen is fine
  }
  initMapIfNeeded();
  updateMapMarkers();
  setTimeout(()=>{ if(leafletMap) leafletMap.invalidateSize(); }, 50);
}

function updateMapTheme(isDark){
  if(!leafletMap || !baseTileLayer || satelliteOn) return;
  leafletMap.removeLayer(baseTileLayer);
  baseTileLayer = L.tileLayer(
    isDark ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png' : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    {maxZoom:19, attribution:'&copy; OpenStreetMap contributors &copy; CARTO'}
  );
  baseTileLayer.addTo(leafletMap);
  baseTileLayer.bringToBack();
}
function toggleTheme(){
  const isDark = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = isDark ? 'light' : 'dark';
  localStorage.setItem('pulse_theme', isDark ? 'light' : 'dark');
  document.querySelectorAll('.theme-toggle-icon').forEach(el=>{ el.className = 'ti theme-toggle-icon ' + (isDark ? 'ti-moon' : 'ti-sun'); });
  document.querySelectorAll('.theme-toggle-emoji').forEach(el=>{ el.textContent = isDark ? '\u{1F319}' : '\u2600\uFE0F'; });
  updateMapTheme(!isDark);
}
(function applyStoredTheme(){
  const saved = localStorage.getItem('pulse_theme');
  if(saved === 'dark'){
    document.documentElement.dataset.theme = 'dark';
    document.querySelectorAll('.theme-toggle-icon').forEach(el=>{ el.className = 'ti theme-toggle-icon ti-sun'; });
    document.querySelectorAll('.theme-toggle-emoji').forEach(el=>{ el.textContent = '\u2600\uFE0F'; });

function animateCounters(scope){
  scope.querySelectorAll('.summary-stat .n, .ds-stat-value').forEach(el=>{
    const target = parseInt(el.textContent, 10);
    if(isNaN(target)) return;
    const duration = 500;
    const start = performance.now();
    function step(now){
      const progress = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = Math.round(target * eased);
      if(progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

let heatLayer = null;
let heatOn = false;
function toggleHeatmap(){
  if(!leafletMap) return;
  heatOn = !heatOn;
  document.querySelectorAll('.heat-switch').forEach(el=>el.classList.toggle('on', heatOn));
  if(heatOn){
    Object.values(markerLayers).forEach(lg=>leafletMap.removeLayer(lg));
    const pts = [];
    locations.forEach(l=>{
      if(!activeLayers[l.category]) return;
      const pos = l.osm ? [l.lat,l.lng] : (()=>{const p=demoToLatLng(l.x,l.y); return [p.lat,p.lng];})();
      const weight = l.status==='red' ? 1 : l.status==='amber' ? 0.6 : 0.3;
      for(let i=0;i<12;i++) pts.push([pos[0]+(Math.random()-0.5)*0.006, pos[1]+(Math.random()-0.5)*0.006, weight]);
    });
    heatLayer = L.heatLayer(pts, {radius:32, blur:24, maxZoom:17}).addTo(leafletMap);
  } else {
    if(heatLayer){ leafletMap.removeLayer(heatLayer); heatLayer = null; }
    Object.values(markerLayers).forEach(lg=>lg.addTo(leafletMap));
  }
}

async function loadWaitSparkline(id){
  const data = await api('/api/location-history?locationId=' + encodeURIComponent(id));
  const holder = document.getElementById('wait-sparkline-' + id);
  if(!holder || !data || !data.points || data.points.length < 2) return;
  const pts = data.points;
  const maxM = Math.max(...pts.map(p=>p.minutes), 1);
  const w = 100, h = 28;
  const coords = pts.map((p,i)=> {
    const x = pts.length===1 ? 0 : (i/(pts.length-1))*w;
    const y = h - (p.minutes/maxM)*h;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  holder.innerHTML = `<div style="margin:0 0 10px; padding-top:10px; border-top:1px solid var(--border);">
    <p style="font-size:11px; color:var(--ink-muted); margin:0 0 4px;">Recent wait times (real check-ins)</p>
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%; height:32px;"><polyline points="${coords}" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>
  </div>`;
}

async function rateLocation(id, stars){

  if(l.osm){

    if(res && res.id){ l.id = res.id; l.osm = false; id = res.id; }
  }
  const oldCount = l.ratingCount || 0;
  const oldSum = (l.ratingAvg || 0) * oldCount;
  l.ratingCount = oldCount + 1;
  l.ratingAvg = Math.round(((oldSum + stars) / l.ratingCount) * 10) / 10;
  api('/api/rate', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({locationId:id, stars})});
  toast('Thanks for rating!');
  closeModal();
  render();
}

async function resolveLocation(){
  const locBanner = document.getElementById('loc-banner');
  const locBannerText = document.getElementById('loc-banner-text');
  const loc = await getUserLocation();
  const fallback = {lat: 33.6, lng: 73.0};
  const gotRealLocation = loc && !loc.error;
  const centerForPlaces = gotRealLocation ? loc : (userLoc || fallback);
  if(gotRealLocation){
    userLoc = loc; usingRealLocation = true;
    locBanner.style.display = 'none';
  } else {
    if(!userLoc){ userLoc = fallback; usingRealLocation = false; }
    const reasonText = {
      permission_denied: 'Location permission denied',
      position_unavailable: "This device can't get a location fix",
      timeout: "Couldn't get a location fix (common on desktops without GPS)",
      not_supported: "This browser doesn't support location",
      unknown_error: 'Could not get location',
    };
    locBannerText.textContent = (reasonText[loc && loc.error] || 'Could not get location') + ' \u2014 try again, or just search your area above';
    locBanner.style.display = 'flex';
  }
  render();
  if(leafletMap) leafletMap.setView([centerForPlaces.lat, centerForPlaces.lng], 15);

  locations = locations.filter(l => !l.osm);
  const places = await fetchNearbyPlaces(centerForPlaces.lat, centerForPlaces.lng);
  osmPlaces = places;
  locations = locations.concat(places);
  render();
  fetchWeather(centerForPlaces.lat, centerForPlaces.lng);
}

const WEATHER_CODE_ICON = {
  0:['ti-sun','Clear sky'], 1:['ti-sun','Mainly clear'], 2:['ti-cloud','Partly cloudy'], 3:['ti-cloud','Overcast'],
  45:['ti-cloud-fog','Fog'], 48:['ti-cloud-fog','Fog'],
  51:['ti-cloud-drizzle','Drizzle'], 53:['ti-cloud-drizzle','Drizzle'], 55:['ti-cloud-drizzle','Drizzle'],
  61:['ti-cloud-rain','Light rain'], 63:['ti-cloud-rain','Rain'], 65:['ti-cloud-rain','Heavy rain'],
  71:['ti-snowflake','Light snow'], 73:['ti-snowflake','Snow'], 75:['ti-snowflake','Heavy snow'],
  80:['ti-cloud-rain','Showers'], 81:['ti-cloud-rain','Showers'], 82:['ti-cloud-rain','Violent showers'],
  95:['ti-cloud-bolt','Thunderstorm'], 96:['ti-cloud-bolt','Thunderstorm'], 99:['ti-cloud-bolt','Thunderstorm'],
};
async function fetchWeather(lat, lng){
  let wx = null, aq = null;
  try{
    const wxRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,weather_code`);
    if(wxRes.ok) wx = await wxRes.json();
  }catch(e){ console.warn('Weather fetch failed', e); }
  try{
    const aqRes = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lng}&current=us_aqi`);
    if(aqRes.ok) aq = await aqRes.json();
  }catch(e){ console.warn('AQI fetch failed', e); }

  if(!wx || !wx.current) return;
  const temp = Math.round(wx.current.temperature_2m);
  const [icon, label] = WEATHER_CODE_ICON[wx.current.weather_code] || ['ti-cloud', 'Weather'];
  const aqi = aq && aq.current ? Math.round(aq.current.us_aqi) : null;
  const html = `<i class="ti ${icon}"></i><div><div class="t">${temp}\u00B0C</div><div class="d">${label}${aqi!=null?' \u00B7 AQI '+aqi:''}</div></div>`;
  ['weather-card-desktop','weather-card-mobile'].forEach(id=>{
    const el = document.getElementById(id);
    if(el){ el.innerHTML = html; el.classList.add('show'); }
  });
}

async function boot(){
  leafletMapDiv = document.getElementById('leaflet-map');
  const banner = document.getElementById('mode-banner');

  const data = await api('/api/feed');
  if(data){
    locations = data.locations;
    roadReports = data.roadReports;
    signals = data.signals;
    realStats = data.stats || null;
    banner.classList.remove('show');
  } else {
    banner.textContent = API_BASE ? 'Could not reach the API \u2014 showing demo data' : 'Demo mode \u2014 showing sample data';
    banner.classList.add('show');
  }

  render(); // show demo data immediately, don't block on location/Overpass
  await resolveLocation();

  sendHeartbeat();
  setInterval(sendHeartbeat, 30000);
  setInterval(async ()=>{

// ---------- Analytics (real aggregation via /api/analytics — no invented numbers) ----------
async function renderAnalyticsPage(){
  const page = document.getElementById('analytics-page');
  page.innerHTML = `<p style="color:var(--ink-muted); font-size:13px;">Loading real analytics from your check-in history...</p>`;
  const data = await api('/api/analytics');
  if(!data){ page.innerHTML = `<p style="color:var(--ink-muted); font-size:13px;">Couldn't load analytics right now.</p>`; return; }

  const daily = data.dailyAvgWait || [];
  const hourly = data.hourlyCheckins || [];
  const busiest = data.busiestLocations || [];
  const byType = data.reportsByType || [];

  const avgOverall = daily.length ? Math.round(daily.reduce((s,d)=>s+d.avgMinutes,0)/daily.length) : null;
  const maxHourly = Math.max(1, ...hourly.map(h=>h.count));
  const peakHour = hourly.length ? hourly.reduce((a,b)=>b.count>a.count?b:a, hourly[0]) : null;
  const maxBusy = Math.max(1, ...busiest.map(b=>b.checkins));
  const typeColors = {hazard:'var(--amber-fill)', closure:'var(--coral-fill)', jam:'var(--amber-fill)', police:'var(--accent)', camera:'var(--purple)'};
  const totalTyped = byType.reduce((s,t)=>s+t.count,0);

  page.innerHTML = `
    <div class="page-header"><div class="page-title">Analytics</div><span style="font-size:12px; color:var(--ink-muted);">Based on real check-ins &amp; reports from your database</span></div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;">
      <div class="chart-card">
        <p style="font-size:12px; font-weight:700; color:var(--ink-muted); margin:0 0 4px;">Average Wait Time</p>
        <p style="font-size:24px; font-weight:800; font-family:'Sora',sans-serif; margin:0 0 12px;">${avgOverall==null?'No data yet':avgOverall+' min'}</p>
        ${daily.length>=2 ? `<svg viewBox="0 0 300 80" style="width:100%; height:80px;"><polyline points="${daily.map((d,i)=>`${(i/(daily.length-1))*300},${80-(d.avgMinutes/Math.max(...daily.map(x=>x.avgMinutes),1))*70}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5"/></svg>` : `<p style="font-size:12px; color:var(--ink-muted);">Needs at least 2 days of check-ins to chart a trend.</p>`}
      </div>
      <div class="chart-card">
        <p style="font-size:12px; font-weight:700; color:var(--ink-muted); margin:0 0 4px;">Busiest Time</p>
        <p style="font-size:24px; font-weight:800; font-family:'Sora',sans-serif; margin:0 0 12px;">${peakHour ? peakHour.hour+':00 \u2013 '+((peakHour.hour+1)%24)+':00' : 'No data yet'}</p>
        <div style="display:flex; align-items:flex-end; gap:2px; height:70px;">
          ${hourly.length ? Array.from({length:24},(_,h)=>{
            const found = hourly.find(x=>x.hour===h);
            const n = found ? found.count : 0;
            return `<div style="flex:1; height:${(n/maxHourly)*100}%; background:var(--accent); border-radius:2px; min-height:2px;" title="${h}:00 - ${n} check-ins"></div>`;
          }).join('') : `<p style="font-size:12px; color:var(--ink-muted);">No check-in data yet.</p>`}
        </div>
      </div>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
      <div class="chart-card">
        <p style="font-size:12px; font-weight:700; color:var(--ink-muted); margin:0 0 12px;">Busiest Places</p>
        ${busiest.length ? busiest.map(b=>`<div class="bar-row"><span style="width:100px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${b.name}</span><div class="bar-track"><div class="bar-fill" style="width:${(b.checkins/maxBusy)*100}%; background:var(--accent);"></div></div><span style="width:70px; text-align:right; flex-shrink:0; color:var(--ink-muted);">${b.checkins} check-ins</span></div>`).join('') : `<p style="font-size:12px; color:var(--ink-muted);">No check-ins recorded yet.</p>`}
      </div>
      <div class="chart-card">
        <p style="font-size:12px; font-weight:700; color:var(--ink-muted); margin:0 0 12px;">Reports Overview</p>
        ${byType.length ? byType.map(t=>{
          const meta = REPORT_TYPE_META[t.type] || {label:t.type};
          const color = typeColors[t.type] || 'var(--ink-muted)';
          return `<div class="bar-row"><span style="width:90px; flex-shrink:0;">${meta.label}</span><div class="bar-track"><div class="bar-fill" style="width:${totalTyped?(t.count/totalTyped)*100:0}%; background:${color};"></div></div><span style="width:40px; text-align:right; flex-shrink:0; color:var(--ink-muted);">${t.count}</span></div>`;
        }).join('') : `<p style="font-size:12px; color:var(--ink-muted);">No road reports recorded yet.</p>`}
      </div>
    </div>
  `;
}

function getSavedCollections(){
  try{ return JSON.parse(localStorage.getItem('pulse_saved_collections') || '{"Favorites":[]}'); }
  catch(e){ return {"Favorites":[]}; }
}
function setSavedCollections(obj){ localStorage.setItem('pulse_saved_collections', JSON.stringify(obj)); }
function isSaved(locationId){
  const cols = getSavedCollections();
  return Object.values(cols).some(arr => arr.includes(String(locationId)));
}
function toggleSaveLocation(locationId, collection){
  const cols = getSavedCollections();
  const c = collection || 'Favorites';
  if(!cols[c]) cols[c] = [];
  const idx = cols[c].indexOf(String(locationId));
  if(idx >= 0) cols[c].splice(idx, 1);
  else cols[c].push(String(locationId));
  setSavedCollections(cols);
  toast(idx >= 0 ? 'Removed from '+c : 'Saved to '+c);
  const btn = document.getElementById('save-btn-'+locationId);
  if(btn) btn.innerHTML = isSaved(locationId) ? '<i class="fa-solid fa-bookmark"></i>' : '<i class="fa-regular fa-bookmark"></i>';
}

function setSavedCollection(name){ savedActiveCollection = name; renderSavedPage(); }

  const name = prompt('New collection name:');
  if(!name || !name.trim()) return;
  const cols = getSavedCollections();
  if(!cols[name]) cols[name] = [];
  setSavedCollections(cols);
  savedActiveCollection = name;
  renderSavedPage();

        <p style="font-size:12px; font-weight:700; color:var(--ink-muted); margin-bottom:10px;">Categories</p>
        <div class="np-cat-grid">
          ${NP_CATEGORIES.map(c=>`<div class="np-cat-btn ${npFilters.category===c.k?'active':''}" data-k="${c.k}" onclick="setNpCategory('${c.k}')"><i class="fa-solid ${c.icon}"></i><span>${c.label}</span></div>`).join('')}
        </div>
        <p style="font-size:12px; font-weight:700; color:var(--ink-muted); margin:18px 0 8px;">Distance</p>
        <div style="display:flex; align-items:center; gap:10px;">
          <span style="font-size:11px; color:var(--ink-muted);">0.1 mi</span>
          <input type="range" min="1" max="50" value="25" style="flex:1;">
          <span style="font-size:11px; color:var(--ink-muted);">5 mi</span>
        </div>
        <p style="font-size:12px; font-weight:700; color:var(--ink-muted); margin:18px 0 8px;">Rating</p>
        <div style="display:flex; gap:8px;">
          <div class="np-rating-btn" data-r="4" onclick="setNpRating(4)">4+ <i class="fa-solid fa-star" style="font-size:10px; color:#F59E0B;"></i></div>
          <div class="np-rating-btn" data-r="3" onclick="setNpRating(3)">3+ <i class="fa-solid fa-star" style="font-size:10px; color:#F59E0B;"></i></div>
          <div class="np-rating-btn" data-r="2" onclick="setNpRating(2)">2+ <i class="fa-solid fa-star" style="font-size:10px; color:#F59E0B;"></i></div>
          <div class="np-rating-btn active" data-r="0" onclick="setNpRating(0)">Any</div>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between; margin-top:18px;">
          <p style="font-size:13px; font-weight:600; margin:0;">Open Now</p>
          <label class="np-toggle"><input type="checkbox"><span class="np-toggle-slider"></span></label>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between; margin-top:16px;">
          <p style="font-size:13px; font-weight:600; margin:0;">Sort By</p>
          <select id="np-sort-select" style="padding:8px 12px; border-radius:9px; border:1px solid var(--border); font-size:12.5px;">
            <option value="distance" ${npFilters.sortBy==='distance'?'selected':''}>Distance</option>
            <option value="rating" ${npFilters.sortBy==='rating'?'selected':''}>Rating</option>
            <option value="wait" ${npFilters.sortBy==='wait'?'selected':''}>Wait time</option>
          </select>
        </div>
        <div style="display:flex; gap:10px; margin-top:22px;">
          <button onclick="resetNpFilters()" style="flex:1; padding:12px; border-radius:11px; border:1px solid var(--border); background:var(--surface); font-weight:600; font-size:13px; cursor:pointer;">Reset</button>
          <button onclick="applyNpFilters()" class="primary-btn" style="flex:1; margin-bottom:0;">Apply Filters</button>
        </div>
      </div>
    </div>
  `;
}

function toggleSidebarCollapse(){
  document.querySelector('.app-shell').classList.toggle('collapsed');
}
boot();

document.addEventListener('click', (e)=>{
  document.querySelectorAll('.search-results.show').forEach(panel=>{
    if(!panel.closest('.search-bar-wrap').contains(e.target)){
      panel.classList.remove('show');
    }
  });
});

document.addEventListener('keydown', (e)=>{
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==='k'){
    e.preventDefault();
    const input = document.getElementById('search-input-desktop') || document.getElementById('search-input-mobile');
    if(input) input.focus();
  }
});
</script>
</body>
</html>
