<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse — what's happening near you</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#12233B">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<style>
  :root{
    --bg:#F6F8FB; --page:#F6F8FB; --surface:#FFFFFF; --surface-2:#F1F5F9;
    --ink:#0F172A; --ink-secondary:#64748B; --ink-muted:#94A3B8;
    --border:#E2E8F0; --border-strong:#CBD5E1;
    --accent:#2563EB; --accent-hover:#1D4ED8; --accent-bg:#DBEAFE; --accent-text:#1D4ED8;
    --teal-bg:#DCFCE7; --teal-text:#15803D; --teal-fill:#22C55E;
    --amber-bg:#FEF3C7; --amber-text:#B45309; --amber-fill:#F59E0B;
    --coral-bg:#FEE2E2; --coral-text:#B91C1C; --coral-fill:#EF4444;
    --blue-bg:#DBEAFE; --blue-text:#1D4ED8; --blue-fill:#2563EB;
    --radius:14px;
  }
  [data-theme="dark"]{
    --bg:#0F172A; --page:#0B1220; --surface:#1A2436; --surface-2:#212D42;
    --ink:#F1F5F9; --ink-secondary:#B0BAC9; --ink-muted:#8B98A3;
    --border:#2E3B52; --border-strong:#40506D;
    --accent:#3B82F6; --accent-hover:#60A5FA; --accent-bg:#1E3A5F; --accent-text:#93C5FD;
    --teal-bg:#0F3A2E; --teal-text:#5DCAA5; --teal-fill:#22C55E;
    --amber-bg:#4A3208; --amber-text:#F9C765; --amber-fill:#F59E0B;
    --coral-bg:#4A2013; --coral-text:#F0997B; --coral-fill:#EF4444;
    --blue-bg:#1E3A5F; --blue-text:#93C5FD; --blue-fill:#3B82F6;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--page); font-family:'Inter',sans-serif; color:var(--ink); display:flex; justify-content:center;}
  .frame{width:100%; max-width:460px; min-height:100vh; background:var(--bg); padding:0;}
  .screen{background:var(--surface); height:100vh; display:flex; flex-direction:column; overflow:hidden; position:relative;}
  @media (min-width:461px){
    body{padding:32px 16px;}
    .frame{min-height:auto; border-radius:36px; padding:12px; box-shadow:0 20px 60px rgba(18,35,59,0.18);}
    .screen{height:700px; border-radius:26px;}
  }
  .mode-banner{font-size:11px; text-align:center; padding:6px; background:var(--amber-bg); color:var(--amber-text); display:none; font-family:'IBM Plex Mono',monospace;}
  .mode-banner.show{display:block;}

  .topbar{padding:18px 18px 10px;}
  .brand{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .wordmark{font-family:'Inter',sans-serif; font-size:22px; font-weight:800; color:var(--accent); display:flex; align-items:center; gap:8px;}
  .pulse-dot{width:9px; height:9px; border-radius:50%; background:var(--teal-fill); animation:breathe 1.8s ease-in-out infinite;}
  @keyframes breathe{0%,100%{opacity:1; transform:scale(1);} 50%{opacity:0.4; transform:scale(0.75);}}

  .persona{display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:3px;}
  .persona button{flex:1; border:none; background:none; padding:7px 8px; font-family:'Inter',sans-serif; font-size:12px; font-weight:500; color:var(--ink-secondary); border-radius:8px; cursor:pointer;}
  .persona button.active{background:var(--surface); color:var(--accent); box-shadow:0 3px 12px rgba(0,0,0,.08);}

  .filters{display:flex; gap:6px; overflow-x:auto; padding:0 18px 12px; }
  .filters::-webkit-scrollbar{display:none;}
  .chip{white-space:nowrap; font-size:13px; padding:9px 15px; border-radius:20px; border:none; color:var(--ink-secondary); background:var(--surface-2); cursor:pointer; font-family:'Inter',sans-serif; font-weight:600; transition:.15s; display:inline-flex; align-items:center; gap:6px;}
  .chip.active{background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 6px 16px rgba(37,99,235,.3);}

  .content{flex:1; overflow-y:auto; padding:0 14px 14px; display:flex; flex-direction:column; gap:10px;}

  .card{background:var(--surface); border-radius:18px; padding:16px; cursor:pointer; border:1px solid var(--border); transition:transform .2s, box-shadow .2s;}
  .card:hover{transform:translateY(-2px); box-shadow:0 12px 28px rgba(15,23,42,.08); border-color:var(--border-strong);}
  .card-row{display:flex; gap:11px; align-items:flex-start;}
  .icon-badge{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:17px;}
  .card-body{flex:1; min-width:0;}
  .card-title{font-size:14px; font-weight:600; margin:0; display:flex; align-items:center; gap:6px;}
  .card-sub{font-size:12px; color:var(--ink-secondary); margin:3px 0 0;}
  .card-right{text-align:right; flex-shrink:0;}
  .card-metric{font-family:'Inter',sans-serif; font-size:17px; font-weight:700; animation:num-pulse 2.4s ease-in-out infinite;}
  @keyframes num-pulse{0%,100%{opacity:1;} 50%{opacity:.75;}}
  .card-label{font-size:10px; color:var(--ink-muted); margin-top:2px; font-family:'IBM Plex Mono',monospace; letter-spacing:.02em;}
  .badge-owner{font-size:10px; background:var(--blue-bg); color:var(--blue-text); padding:2px 7px; border-radius:20px; display:inline-flex; align-items:center; gap:3px; font-family:'Inter',sans-serif; font-weight:500;}
  .status-dot{width:7px; height:7px; border-radius:50%; display:inline-block; animation:breathe 1.8s ease-in-out infinite;}

  .section-label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-muted); font-family:'IBM Plex Mono',monospace; padding:6px 6px 2px; scroll-margin-top:10px;}
  .jump-nav{display:flex; gap:6px; padding:2px 0 8px; position:sticky; top:0; background:var(--surface); z-index:5;}
  .jump-nav button{font-size:11px; padding:6px 12px; border-radius:14px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink-secondary); cursor:pointer; font-family:'Inter',sans-serif;}
  .summary-strip{display:flex; gap:8px; padding:0; margin-bottom:10px;}
  .summary-stat{text-align:left; flex:1; min-width:0; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:10px 12px; box-shadow:0 4px 14px rgba(15,23,42,.04);}
  .summary-stat .n{font-size:18px; font-weight:800; font-family:'Inter',sans-serif; font-variant-numeric:tabular-nums;}
  .summary-stat .l{font-size:9.5px; color:var(--ink-muted); margin-top:2px; text-transform:uppercase; letter-spacing:.04em; font-family:'IBM Plex Mono',monospace;}

  .bottomnav{display:flex; border-top:1px solid var(--border); background:var(--surface);}
  .bottomnav button{flex:1; border:none; background:none; padding:12px 0 10px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; color:var(--ink-muted); cursor:pointer; font-family:'Inter',sans-serif;}
  .bottomnav button i{font-size:20px;}
  .bottomnav button.active{color:var(--ink);}

  .fab{position:absolute; right:16px; bottom:78px; z-index:1200; background:var(--accent); color:#fff; border:none; border-radius:24px; padding:11px 18px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; cursor:pointer; font-family:'Inter',sans-serif; box-shadow:0 15px 35px rgba(37,99,235,.35);}

  .overlay{position:absolute; inset:0; background:rgba(18,35,59,0.45); display:flex; align-items:flex-end; justify-content:center; z-index:1300;}
  .overlay .sheet{max-width:460px;}
  .sheet{background:var(--surface); width:100%; border-radius:22px 22px 0 0; padding:18px; max-height:90%; overflow-y:auto; transform:translateY(100%); transition:transform .3s cubic-bezier(.2,.9,.3,1);}
  .sheet.in{transform:translateY(0);}
  .sheet-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;}
  .sheet-title{font-family:'Inter',sans-serif; font-size:16px; font-weight:700; margin:0;}
  .sheet-sub{font-size:12px; color:var(--ink-secondary); margin:3px 0 0;}
  .close-btn{background:var(--surface-2); border:none; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-secondary);}

  .big-metric{text-align:center; padding:14px 0;}
  .big-metric .num{font-family:'Inter',sans-serif; font-size:40px; font-weight:800; line-height:1;}
  .big-metric .cap{font-size:11px; color:var(--ink-muted); font-family:'IBM Plex Mono',monospace; margin-top:6px;}

  .opt-btn{width:100%; text-align:left; padding:13px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface); margin-bottom:8px; font-size:13px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; font-family:'Inter',sans-serif; color:var(--ink);}
  .opt-btn:hover{border-color:var(--border-strong);}
  .opt-btn.selected{border-color:var(--blue-fill); background:var(--blue-bg); color:var(--blue-text);}

  .type-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; margin-bottom:14px;}
  .type-opt{padding:14px 6px; border-radius:12px; border:1px solid var(--border); display:flex; flex-direction:column; align-items:center; gap:7px; cursor:pointer; font-size:11px; color:var(--ink-secondary); background:var(--surface);}
  .type-opt i{font-size:20px;}
  .type-opt.selected{border-color:var(--accent); background:var(--accent-bg); color:var(--accent-text);}

  select, input[type=text]{width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--border); font-size:13px; font-family:'Inter',sans-serif; background:var(--surface); color:var(--ink); margin-bottom:12px;}

  .primary-btn{width:100%; padding:13px; background:var(--accent); color:#fff; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif;}
  .status-set{display:flex; gap:8px; margin-bottom:12px;}
  .status-set button{flex:1; padding:11px 4px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface); font-size:12px; font-weight:500; cursor:pointer; font-family:'Inter',sans-serif; color:var(--ink-secondary);}
  .status-set button.sel-green.selected{border-color:var(--teal-fill); background:var(--teal-bg); color:var(--teal-text);}
  .status-set button.sel-amber.selected{border-color:var(--amber-fill); background:var(--amber-bg); color:var(--amber-text);}
  .status-set button.sel-red.selected{border-color:var(--coral-fill); background:var(--coral-bg); color:var(--coral-text);}

  .owner-card{background:var(--surface-2); border-radius:16px; padding:16px; margin-bottom:14px;}
  .owner-card-head{display:flex; gap:10px; align-items:center; margin-bottom:14px;}
  .owner-note{font-size:12px; color:var(--ink-secondary); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 10px; margin-top:2px;}

  .toast{position:absolute; bottom:88px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:24px; font-size:12px; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:20; white-space:nowrap; font-family:'Inter',sans-serif;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .empty{text-align:center; padding:40px 20px; color:var(--ink-muted); font-size:13px;}

  svg text{font-family:'Inter',sans-serif;}
  .map-pin{cursor:pointer;}
  .search-bar-wrap{position:absolute; top:14px; left:14px; right:130px; z-index:450; padding:0; border:none; background:none; flex-shrink:0; display:flex; align-items:center; gap:10px;}
  .search-bar-wrap .search-icon{font-size:15px; flex-shrink:0; position:absolute; left:16px; z-index:1; color:var(--ink-muted);}
  .search-input{flex:1; padding:13px 16px 13px 40px; border-radius:16px; border:none; font-size:14px; font-family:'Inter',sans-serif; background:rgba(255,255,255,.9); backdrop-filter:blur(14px); color:var(--ink); box-shadow:0 10px 28px rgba(15,23,42,.14);}
  [data-theme="dark"] .search-input{background:rgba(26,36,54,.8);}
  .search-results{position:absolute; left:0; right:0; top:50px; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:0 8px 24px rgba(18,35,59,0.15); z-index:1250; max-height:240px; overflow-y:auto; display:none;}
  [data-theme="dark"] .search-results{background:rgba(26,36,54,.85); backdrop-filter:blur(20px);}
  .search-results.show{display:block;}
  .search-result-item{padding:11px 14px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--border);}
  .search-result-item:last-child{border-bottom:none;}
  .search-result-item:hover{background:var(--surface-2);}

  .legend{position:absolute; bottom:0; left:0; right:0; background:rgba(255,255,255,0.96); border-top:1px solid var(--border); padding:10px 14px; display:flex; flex-wrap:wrap; gap:10px 14px;}
  .legend span{font-size:10px; color:var(--ink-secondary); display:flex; align-items:center; gap:5px;}
  .legend .dot{width:8px; height:8px; border-radius:50%;}

  /* Real map */
  #leaflet-map{width:100%; height:100%; background:var(--surface-1, #EEF2F1);}
  .map-wrap{position:relative; flex:1; min-height:0; border-radius:20px; overflow:hidden; box-shadow:0 10px 34px rgba(15,23,42,.10);}
  .leaflet-div-icon{background:none; border:none;}
  .pin-dot{width:26px; height:26px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(18,35,59,0.3); border:2px solid #fff;}
  .pin-dot i{transform:rotate(45deg); font-size:12px; color:#fff;}
  .badge-demo{font-size:9px; background:var(--surface-1); color:var(--ink-muted); padding:1px 6px; border-radius:20px; font-family:'IBM Plex Mono',monospace;}
  .badge-real{font-size:9px; background:var(--blue-bg); color:var(--blue-text); padding:1px 6px; border-radius:20px; font-family:'IBM Plex Mono',monospace;}
  .layers-btn{position:absolute; top:14px; right:66px; z-index:400; background:rgba(255,255,255,.88); backdrop-filter:blur(14px); color:var(--ink); border:none; border-radius:18px; padding:12px 18px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; cursor:pointer; box-shadow:0 10px 28px rgba(15,23,42,.14); font-family:'Inter',sans-serif;}
  [data-theme="dark"] .layers-btn{background:rgba(26,36,54,.75);}
  .map-controls{position:absolute; right:14px; top:14px; z-index:400; display:flex; flex-direction:column; gap:10px;}
  .map-control{width:44px; height:44px; background:rgba(255,255,255,.88); backdrop-filter:blur(14px); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; box-shadow:0 10px 26px rgba(15,23,42,.14); cursor:pointer; border:none; transition:.15s; color:var(--ink-secondary);}
  [data-theme="dark"] .map-control{background:rgba(26,36,54,.75);}
  .map-control:hover{transform:scale(1.08); color:var(--accent);}
  .map-control.on{background:var(--accent); color:#fff;}
  .map-control.locate{background:var(--accent); color:#fff; box-shadow:0 10px 26px rgba(37,99,235,.35);}
  .map-control.locate:hover{color:#fff; background:var(--accent-hover);}
  .live-pill{position:absolute; bottom:14px; right:14px; z-index:400; background:rgba(255,255,255,.88); backdrop-filter:blur(14px); padding:8px 14px; border-radius:20px; box-shadow:0 8px 22px rgba(15,23,42,.12); font-size:11.5px; font-weight:600; display:flex; align-items:center; gap:7px; color:var(--ink);}
  [data-theme="dark"] .live-pill{background:rgba(26,36,54,.75);}
  .live-pill .dot{width:8px; height:8px; background:#10B981; border-radius:50%; display:inline-block; animation:breathe 1.8s ease-in-out infinite;}
  .layers-btn .filter-dot{width:8px; height:8px; border-radius:50%; background:var(--coral-fill);}

  .heat-toggle{position:absolute; bottom:14px; left:14px; z-index:400; background:rgba(255,255,255,.88); backdrop-filter:blur(14px); border-radius:18px; padding:9px 14px; box-shadow:0 10px 26px rgba(15,23,42,.14); display:flex; align-items:center; gap:9px; font-size:12px; font-weight:600; color:var(--ink-secondary); cursor:pointer;}
  [data-theme="dark"] .heat-toggle{background:rgba(26,36,54,.75);}
  .heat-switch{width:32px; height:18px; border-radius:20px; background:var(--border-strong); position:relative; transition:.2s; flex-shrink:0;}
  .heat-switch.on{background:var(--accent);}
  .heat-switch .knob{position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .heat-switch.on .knob{left:16px;}
  .layer-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:6px;}
  .layer-opt{display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 4px; border-radius:12px; border:1.5px solid var(--border); cursor:pointer; font-size:11px; color:var(--ink-secondary); background:var(--surface);}
  .layer-opt.on{border-color:var(--accent); background:var(--accent-bg); color:var(--accent-text);}
  .layer-opt i{font-size:19px;}
  .loc-banner{font-size:11px; text-align:center; padding:6px; background:var(--blue-bg); color:var(--blue-text); font-family:'IBM Plex Mono',monospace; align-items:center; justify-content:center;}

  /* Sliding bottom sheet (mobile map view) */
  .bottom-sheet{position:absolute; left:10px; right:10px; bottom:10px; z-index:500; background:rgba(255,255,255,.95); backdrop-filter:blur(16px); border-radius:20px; box-shadow:0 -6px 30px rgba(15,23,42,.16); max-height:64%; display:flex; flex-direction:column; transition:transform .35s cubic-bezier(.2,.9,.3,1); transform:translateY(calc(100% - 60px));}
  [data-theme="dark"] .bottom-sheet{background:rgba(26,36,54,.92);}
  .bottom-sheet.open{transform:translateY(0);}
  .bs-handle{padding:10px 16px 8px; cursor:pointer; position:relative;}
  .bs-bar{width:34px; height:4px; border-radius:4px; background:var(--border-strong); margin:0 auto 8px;}
  .bs-head-row{display:flex; align-items:center; justify-content:space-between;}
  .bs-title{font-size:13px; font-weight:700; text-transform:capitalize;}
  .bs-list{overflow-y:auto; padding:0 12px 12px; display:flex; flex-direction:column; gap:8px;}
  .place-card{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:10px 11px; cursor:pointer;}
  .p-icon{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0;}
  .p-body{flex:1; min-width:0;}
  .p-title{font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .p-sub{font-size:10.5px; color:var(--ink-muted); margin-top:1px;}
  .wait-badge{font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:20px; flex-shrink:0; display:flex; align-items:center; gap:5px;}
  .wait-badge .d{width:6px; height:6px; border-radius:50%; animation:breathe 1.8s ease-in-out infinite;}

  .weather-card{position:absolute; bottom:14px; right:14px; z-index:450; background:rgba(255,255,255,.9); backdrop-filter:blur(14px); border-radius:16px; padding:10px 14px; box-shadow:0 10px 26px rgba(15,23,42,.14); display:none; align-items:center; gap:9px;}
  [data-theme="dark"] .weather-card{background:rgba(26,36,54,.8);}
  .weather-card.show{display:flex;}
  .weather-card i{font-size:22px; color:var(--amber-fill);}
  .weather-card .t{font-size:15px; font-weight:800;}
  .weather-card .d{font-size:10px; color:var(--ink-muted);}

  .d-photo{width:74px; height:74px; border-radius:12px; flex-shrink:0; background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; font-size:24px;}
  .d-crowd-row{display:flex; align-items:center; justify-content:space-between; margin-top:10px; padding-top:10px; border-top:1px solid var(--border);}
  .d-crowd-figs i{font-size:13px; margin-right:1px;}
  .crowd-badge{font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px;}

  .desktop-nav{display:none;}
  .promo-card{display:none;}
  .zoom-group{display:flex; flex-direction:column; background:rgba(255,255,255,.88); backdrop-filter:blur(14px); border-radius:14px; overflow:hidden; box-shadow:0 10px 26px rgba(15,23,42,.14);}
  [data-theme="dark"] .zoom-group{background:rgba(26,36,54,.75);}
  .zoom-group button{width:44px; height:38px; border:none; background:none; cursor:pointer; color:var(--ink-secondary); font-size:16px;}
  .zoom-group button:first-child{border-bottom:1px solid var(--border);}
  @media (min-width:900px){
    .desktop-nav{display:flex; flex-direction:column; gap:2px; padding:2px 4px 12px;}

function timeAgo(ts){
  const s = Math.max(0, Math.round((Date.now()-ts)/1000));
  if(s<60) return s+' sec ago';
  const m = Math.round(s/60);
  if(m<60) return m+' min ago';
  return Math.round(m/60)+' hr ago';
}

const EMOJI_MAP = {

function renderStars(avg, count){
  if(!count) return `<span style="color:var(--ink-muted);">No ratings yet</span>`;
  const full = Math.round(avg);
  let stars = '';
  for(let i=1;i<=5;i++) stars += i<=full ? '\u2605' : '\u2606';
  return `<span style="color:#F59E0B;">${stars}</span> <span style="color:var(--ink-secondary);">${avg}</span>`;
}

// Real map / real location state
let userLoc = null;           // {lat,lng} from device GPS, or a fallback
let usingRealLocation = false;
let leafletMap = null;
let markerLayers = {};        // category -> Leaflet layerGroup
let activeLayers = {food:true, fuel:true, health:true, service:true, errand:true, road:true, signal:true};
let osmPlaces = [];            // real nearby places fetched from OpenStreetMap

// Demo data lives on a small fixed grid (x:0-340, y:0-460). Convert
// that into a tiny real-world offset near wherever the user actually
// is, so the tested demo dataset still makes sense on a real map.
function demoToLatLng(x, y){
  if(!userLoc) return {lat:33.6, lng:73.0};
  const dLat = (230 - y) / 230 * 0.01;
  const dLng = (x - 170) / 170 * 0.01;
  return {lat: userLoc.lat + dLat, lng: userLoc.lng + dLng};
}

function getUserLocation(){
  return new Promise(resolve => {
    if(!navigator.geolocation){ resolve({error:'not_supported'}); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({lat: pos.coords.latitude, lng: pos.coords.longitude}),
      err => {
        const reasons = {1:'permission_denied', 2:'position_unavailable', 3:'timeout'};
        resolve({error: reasons[err.code] || 'unknown_error'});
      },
      {timeout: 15000}
    );
  });
}

let searchDebounce = null;
function getRecentSearches(){
  try{ return JSON.parse(localStorage.getItem('pulse_recent_searches') || '[]'); }catch(e){ return []; }
}
function showRecentSearches(which){
  const resultsEl = document.getElementById('search-results-'+which);
  const recent = getRecentSearches();
  if(!recent.length) return;
  resultsEl.innerHTML = `<div class="search-result-item" style="font-size:10px; font-weight:700; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.04em; cursor:default;">Recent searches</div>` +
    recent.map(r => `<div class="search-result-item" onclick='selectSearchResult(${r.lat},${r.lng},${JSON.stringify(r.label)},"${which}")'>${r.label}</div>`).join('');
  resultsEl.classList.add('show');
}
function onSearchInput(q, which){
  clearTimeout(searchDebounce);
  const resultsEl = document.getElementById('search-results-'+which);
  if(!q || q.trim().length < 3){
    if(!q){ showRecentSearches(which); } else { resultsEl.classList.remove('show'); }
    return;
  }
  searchDebounce = setTimeout(async ()=>{
    try{
      const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=5&q=' + encodeURIComponent(q);
      const res = await fetch(url);
      const results = await res.json();
      if(!results.length){
        resultsEl.innerHTML = `<div class="search-result-item" style="color:var(--ink-muted);">No matches found</div>`;
        resultsEl.classList.add('show');
        return;
      }
      resultsEl.innerHTML = results.map((r,i)=>
        `<div class="search-result-item" onclick='selectSearchResult(${r.lat},${r.lon},${JSON.stringify(r.display_name)},"${which}")'>${r.display_name}</div>`
      ).join('');
      resultsEl.classList.add('show');
    }catch(e){
      resultsEl.classList.remove('show');
    }
  }, 400);
}

async function selectSearchResult(lat, lng, label, which){
  document.getElementById('search-results-'+which).classList.remove('show');
  const input = document.getElementById('search-input-'+which);
  if(input) input.value = label.split(',')[0];

  const shortLabel = label.split(',')[0];
  let recent = getRecentSearches().filter(r => r.label !== shortLabel);
  recent.unshift({lat, lng, label: shortLabel});
  recent = recent.slice(0, 5);
  localStorage.setItem('pulse_recent_searches', JSON.stringify(recent));

  userLoc = {lat, lng};
  usingRealLocation = true;
  document.getElementById('loc-banner').style.display = 'none';

  locations = locations.filter(l => !l.osm); // drop previous real-place results
  osmPlaces = [];
  render();

  if(leafletMap) leafletMap.setView([lat, lng], 15);

  const places = await fetchNearbyPlaces(lat, lng);
  osmPlaces = places;
  locations = locations.concat(places);
  render();
  fetchWeather(lat, lng);
}

async function fetchNearbyPlaces(lat, lng){
  const r = 2000;
  const query = `[out:json][timeout:20];(
    node["amenity"="restaurant"](around:${r},${lat},${lng});
    node["amenity"="fast_food"](around:${r},${lat},${lng});
    node["amenity"="cafe"](around:${r},${lat},${lng});
    node["shop"="bakery"](around:${r},${lat},${lng});
    node["amenity"="fuel"](around:${r},${lat},${lng});
    node["amenity"="pharmacy"](around:${r},${lat},${lng});
    node["amenity"="clinic"](around:${r},${lat},${lng});
    node["amenity"="hospital"](around:${r},${lat},${lng});
    node["amenity"="dentist"](around:${r},${lat},${lng});
    node["shop"="hairdresser"](around:${r},${lat},${lng});
    node["shop"="car_repair"](around:${r},${lat},${lng});
    node["amenity"="bank"](around:${r},${lat},${lng});
    node["shop"="laundry"](around:${r},${lat},${lng});
    node["shop"="dry_cleaning"](around:${r},${lat},${lng});
    node["shop"="supermarket"](around:${r},${lat},${lng});
    node["shop"="convenience"](around:${r},${lat},${lng});
  );out body 100;`;
  try{
    const res = await fetch('https://overpass-api.de/api/interpreter', {method:'POST', body: query});
    if(!res.ok) return [];
    const data = await res.json();
    const catMap = {
      restaurant:{category:'food', icon:'ti-tools-kitchen-2'},
      fast_food:{category:'food', icon:'ti-burger'},
      cafe:{category:'food', icon:'ti-coffee'},
      bakery:{category:'food', icon:'ti-bread'},
      fuel:{category:'fuel', icon:'ti-gas-station'},
      pharmacy:{category:'health', icon:'ti-first-aid-kit'},
      clinic:{category:'health', icon:'ti-stethoscope'},
      hospital:{category:'health', icon:'ti-building-hospital'},
      dentist:{category:'health', icon:'ti-stethoscope'},
      hairdresser:{category:'service', icon:'ti-scissors'},
      car_repair:{category:'service', icon:'ti-car'},
      bank:{category:'service', icon:'ti-building-bank'},
      laundry:{category:'errand', icon:'ti-wash'},
      dry_cleaning:{category:'errand', icon:'ti-wash'},
      supermarket:{category:'errand', icon:'ti-shopping-cart'},
      convenience:{category:'errand', icon:'ti-shopping-cart'},
    };
    const mapped = (data.elements || []).filter(el => el.tags && el.tags.name).map(el => {
      const kind = el.tags.amenity || el.tags.shop;
      const c = catMap[kind] || {category:'service', icon:'ti-map-pin'};
      return {
        id: 'osm_' + el.id, name: el.tags.name, category: c.category, icon: c.icon,
        distance: 'nearby', status: 'unknown', minutes: null, confirms: 0,
        updated: 'no reports yet', ownerOwned: false, ownerVerified: false,
        osm: true, lat: el.lat, lng: el.lon,
      };
    });
    // De-dupe: OSM sometimes has two nodes for the same real place.
    // Treat same name + within ~30m as a duplicate, keep the first.
    const deduped = [];
    for(const p of mapped){
      const dupe = deduped.find(x => x.name===p.name && Math.abs(x.lat-p.lat)<0.0003 && Math.abs(x.lng-p.lng)<0.0003);
      if(!dupe) deduped.push(p);
    }
    return deduped;
  }catch(e){ return []; }
}

let baseTileLayer = null;
function initMapIfNeeded(){
  if(leafletMap || typeof L === 'undefined') return;
  const center = userLoc || {lat:33.6, lng:73.0};
  const worldBounds = L.latLngBounds([-85,-185],[85,185]);
  leafletMap = L.map(leafletMapDiv, {zoomControl:false, minZoom:3, maxBounds:worldBounds, maxBoundsViscosity:1.0}).setView([center.lat, center.lng], 15);
  baseTileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19, attribution:'&copy; OpenStreetMap contributors'
  }).addTo(leafletMap);
  ['food','fuel','health','service','errand','road','police','signal'].forEach(cat=>{
    markerLayers[cat] = L.markerClusterGroup({
      maxClusterRadius: 80,
      disableClusteringAtZoom: 18,
      iconCreateFunction: function(cluster){
        return L.divIcon({
          html: `<div style="width:38px;height:38px;border-radius:50%;background:#12233B;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;box-shadow:0 4px 12px rgba(18,35,59,0.4);border:2px solid #fff;">${cluster.getChildCount()}</div>`,
          className: '', iconSize: [38,38]
        });
      }
    }).addTo(leafletMap);
  });
  if(userLoc && usingRealLocation){
    L.circleMarker([userLoc.lat, userLoc.lng], {radius:7, color:'#fff', weight:2, fillColor:'#378ADD', fillOpacity:1}).addTo(leafletMap);
  }
}

function pinIcon(iconClass, fill){

}
function pinIconMinutes(minutes, fill){
  const label = minutes==null ? '?' : minutes;
  return L.divIcon({className:'', html:`<div style="width:32px;height:32px;border-radius:50%;background:${fill};border:2.5px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:800;font-family:'Inter',sans-serif;">${label}${minutes!=null?'<span style="font-size:7px;font-weight:700;margin-left:1px;">min</span>':''}</div>`, iconSize:[32,32], iconAnchor:[16,16]});
}

function updateMapMarkers(){
  if(!leafletMap) return;
  Object.values(markerLayers).forEach(lg=>lg.clearLayers());

  locations.forEach(l=>{
    if(!activeLayers[l.category]) return;
    const pos = l.osm ? [l.lat, l.lng] : (()=>{const p=demoToLatLng(l.x,l.y); return [p.lat,p.lng];})();
    const c = statusColors[l.status];
    L.marker(pos, {icon:pinIconMinutes(l.minutes, c.fill)}).addTo(markerLayers[l.category]).on('click', ()=>openDetail(l.id));
  });

  roadReports.forEach(r=>{
    const layer = roadLayerFor(r.type);
    if(!activeLayers[layer]) return;
    const p = demoToLatLng(r.x, r.y);
    L.marker([p.lat,p.lng], {icon:pinIcon(r.icon, roadFillColor(r.type))}).addTo(markerLayers[layer]).on('click', ()=>openRoadDetail(r.id));
  });

  if(activeLayers.signal){
    signals.forEach(s=>{
      const p = demoToLatLng(s.x, s.y);
      const fill = s.color==='red' ? 'var(--coral-fill)' : 'var(--teal-fill)';
      L.marker([p.lat,p.lng], {icon:pinIcon('ti-traffic-lights', fill)}).addTo(markerLayers.signal).on('click', ()=>openSignalDetail(s.id));
    });
  }
  updateLayersButtons();
}

function updateLayersButtons(){
  const allOn = Object.values(activeLayers).every(v=>v);
  const html = `<i class="ti ti-layers-2"></i>Layers ${allOn ? '' : '<span class="filter-dot"></span>'}`;
  ['layers-btn-desktop','layers-btn-mobile'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.innerHTML = html;
  });
}

function openLayersPanel(){
  const defs = [
    {k:'food',icon:'ti-tools-kitchen-2',label:'Food'},
    {k:'fuel',icon:'ti-gas-station',label:'Fuel'},
    {k:'health',icon:'ti-first-aid-kit',label:'Health'},
    {k:'service',icon:'ti-scissors',label:'Service'},
    {k:'errand',icon:'ti-wash',label:'Errands'},
    {k:'road',icon:'ti-road',label:'Roads'},
    {k:'police',icon:'ti-shield',label:'Police'},
    {k:'signal',icon:'ti-traffic-lights',label:'Signals'},
  ];
  const allOn = Object.values(activeLayers).every(v=>v);
  document.getElementById('modal-holder').innerHTML = `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="sheet">
      <div class="sheet-head">
        <div><p class="sheet-title">Map layers</p><p class="sheet-sub">Toggle what shows on the map</p></div>
        <button class="close-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
      </div>
      <div class="layer-grid">
        ${defs.map(d=>`<div class="layer-opt ${activeLayers[d.k]?'on':''}" onclick="toggleLayer('${d.k}')"><span style="font-size:19px;">${emojiFor(d.icon)}</span><span>${d.label}</span></div>`).join('')}
      </div>
      ${allOn ? '' : `<button class="primary-btn" style="margin-top:4px;" onclick="showAllLayers()">Show everything</button>`}
    </div>
  </div>`;
}
function toggleLayer(k){
  activeLayers[k] = !activeLayers[k];
  updateMapMarkers();
  openLayersPanel();
}
function showAllLayers(){
  Object.keys(activeLayers).forEach(k=>activeLayers[k]=true);
  updateMapMarkers();
  openLayersPanel();
}

function positionMap(){
  if(!leafletMapDiv) return;
  const isDesktop = window.matchMedia('(min-width:900px)').matches;
  if(isDesktop){
    const wrap = document.querySelector('#map-pane-desktop .map-wrap');
    document.getElementById('map-pane-desktop').style.display = 'block';
    if(wrap && leafletMapDiv.parentElement !== wrap) wrap.appendChild(leafletMapDiv);
  } else if(tab==='map'){
    const wrap = document.getElementById('mobile-map-wrap');
    if(wrap && leafletMapDiv.parentElement !== wrap) wrap.appendChild(leafletMapDiv);
  } else {
    return; // mobile, not on Map tab — leave the div wherever it last was, off-screen is fine
  }
  initMapIfNeeded();
  updateMapMarkers();
  setTimeout(()=>{ if(leafletMap) leafletMap.invalidateSize(); }, 50);
}

window.addEventListener('resize', ()=>{ positionMap(); });

function setTab(t){
  tab = t;
  document.getElementById('nav-feed').classList.toggle('active', t==='feed');
  document.getElementById('nav-map').classList.toggle('active', t==='map');
  render();
}

function setFilter(f){ filter = f; render(); }

function toggleTheme(){
  const isDark = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = isDark ? 'light' : 'dark';
  localStorage.setItem('pulse_theme', isDark ? 'light' : 'dark');
  document.querySelectorAll('.theme-toggle-icon').forEach(el=>{ el.className = 'ti theme-toggle-icon ' + (isDark ? 'ti-moon' : 'ti-sun'); });
  document.querySelectorAll('.theme-toggle-emoji').forEach(el=>{ el.textContent = isDark ? '\u{1F319}' : '\u2600\uFE0F'; });
}
(function applyStoredTheme(){
  const saved = localStorage.getItem('pulse_theme');
  if(saved === 'dark'){
    document.documentElement.dataset.theme = 'dark';
    document.querySelectorAll('.theme-toggle-icon').forEach(el=>{ el.className = 'ti theme-toggle-icon ti-sun'; });
    document.querySelectorAll('.theme-toggle-emoji').forEach(el=>{ el.textContent = '\u2600\uFE0F'; });
  }
})();

function render(){
  const filters = document.getElementById('filters');
  const content = document.getElementById('content');
  const fabHolder = document.getElementById('fab-holder');
  const isDesktop = window.matchMedia('(min-width:900px)').matches;

  if(persona==='owner'){
    filters.innerHTML='';
    fabHolder.innerHTML='';
    renderOwner(content);
    if(isDesktop) document.getElementById('map-pane-desktop').style.display = 'none';
    return;
  }

  const chipDefs = [
    {k:'food', label:'Food'}, {k:'fuel', label:'Fuel'}, {k:'health', label:'Health'},
    {k:'service', label:'Service'}, {k:'errand', label:'Errands'}, {k:'road', label:'Roads'}
  ];
  filters.innerHTML = chipDefs.map(c=>`<button class="chip ${filter===c.k?'active':''}" onclick="setFilter('${c.k}')">${c.label}</button>`).join('');

  if(isDesktop){
    renderFeed(content);
    fabHolder.innerHTML = `<button class="fab" onclick="openReportModal()"><span style="font-size:16px; font-weight:700;">+</span>Report</button>`;
    positionMap();
    return;
  }

  if(tab==='map'){
    fabHolder.innerHTML = `<button class="fab" onclick="openReportModal()"><span style="font-size:16px; font-weight:700;">+</span>Report</button>`;
    renderMap(content);
    return;
  }

  fabHolder.innerHTML = `<button class="fab" onclick="openReportModal()"><span style="font-size:16px; font-weight:700;">+</span>Report</button>`;
  renderFeed(content);
}

  </div>`;
  html += `<div class="jump-nav">
    <button onclick="document.getElementById('sec-waits')?.scrollIntoView({behavior:'smooth'})">Wait times</button>
    <button onclick="document.getElementById('sec-roads')?.scrollIntoView({behavior:'smooth'})">Roads</button>
    <button onclick="document.getElementById('sec-signals')?.scrollIntoView({behavior:'smooth'})">Signals</button>
  </div>`;
  if(waits.length){
    html += `<div class="section-label" id="sec-waits">Nearby wait times</div>`;
    html += waits.map(l=>{
      const c = statusColors[l.status];
      return `<div class="card" onclick="openDetail('${l.id}')">
        <div class="card-row">
          <div class="icon-badge" style="background:${c.bg}; color:${c.text};"><span>${emojiFor(l.icon)}</span></div>
          <div class="card-body">
            <p class="card-title">${l.name} ${l.ownerVerified?'<span class="badge-owner"><i class="ti ti-rosette-discount-check" style="font-size:11px;"></i>Verified</span>':''} ${l.osm?'<span class="badge-real">Real</span>':(l.id<=8?'<span class="badge-demo">Demo</span>':'')}</p>
            <p class="card-sub">${l.distance} · ${l.osm ? 'be the first to report' : (l.confirms>0? l.confirms+' check-ins':'owner reported')} · ${l.updated}</p>
            ${l.ratingCount ? `<p class="card-sub" style="margin-top:2px;">${renderStars(l.ratingAvg, l.ratingCount)}</p>` : ''}
          </div>
          <div class="card-right">
            <div style="display:flex; align-items:center; gap:5px; justify-content:flex-end;">
              <span class="status-dot" style="background:${c.fill};"></span>
              <span class="card-metric" style="color:${c.text};">${l.minutes==null ? 'No data' : l.minutes+' min'}</span>
            </div>
            <div class="card-label">${c.label}</div>
          </div>
        </div>
      </div>`;
    }).join('');
  }
  if(roads.length){
    html += `<div class="section-label" id="sec-roads">Road & area reports</div>`;
    html += roads.map(r=>{
      const c = typeColors[r.type] || {bg:'var(--surface-1)', text:'var(--ink-secondary)'};
      return `<div class="card" onclick="openRoadDetail(${r.id})">
        <div class="card-row">

          </div>
          <div class="card-right"><div class="card-label">${r.confirms} confirms</div></div>
        </div>
      </div>`;
    }).join('');
  }
  let sigs = filter==='road' ? signals : [];
  if(sigs.length){
    html += `<div class="section-label" id="sec-signals">Signal reports</div>`;
    html += sigs.map(s=>{
      const c = s.color==='red' ? statusColors.red : statusColors.green;
      return `<div class="card" onclick="openSignalDetail(${s.id})">

        </div>
      </div>`;
    }).join('');
  }
  if(!html) html = `<div class="empty">Nothing reported in this category yet.<br>Be the first to report it.</div>`;
  content.innerHTML = html;
}

function toggleBottomSheet(){
  const sheet = document.getElementById('bottom-sheet');
  const chev = document.getElementById('bs-chevron');
  if(!sheet) return;
  sheet.classList.toggle('open');
  chev.className = sheet.classList.contains('open') ? 'ti ti-chevron-down' : 'ti ti-chevron-up';
}

let heatLayer = null;
let heatOn = false;
function toggleHeatmap(){
  if(!leafletMap) return;
  heatOn = !heatOn;
  document.querySelectorAll('.heat-switch').forEach(el=>el.classList.toggle('on', heatOn));
  if(heatOn){
    Object.values(markerLayers).forEach(lg=>leafletMap.removeLayer(lg));
    const pts = [];
    locations.forEach(l=>{
      if(!activeLayers[l.category]) return;
      const pos = l.osm ? [l.lat,l.lng] : (()=>{const p=demoToLatLng(l.x,l.y); return [p.lat,p.lng];})();
      const weight = l.status==='red' ? 1 : l.status==='amber' ? 0.6 : 0.3;
      for(let i=0;i<12;i++) pts.push([pos[0]+(Math.random()-0.5)*0.006, pos[1]+(Math.random()-0.5)*0.006, weight]);
    });
    heatLayer = L.heatLayer(pts, {radius:32, blur:24, maxZoom:17}).addTo(leafletMap);
  } else {
    if(heatLayer){ leafletMap.removeLayer(heatLayer); heatLayer = null; }
    Object.values(markerLayers).forEach(lg=>lg.addTo(leafletMap));
  }
}

function ownerSetStatus(id, status){
  const l = locations.find(x=>x.id===id);
  l.status = status;
  render();
}
function ownerSave(id){
  const l = locations.find(x=>x.id===id);
  l.note = document.getElementById('note-'+id).value;
  l.photoUrl = document.getElementById('photo-'+id).value || null;
  l.updated = 'Updated by owner · just now';
  l.ownerVerified = true;
  api('/api/owner-update', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({locationId:id, status:l.status, note:l.note, photoUrl:l.photoUrl})});
  toast('Saved. Nearby residents can see this now.');
  render();
}

function openDetail(id){
  const l = locations.find(x=>String(x.id)===String(id));
  const c = statusColors[l.status];
  const crowdColors = {High:{bg:'var(--coral-bg)',text:'var(--coral-text)'}, Medium:{bg:'var(--amber-bg)',text:'var(--amber-text)'}, Low:{bg:'var(--teal-bg)',text:'var(--teal-text)'}};
  document.getElementById('modal-holder').innerHTML = `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="sheet">
      <div class="sheet-head">
        <div style="display:flex; gap:12px; align-items:center;">
          <div class="d-photo" style="${l.photoUrl ? `background-image:url('${l.photoUrl}');` : `background:${c.bg}; color:${c.text};`}">${l.photoUrl ? '' : emojiFor(l.icon)}</div>
          <div>
            <p class="sheet-title">${l.name}</p>
            <p class="sheet-sub">${l.ownerVerified? 'Reported by the owner · '+l.updated : 'Based on '+l.confirms+' check-ins · '+l.updated}</p>
          </div>
        </div>
        <button class="close-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
      </div>
      <div class="big-metric">
        <div class="num" style="color:${c.text}; font-size:${l.minutes==null?'26px':'40px'};">${l.minutes==null ? 'No reports yet' : l.minutes+' min'}</div>
        <div class="cap">${c.label.toUpperCase()}</div>
      </div>
      ${l.crowdLevel ? `<div class="d-crowd-row">
        <span style="font-size:12px; font-weight:600; color:var(--ink-secondary);">Live crowd (last 2 hrs)</span>
        <span class="crowd-badge" style="background:${crowdColors[l.crowdLevel].bg}; color:${crowdColors[l.crowdLevel].text};">${l.crowdLevel} \u00B7 ${l.crowdCount} check-ins</span>
      </div>` : ''}
      <p style="font-size:12px; color:var(--ink-muted); margin:0 0 8px;">How long did you actually wait?</p>
      <button class="opt-btn" onclick="checkin('${l.id}', 3, 'green')">Under 10 min <i class="ti ti-chevron-right"></i></button>
      <button class="opt-btn" onclick="checkin('${l.id}', 22, 'amber')">10 to 30 min <i class="ti ti-chevron-right"></i></button>
      <button class="opt-btn" onclick="checkin('${l.id}', 50, 'red')">Over 30 min <i class="ti ti-chevron-right"></i></button>
      <div style="border-top:1px solid var(--border); margin-top:6px; padding-top:12px;">
        <p style="font-size:12px; color:var(--ink-muted); margin:0 0 8px;">Rate this place</p>
        <div id="star-picker" style="display:flex; gap:6px; font-size:26px; margin-bottom:12px;">
          ${[1,2,3,4,5].map(n=>`<span onclick="rateLocation('${l.id}',${n})" style="cursor:pointer; color:${l.ratingCount && n<=Math.round(l.ratingAvg) ? '#F59E0B' : 'var(--border-strong)'};">\u2605</span>`).join('')}
        </div>
        <button class="opt-btn" style="border-style:dashed;" onclick="closeModal(); openReportModal();"><i class="ti ti-alert-triangle" style="font-size:15px;"></i>&nbsp; Report something wrong here <i class="ti ti-chevron-right"></i></button>
      </div>
    </div>
  </div>`;
}

async function rateLocation(id, stars){
  let l = locations.find(x=>String(x.id)===String(id));
  if(!l) return;
  if(l.osm){
    const res = await api('/api/report', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({kind:'wait', name:l.name, x:100, y:70})});
    if(res && res.id){ l.id = res.id; l.osm = false; id = res.id; }
  }
  const oldCount = l.ratingCount || 0;
  const oldSum = (l.ratingAvg || 0) * oldCount;
  l.ratingCount = oldCount + 1;
  l.ratingAvg = Math.round(((oldSum + stars) / l.ratingCount) * 10) / 10;
  api('/api/rate', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({locationId:id, stars})});
  toast('Thanks for rating!');
  closeModal();
  render();
}

async function checkin(id, minutes, status){
  let l = locations.find(x=>String(x.id)===String(id));
  if(l.osm){
    const res = await api('/api/report', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({kind:'wait', name:l.name, x:100, y:70})});
    if(res && res.id){ l.id = res.id; l.osm = false; }
  }
  l.minutes = minutes; l.status = status; l.confirms += 1; l.updated = 'just now';
  api('/api/checkin', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({locationId:l.id, minutes, status})});
  closeModal();
  toast('Thanks, check-in added.');
  render();
}

function openRoadDetail(id){
  const r = roadReports.find(x=>x.id===id);
  document.getElementById('modal-holder').innerHTML = `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="sheet">
      <div class="sheet-head">
        <div>
          <p class="sheet-title">${r.name}</p>
          <p class="sheet-sub">${r.detail} · ${r.updated}</p>
        </div>
        <button class="close-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
      </div>
      <p style="font-size:12px; color:var(--ink-muted); margin:0 0 10px;">${r.confirms} people have confirmed this is still happening.</p>
      <button class="opt-btn" onclick="confirmRoad(${r.id})">Still there <i class="ti ti-check"></i></button>
      <button class="opt-btn" onclick="clearRoad(${r.id})">It's cleared now <i class="ti ti-x"></i></button>
    </div>
  </div>`;
}
function confirmRoad(id){
  const r = roadReports.find(x=>x.id===id);
  r.confirms += 1; r.updated = 'just now';
  api('/api/road-confirm', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id})});
  closeModal(); toast('Confirmed, thanks.'); render();
}
function clearRoad(id){
  roadReports = roadReports.filter(x=>x.id!==id);
  api('/api/road-clear', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id})});
  closeModal(); toast('Marked as cleared.'); render();
}

function openSignalDetail(id){
  const s = signals.find(x=>x.id===id);
  const c = s.color==='red' ? statusColors.red : statusColors.green;
  const other = s.color==='red' ? 'green' : 'red';
  document.getElementById('modal-holder').innerHTML = `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="sheet">
      <div class="sheet-head">
        <div>
          <p class="sheet-title">${s.name}</p>
          <p class="sheet-sub">Reported by people passing through, not a live feed</p>
        </div>
        <button class="close-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
      </div>
      <div class="big-metric">
        <div class="num" style="color:${c.text};">${s.color.toUpperCase()}</div>
        <div class="cap">REPORTED ${timeAgo(s.reportedAt).toUpperCase()} &middot; ${s.confirms} CONFIRMS</div>
      </div>
      <p style="font-size:12px; color:var(--ink-muted); margin:0 0 8px;">What do you see right now?</p>
      <button class="opt-btn" onclick="reportSignal(${s.id}, '${s.color}')">Still ${s.color} <i class="ti ti-check"></i></button>
      <button class="opt-btn" onclick="reportSignal(${s.id}, '${other}')">Now ${other} <i class="ti ti-refresh"></i></button>
    </div>
  </div>`;
}
function reportSignal(id, color){
  const s = signals.find(x=>x.id===id);
  s.color = color; s.reportedAt = Date.now(); s.confirms += 1;
  api('/api/signal-report', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id, color})});
  closeModal();
  toast('Thanks, that keeps this current.');
  render();
}

let reportType = null;
function openReportModal(){
  reportType = null;
  document.getElementById('modal-holder').innerHTML = `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="sheet">
      <div class="sheet-head">
        <div>
          <p class="sheet-title">What are you seeing?</p>
          <p class="sheet-sub">Reports share your current location</p>
        </div>
        <button class="close-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
      </div>
      <div class="type-grid" id="type-grid">
        ${['signal|ti-traffic-cone|Signal down','signalstate|ti-traffic-lights|Signal color','closure|ti-road-off|Road closed','jam|ti-car|Traffic jam','police|ti-shield|Police','camera|ti-camera|Camera','wait|ti-clock-plus|Wait time']
          .map(t=>{const [k,icon,label]=t.split('|'); return `<div class="type-opt" data-k="${k}" onclick="selectType('${k}')"><span style="font-size:20px;">${emojiFor(icon)}</span><span>${label}</span></div>`;}).join('')}
      </div>
      <div id="report-extra"></div>
      <button class="primary-btn" onclick="submitReport()">Submit report</button>
    </div>
  </div>`;
}
let reportSignalColor = 'red';
function pickColor(c){
  reportSignalColor = c;
  document.getElementById('clr-red')?.classList.toggle('selected', c==='red');
  document.getElementById('clr-green')?.classList.toggle('selected', c==='green');
}
function selectType(k){
  reportType = k;
  document.querySelectorAll('.type-opt').forEach(el=>el.classList.toggle('selected', el.dataset.k===k));
  const extra = document.getElementById('report-extra');
  if(k==='wait'){
    extra.innerHTML = `<input type="text" id="report-name" placeholder="Place name, e.g. Corner Market">`;
  } else if(k==='signalstate'){
    reportSignalColor = 'red';
    extra.innerHTML = `<input type="text" id="report-name" placeholder="Intersection, e.g. 5th and Main">
      <p style="font-size:12px; color:var(--ink-muted); margin:0 0 6px;">What color is it right now?</p>
      <div class="status-set">
        <button type="button" class="sel-red selected" id="clr-red" onclick="pickColor('red')">Red</button>
        <button type="button" class="sel-green" id="clr-green" onclick="pickColor('green')">Green</button>
      </div>`;
  } else {
    extra.innerHTML = `<p style="font-size:12px; color:var(--ink-muted); margin:0 0 6px;">How long will it likely last?</p>
      <select id="report-duration"><option>A few minutes</option><option selected>15 to 30 minutes</option><option>An hour or more</option><option>Not sure</option></select>`;
  }
}
function submitReport(){
  if(!reportType){ toast("Pick what you're reporting first."); return; }
  if(reportType==='wait'){
    const name = document.getElementById('report-name')?.value || 'New spot';
    locations.unshift({id:Date.now(), name, category:'errand', icon:'ti-map-pin', distance:'nearby', status:'amber', minutes:10, confirms:1, updated:'just now', ownerOwned:false, ownerVerified:false, x:100, y:70});
    api('/api/report', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({kind:'wait', name})});
  } else if(reportType==='signalstate'){
    const name = document.getElementById('report-name')?.value || 'New intersection';
    signals.unshift({id:Date.now(), name, color:reportSignalColor, reportedAt:Date.now(), confirms:1, x:150, y:150});
    api('/api/signal-report', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, color:reportSignalColor, x:150, y:150})});
  } else {
    const map = {signal:['Signal reported down','hazard','ti-traffic-cone'], closure:['Road reported closed','closure','ti-road-off'], jam:['Traffic jam reported','jam','ti-car'], police:['Police reported','police','ti-shield'], camera:['Camera reported','camera','ti-camera']};
    const [name,type,icon] = map[reportType];
    roadReports.unshift({id:Date.now(), name, type, icon, detail:'Reported just now', updated:'just now', confirms:1, x:200, y:230});
    api('/api/report', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({kind:reportType, name, detail:'Reported just now', x:200, y:230})});
  }
  closeModal();
  toast('Report added, thanks.');
  render();
}

function closeModal(){ document.getElementById('modal-holder').innerHTML=''; }

new MutationObserver(()=>{
  const sheet = document.querySelector('#modal-holder .sheet');
  if(sheet && !sheet.classList.contains('in')){
    requestAnimationFrame(()=>requestAnimationFrame(()=>sheet.classList.add('in')));
  }
}).observe(document.getElementById('modal-holder'), {childList:true});

setInterval(()=>{
  document.querySelectorAll('[data-ts]').forEach(el=>{ el.textContent = timeAgo(Number(el.dataset.ts)); });
}, 1000);

async function resolveLocation(){
  const locBanner = document.getElementById('loc-banner');
  const locBannerText = document.getElementById('loc-banner-text');
  const loc = await getUserLocation();
  const fallback = {lat: 33.6, lng: 73.0};
  const gotRealLocation = loc && !loc.error;
  const centerForPlaces = gotRealLocation ? loc : (userLoc || fallback);
  if(gotRealLocation){
    userLoc = loc; usingRealLocation = true;
    locBanner.style.display = 'none';
  } else {
    if(!userLoc){ userLoc = fallback; usingRealLocation = false; }
    const reasonText = {
      permission_denied: 'Location permission denied',
      position_unavailable: "This device can't get a location fix",
      timeout: "Couldn't get a location fix (common on desktops without GPS)",
      not_supported: "This browser doesn't support location",
      unknown_error: 'Could not get location',
    };
    locBannerText.textContent = (reasonText[loc && loc.error] || 'Could not get location') + ' \u2014 try again, or just search your area above';
    locBanner.style.display = 'flex';
  }
  render();
  if(leafletMap) leafletMap.setView([centerForPlaces.lat, centerForPlaces.lng], 15);

  locations = locations.filter(l => !l.osm);
  const places = await fetchNearbyPlaces(centerForPlaces.lat, centerForPlaces.lng);
  osmPlaces = places;
  locations = locations.concat(places);
  render();
  fetchWeather(centerForPlaces.lat, centerForPlaces.lng);
}

const WEATHER_CODE_ICON = {
  0:['ti-sun','Clear sky'], 1:['ti-sun','Mainly clear'], 2:['ti-cloud','Partly cloudy'], 3:['ti-cloud','Overcast'],
  45:['ti-cloud-fog','Fog'], 48:['ti-cloud-fog','Fog'],
  51:['ti-cloud-drizzle','Drizzle'], 53:['ti-cloud-drizzle','Drizzle'], 55:['ti-cloud-drizzle','Drizzle'],
  61:['ti-cloud-rain','Light rain'], 63:['ti-cloud-rain','Rain'], 65:['ti-cloud-rain','Heavy rain'],
  71:['ti-snowflake','Light snow'], 73:['ti-snowflake','Snow'], 75:['ti-snowflake','Heavy snow'],
  80:['ti-cloud-rain','Showers'], 81:['ti-cloud-rain','Showers'], 82:['ti-cloud-rain','Violent showers'],
  95:['ti-cloud-bolt','Thunderstorm'], 96:['ti-cloud-bolt','Thunderstorm'], 99:['ti-cloud-bolt','Thunderstorm'],
};
async function fetchWeather(lat, lng){
  let wx = null, aq = null;
  try{
    const wxRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,weather_code`);
    if(wxRes.ok) wx = await wxRes.json();
  }catch(e){ console.warn('Weather fetch failed', e); }
  try{
    const aqRes = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lng}&current=us_aqi`);
    if(aqRes.ok) aq = await aqRes.json();
  }catch(e){ console.warn('AQI fetch failed', e); }

  if(!wx || !wx.current) return;
  const temp = Math.round(wx.current.temperature_2m);
  const [icon, label] = WEATHER_CODE_ICON[wx.current.weather_code] || ['ti-cloud', 'Weather'];
  const aqi = aq && aq.current ? Math.round(aq.current.us_aqi) : null;
  const html = `<i class="ti ${icon}"></i><div><div class="t">${temp}\u00B0C</div><div class="d">${label}${aqi!=null?' \u00B7 AQI '+aqi:''}</div></div>`;
  ['weather-card-desktop','weather-card-mobile'].forEach(id=>{
    const el = document.getElementById(id);
    if(el){ el.innerHTML = html; el.classList.add('show'); }
  });
}

function retryLocation(){
  document.getElementById('loc-banner').style.display = 'none';
  resolveLocation();
}

function recenterOnMe(){
  if(!leafletMap){ toast('Open the map first'); return; }
  if(!userLoc){ toast('Location not available yet'); return; }
  leafletMap.setView([userLoc.lat, userLoc.lng], 15);
  toast(usingRealLocation ? 'Centered on your location' : 'Centered on the default area');
}

let satelliteOn = false;
function toggleSatellite(){
  if(!leafletMap || !baseTileLayer) return;
  leafletMap.removeLayer(baseTileLayer);
  satelliteOn = !satelliteOn;
  baseTileLayer = satelliteOn
    ? L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, attribution:'Tiles &copy; Esri'})
    : L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'});
  baseTileLayer.addTo(leafletMap);
  baseTileLayer.bringToBack();
  toast(satelliteOn ? 'Satellite view' : 'Street view');
}

async function boot(){
  leafletMapDiv = document.getElementById('leaflet-map');
  const banner = document.getElementById('mode-banner');

  const data = await api('/api/feed');
  if(data){
    locations = data.locations;
    roadReports = data.roadReports;
    signals = data.signals;
    banner.classList.remove('show');
  } else {
    banner.textContent = API_BASE ? 'Could not reach the API \u2014 showing demo data' : 'Demo mode \u2014 showing sample data';
    banner.classList.add('show');
  }

  render(); // show demo data immediately, don't block on location/Overpass
  await resolveLocation();
}
boot();

document.addEventListener('keydown', (e)=>{
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==='k'){
    e.preventDefault();
    const input = document.getElementById('search-input-desktop') || document.getElementById('search-input-mobile');
    if(input) input.focus();
  }
});
</script>
