<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse — what's happening near you</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#12233B">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<style>
  :root{
    --bg:#F4F5F7; --page:#F4F5F7; --surface:#FFFFFF; --surface-2:#F5F6F8;
    --ink:#12141C; --ink-secondary:#6B7280; --ink-muted:#9AA1AD;
    --border:#EBEDF1; --border-strong:#D8DBE1;
    --accent:#2563EB; --accent-hover:#1D4ED8; --accent-bg:#E8EFFF; --accent-text:#1D4ED8;
    --teal-bg:#E5F7EA; --teal-text:#16A34A; --teal-fill:#16A34A;
    --amber-bg:#FFF3E0; --amber-text:#B45309; --amber-fill:#F5A623;
    --coral-bg:#FDEAEA; --coral-text:#E0332F; --coral-fill:#E0332F;
    --blue-bg:#E8EFFF; --blue-text:#1D4ED8; --blue-fill:#2563EB;
    --purple:#8B5CF6; --purple-bg:#F1EBFF;
    --radius:16px;
    --shadow-card:0 10px 30px rgba(20,22,30,.08);
    --shadow-lg:0 20px 50px rgba(20,22,30,.16);
    --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:32px; --sp-6:48px; --sp-8:64px;
  }
  [data-theme="dark"]{
    --bg:#0F172A; --page:#0B1220; --surface:#182234; --surface-2:#212D42;
    --ink:#FFFFFF; --ink-secondary:#B0BAC9; --ink-muted:#8B98A3;
    --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.14);
    --accent:#3B82F6; --accent-hover:#60A5FA; --accent-bg:#1E3A5F; --accent-text:#93C5FD;
    --teal-bg:#0F3A2E; --teal-text:#5DCAA5; --teal-fill:#22C55E;
    --amber-bg:#4A3208; --amber-text:#F9C765; --amber-fill:#F59E0B;
    --coral-bg:#4A2013; --coral-text:#F0997B; --coral-fill:#EF4444;
    --blue-bg:#1E3A5F; --blue-text:#93C5FD; --blue-fill:#3B82F6;
    --purple:#A78BFA; --purple-bg:#2D2450;
    --shadow-card:0 20px 50px rgba(0,0,0,.35);
    --shadow-lg:0 20px 60px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--page); font-family:'Inter',sans-serif; color:var(--ink); display:flex; justify-content:center; transition:background .3s;}
  .frame{width:100%; max-width:460px; min-height:100vh; background:var(--bg); padding:0;}
  .screen{background:var(--surface); height:100vh; display:flex; flex-direction:column; overflow:hidden; position:relative;}
  @media (min-width:461px){
    body{padding:32px 16px;}
    .frame{min-height:auto; border-radius:36px; padding:12px; box-shadow:var(--shadow-lg);}
    .screen{height:700px; border-radius:26px;}
  }
  .mode-banner{font-size:11px; text-align:center; padding:6px; background:var(--amber-bg); color:var(--amber-text); display:none; font-family:'IBM Plex Mono',monospace;}
  .mode-banner.show{display:block;}

  .topbar{padding:18px 18px 10px;}
  .brand{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .wordmark{font-family:'Inter',sans-serif; font-size:19px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:9px;}
  .app-logo-badge{width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,#4F8CFF,#6C5CE7); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 3px 8px rgba(79,140,255,.35);}
  @keyframes breathe{0%,100%{opacity:1; transform:scale(1);} 50%{opacity:0.4; transform:scale(0.75);}}
  @keyframes marker-pulse{0%{transform:scale(1); opacity:.55;} 100%{transform:scale(2.1); opacity:0;}}
  .marker-pulse-ring{position:absolute; top:0; left:0; width:32px; height:32px; border-radius:50%; animation:marker-pulse 2.2s ease-out infinite;}

  .persona{display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:3px;}
  .persona button{flex:1; border:none; background:none; padding:7px 8px; font-family:'Inter',sans-serif; font-size:12px; font-weight:500; color:var(--ink-secondary); border-radius:8px; cursor:pointer;}
  .persona button.active{background:var(--surface); color:var(--accent); box-shadow:0 3px 12px rgba(0,0,0,.08);}

  .filters{display:flex; gap:6px; overflow-x:auto; padding:0 18px 12px; }
  .filters::-webkit-scrollbar{display:none;}
  .chip{white-space:nowrap; font-size:13px; padding:9px 15px; border-radius:20px; border:none; color:var(--ink-secondary); background:var(--surface-2); cursor:pointer; font-family:'Inter',sans-serif; font-weight:600; transition:.15s; display:inline-flex; align-items:center; gap:6px;}
  .chip.active{background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 6px 16px rgba(37,99,235,.3);}

  .content{flex:1; overflow-y:auto; padding:0 14px 14px; display:flex; flex-direction:column; gap:10px;}

  .card{background:var(--surface); border-radius:18px; padding:16px; cursor:pointer; border:1px solid var(--border); transition:transform .3s cubic-bezier(.2,.9,.3,1), box-shadow .3s;}
  .card:hover{transform:translateY(-2px); box-shadow:var(--shadow-card); border-color:var(--border-strong);}
  .card-row{display:flex; gap:11px; align-items:flex-start;}
  .icon-badge{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:17px;}
  .card-body{flex:1; min-width:0;}
  .card-title{font-size:14px; font-weight:600; margin:0; display:flex; align-items:center; gap:6px;}
  .card-sub{font-size:12px; color:var(--ink-secondary); margin:3px 0 0;}
  .card-right{text-align:right; flex-shrink:0;}
  .card-metric{font-family:'Inter',sans-serif; font-size:17px; font-weight:700; animation:num-pulse 2.4s ease-in-out infinite;}
  @keyframes num-pulse{0%,100%{opacity:1;} 50%{opacity:.75;}}
  .card-label{font-size:10px; color:var(--ink-muted); margin-top:2px; font-family:'IBM Plex Mono',monospace; letter-spacing:.02em;}
  .badge-owner{font-size:10px; background:var(--blue-bg); color:var(--blue-text); padding:2px 7px; border-radius:20px; display:inline-flex; align-items:center; gap:3px; font-family:'Inter',sans-serif; font-weight:500;}
  .status-dot{width:7px; height:7px; border-radius:50%; display:inline-block; animation:breathe 1.8s ease-in-out infinite;}

  .section-label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-muted); font-family:'IBM Plex Mono',monospace; padding:6px 6px 2px; scroll-margin-top:10px;}
  .jump-nav{display:flex; gap:6px; padding:2px 0 8px; position:sticky; top:0; background:var(--surface); z-index:5;}
  .jump-nav button{font-size:11px; padding:6px 12px; border-radius:14px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink-secondary); cursor:pointer; font-family:'Inter',sans-serif;}
  .summary-strip{display:flex; gap:8px; padding:0; margin-bottom:10px;}
  .summary-stat{text-align:left; flex:1; min-width:0; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:10px 12px; box-shadow:0 4px 14px rgba(15,23,42,.04); transition:transform .3s cubic-bezier(.2,.9,.3,1), box-shadow .3s;}
  .summary-stat:hover{transform:translateY(-2px); box-shadow:var(--shadow-card);}
  .summary-stat .n{font-size:18px; font-weight:800; font-family:'Inter',sans-serif; font-variant-numeric:tabular-nums;}
  .summary-stat .l{font-size:9.5px; color:var(--ink-muted); margin-top:2px; text-transform:uppercase; letter-spacing:.04em; font-family:'IBM Plex Mono',monospace;}

  .bottomnav{display:flex; border-top:1px solid var(--border); background:var(--surface);}
  .bottomnav button{flex:1; border:none; background:none; padding:12px 0 10px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; color:var(--ink-muted); cursor:pointer; font-family:'Inter',sans-serif;}
  .bottomnav button i{font-size:20px;}
  .bottomnav button.active{color:var(--ink);}

  .fab{position:absolute; right:16px; bottom:78px; z-index:1200; background:var(--accent); color:#fff; border:none; border-radius:24px; padding:11px 18px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; cursor:pointer; font-family:'Inter',sans-serif; box-shadow:0 15px 35px rgba(37,99,235,.35);}

  .overlay{position:absolute; inset:0; background:rgba(18,35,59,0.45); display:flex; align-items:flex-end; justify-content:center; z-index:1300;}
  .overlay .sheet{max-width:460px;}
  .sheet{background:var(--surface); width:100%; border-radius:22px 22px 0 0; padding:18px; max-height:90%; overflow-y:auto; transform:translateY(100%); transition:transform .3s cubic-bezier(.2,.9,.3,1);}
  .sheet.in{transform:translateY(0);}
  .sheet-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;}
  .sheet-title{font-family:'Sora',sans-serif; font-size:16px; font-weight:700; margin:0;}
  .sheet-sub{font-size:12px; color:var(--ink-secondary); margin:3px 0 0;}
  .close-btn{background:var(--surface-2); border:none; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-secondary);}
  .detail-grid{display:block;}
  .dg-header{display:flex; gap:12px; align-items:center;}
  @media (min-width:900px){
    .overlay .sheet.place-detail{max-width:900px; border-radius:20px; background:rgba(255,255,255,.9); -webkit-border:1px solid rgba(255,255,255,.7);}
    .sheet.place-detail .sheet-title{font-size:20px;}
    .place-detail .detail-grid{display:grid; grid-template-columns:1.4fr 1fr; grid-template-areas:"header crowd" "wait actions"; gap:20px 24px; align-items:start;}
    .place-detail .dg-header{grid-area:header;}
    .place-detail .dg-crowd{grid-area:crowd;}
    .place-detail .dg-wait{grid-area:wait;}
    .place-detail .dg-actions{grid-area:actions; align-self:end;}
    .place-detail .d-photo{width:96px; height:96px;}
  }

  .big-metric{text-align:center; padding:14px 0;}
  .big-metric .num{font-family:'Sora',sans-serif; font-size:40px; font-weight:800; line-height:1;}
  .big-metric .cap{font-size:11px; color:var(--ink-muted); font-family:'IBM Plex Mono',monospace; margin-top:6px;}

  .opt-btn{width:100%; text-align:left; padding:13px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface); margin-bottom:8px; font-size:13px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; font-family:'Inter',sans-serif; color:var(--ink); transition:background .2s, border-color .2s;}
  .opt-btn:hover{border-color:var(--border-strong); background:var(--surface-2);}
  .opt-btn.selected{border-color:var(--blue-fill); background:var(--blue-bg); color:var(--blue-text);}

  .type-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; margin-bottom:14px;}
  .type-opt{padding:14px 6px; border-radius:12px; border:1px solid var(--border); display:flex; flex-direction:column; align-items:center; gap:7px; cursor:pointer; font-size:11px; color:var(--ink-secondary); background:var(--surface);}
  .type-opt i{font-size:20px;}
  .type-opt.selected{border-color:var(--accent); background:var(--accent-bg); color:var(--accent-text);}

  select, input[type=text]{width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--border); font-size:13px; font-family:'Inter',sans-serif; background:var(--surface); color:var(--ink); margin-bottom:12px;}

  .primary-btn{width:100%; padding:13px; background:linear-gradient(135deg,#3B82F6,var(--accent)); color:#fff; border:none; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; transition:transform .2s, box-shadow .2s; box-shadow:0 8px 20px rgba(37,99,235,.25);}
  .primary-btn:hover{transform:translateY(-1px); box-shadow:0 12px 28px rgba(37,99,235,.35);}
  .status-set{display:flex; gap:8px; margin-bottom:12px;}
  .status-set button{flex:1; padding:11px 4px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface); font-size:12px; font-weight:500; cursor:pointer; font-family:'Inter',sans-serif; color:var(--ink-secondary);}
  .status-set button.sel-green.selected{border-color:var(--teal-fill); background:var(--teal-bg); color:var(--teal-text);}
  .status-set button.sel-amber.selected{border-color:var(--amber-fill); background:var(--amber-bg); color:var(--amber-text);}
  .status-set button.sel-red.selected{border-color:var(--coral-fill); background:var(--coral-bg); color:var(--coral-text);}

  .owner-card{background:var(--surface-2); border-radius:16px; padding:16px; margin-bottom:14px;}
  .owner-card-head{display:flex; gap:10px; align-items:center; margin-bottom:14px;}
  .owner-note{font-size:12px; color:var(--ink-secondary); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 10px; margin-top:2px;}

  .toast{position:absolute; bottom:88px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:24px; font-size:12px; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:20; white-space:nowrap; font-family:'Inter',sans-serif;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .empty{text-align:center; padding:40px 20px; color:var(--ink-muted); font-size:13px;}

  svg text{font-family:'Inter',sans-serif;}
  .map-pin{cursor:pointer;}
  .search-bar-wrap{position:absolute; top:14px; left:14px; right:130px; z-index:900; flex-shrink:0;}
  .search-pill{display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.85); -webkit-border:1px solid rgba(255,255,255,.7); border-radius:28px; box-shadow:var(--shadow-card); height:54px; padding:0 8px 0 18px; box-sizing:border-box; transition:box-shadow .3s, border-color .3s;}
  .search-pill:focus-within{box-shadow:var(--shadow-card), 0 0 0 3px var(--accent-bg); border-color:var(--accent);}
  .search-pill .search-icon{font-size:15px; flex-shrink:0; color:var(--ink-muted); pointer-events:none; width:20px; height:100%; display:flex; align-items:center; justify-content:center;}
  .search-filter-btn{flex-shrink:0; width:34px; height:34px; border-radius:50%; border:none; background:var(--surface-2); color:var(--ink-secondary); font-size:13px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background .2s, color .2s;}
  .search-filter-btn:hover{background:var(--accent-bg); color:var(--accent-text);}
  .search-kbd{flex-shrink:0; font-size:10px; font-weight:700; color:var(--ink-muted); background:var(--surface-2); padding:3px 7px; border-radius:6px; pointer-events:none;}
  .search-pill .search-input{flex:1; min-width:0; width:auto; padding:0; margin:0; height:100%; box-sizing:border-box; border:none; font-size:14.5px; font-family:'Inter',sans-serif; background:none; color:var(--ink); outline:none;}
  [data-theme="dark"] .search-pill{background:rgba(24,34,52,.85); border-color:rgba(255,255,255,.08);}
  .search-results{position:absolute; left:0; right:0; top:calc(100% + 10px); background:var(--surface); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow-lg); z-index:1250; max-height:420px; overflow-y:auto; display:none; padding:14px;}
  [data-theme="dark"] .search-results{background:var(--surface);}
  .search-results.show{display:block;}
  .src-chips{display:flex; gap:16px; padding:2px 4px 12px; margin-bottom:8px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .src-chip{font-size:13px; font-weight:600; color:var(--ink-secondary); cursor:pointer; padding:2px 0; border-bottom:2px solid transparent;}
  .src-chip.active{color:var(--accent-text); border-bottom-color:var(--accent);}
  .src-cat-list{display:flex; flex-direction:column;}
  .src-cat-item{display:flex; align-items:center; gap:12px; padding:9px 6px; border-radius:12px; cursor:pointer;}
  .src-cat-item:hover{background:var(--surface-2);}
  .src-cat-icon{width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0;}
  .src-cat-name{font-size:13.5px; font-weight:600; color:var(--ink);}
  .src-more{display:block; text-align:left; padding:9px 6px 2px; font-size:13px; font-weight:600; color:var(--accent-text); cursor:pointer;}
  .search-combo{display:flex; align-items:flex-start;}
  .search-combo-left{width:340px; flex-shrink:0; border-right:1px solid var(--border); padding-right:16px; margin-right:16px;}
  .dir-head-row{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
  .dir-head-icon{width:38px; height:38px; border-radius:50%; background:var(--accent-bg); color:var(--accent-text); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;}
  .dir-head-title{font-size:15px; font-weight:800; font-family:'Sora',sans-serif; color:var(--ink);}
  .dir-head-sub{font-size:11.5px; color:var(--ink-muted); margin-top:1px;}
  .dir-mode-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px;}
  .dir-mode-card{display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 4px; border-radius:14px; background:var(--surface-2); border:1.5px solid transparent; cursor:pointer; font-size:11px; font-weight:600; color:var(--ink-secondary);}
  .dir-mode-card i{font-size:16px;}
  .dir-mode-card.active{background:var(--accent-bg); border-color:var(--accent); color:var(--accent-text);}
  .dir-route-card{background:var(--surface-2); border-radius:14px; padding:14px; position:relative;}
  .dir-route-row{display:flex; align-items:center; gap:10px; position:relative;}
  .dir-route-dot{width:8px; height:8px; border-radius:50%; background:var(--accent); flex-shrink:0;}
  .dir-route-pin{color:var(--coral-text); font-size:14px; flex-shrink:0; width:8px; text-align:center;}
  .dir-route-label{font-size:10.5px; font-weight:700; color:var(--accent-text); margin-bottom:2px;}
  .dir-route-input{width:100%; border:none; background:none; outline:none; font-size:12.5px; color:var(--ink); font-family:'Inter',sans-serif; padding:0;}
  .dir-route-input::placeholder{color:var(--ink-muted);}
  .dir-route-icon-btn{width:28px; height:28px; border-radius:50%; background:var(--surface); border:1px solid var(--border); color:var(--ink-secondary); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:11px; flex-shrink:0;}
  .dir-swap-btn{flex-direction:column; gap:1px;}
  .dir-swap-btn i{font-size:8px; line-height:1;}
  .dir-route-connector{width:1px; height:16px; border-left:1px dashed var(--border-strong); margin:6px 0 6px 4px;}
  .search-combo-mid{width:190px; flex-shrink:0; border-right:1px solid var(--border); padding-right:14px; margin-right:14px;}
  .search-combo-right{width:170px; flex-shrink:0;}
  .dir-sugg-item{display:flex; align-items:center; gap:8px; padding:7px 4px; border-radius:8px; cursor:pointer;}
  .dir-sugg-item:hover{background:var(--surface-2);}
  .dir-sugg-icon{font-size:15px; width:18px; text-align:center; flex-shrink:0;}
  .dir-sugg-name{font-size:12px; color:var(--ink);}
  .dir-combo-label{font-size:11px; font-weight:700; color:var(--ink-muted); text-transform:uppercase; margin-bottom:8px;}
  .dir-mode-row-mini{display:flex; gap:6px; margin-bottom:12px;}
  .dir-mode-icon-mini{width:28px; height:28px; border-radius:50%; background:var(--surface-2); color:var(--ink-secondary); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:12px; flex-shrink:0;}
  .dir-mode-icon-mini.active{background:var(--accent); color:#fff;}
  .dir-dest-wrap{position:relative; margin-bottom:8px;}
  .dir-dest-input{width:100%; padding:8px 10px; border-radius:9px; border:1px solid var(--border); font-size:12px; background:var(--surface); color:var(--ink); box-sizing:border-box;}
  .dir-dest-results{position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow-lg); max-height:180px; overflow-y:auto; z-index:30; display:none;}
  .dir-my-loc-row{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--ink-secondary); padding:6px 2px;}
  .dir-loc-row{position:relative; display:flex; align-items:center; gap:6px; margin-bottom:8px;}
  .dir-loc-input{width:100%; padding:8px 28px 8px 10px; border-radius:9px; border:1px solid var(--border); font-size:11.5px; background:var(--surface); color:var(--ink); box-sizing:border-box;}

  .np-photo{height:110px; background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; font-size:32px;}
  .np-body{padding:12px 14px;}
  .np-name{font-size:13.5px; font-weight:700; color:var(--ink);}
  .np-meta-row{display:flex; align-items:center; gap:6px; font-size:11.5px; margin:5px 0;}
  .np-rating{font-size:11.5px; color:var(--ink-secondary); margin-bottom:8px;}
  .np-dir-btn{width:100%; padding:8px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); font-size:12px; font-weight:600; color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;}
  .page-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;}
  .page-title{font-family:'Sora',sans-serif; font-size:20px; font-weight:800; color:var(--ink);}
  .page-stat-row{display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap;}
  .page-stat-card{flex:1; min-width:130px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px;}
  .page-stat-card .n{font-family:'Sora',sans-serif; font-size:24px; font-weight:800;}
  .page-stat-card .l{font-size:11.5px; color:var(--ink-secondary); margin-top:2px;}
  .tab-row{display:flex; align-items:center; justify-content:space-between; gap:10px; border-bottom:1px solid var(--border); margin-bottom:16px; flex-wrap:wrap;}
  .tab-tabs{display:flex; gap:4px;}
  .tab-btn{padding:10px 14px; font-size:13px; font-weight:600; color:var(--ink-secondary); cursor:pointer; border-bottom:2px solid transparent;}
  .tab-btn i{margin-right:6px; font-size:12px;}
  .tab-btn.active{color:var(--accent); border-color:var(--accent);}
  .rp-sort{width:auto; margin-bottom:0; font-size:12.5px; font-weight:600; color:var(--ink-secondary); border:1px solid var(--border); border-radius:10px; padding:8px 30px 8px 12px; background:var(--surface); cursor:pointer; outline:none; appearance:none; -webkit-appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%23888' stroke-width='1.5' fill='none'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; flex-shrink:0;}
  .rp-type-pill{font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px; background:var(--surface-2); color:var(--ink-secondary); flex-shrink:0; white-space:nowrap;}
  .rp-col{font-size:12px; color:var(--ink-muted); width:72px; text-align:right; flex-shrink:0;}
  .rp-more{color:var(--ink-muted); cursor:pointer; padding:4px 6px; flex-shrink:0;}
  .rp-more:hover{color:var(--ink);}
  .report-row{display:flex; align-items:center; gap:12px; padding:14px; background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:8px;}
  .report-icon{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
  .status-pill{font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; flex-shrink:0;}
  .col-list{display:flex; flex-direction:column; gap:4px;}
  .col-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; cursor:pointer; font-size:13px; color:var(--ink);}
  .col-item.active{background:var(--accent-bg); color:var(--accent-text); font-weight:600;}
  .sv-col-item{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:12px; cursor:pointer;}
  .sv-col-item:hover{background:var(--surface-2);}
  .sv-col-item.active{background:var(--accent-bg);}
  .sv-col-icon{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0;}
  .sv-col-name{font-size:13px; font-weight:600; color:var(--ink);}
  .sv-col-count{margin-left:auto; font-size:11px; color:var(--ink-muted);}
  .sv-create-btn{display:flex; align-items:center; gap:8px; padding:9px 10px; color:var(--accent-text); font-size:13px; font-weight:600; cursor:pointer; margin-top:6px;}
  .sv-create-btn:hover{background:var(--surface-2); border-radius:12px;}
  .sv-row{display:flex; align-items:center; gap:12px; padding:10px 8px; border-radius:12px;}
  .sv-row:hover{background:var(--surface-2);}
  .sv-row-icon{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
  .sv-row-menu{color:var(--ink-muted); cursor:pointer; padding:6px; flex-shrink:0;}
  .sv-row-menu:hover{color:var(--ink);}
  .sv-empty{text-align:center; padding:36px 20px;}
  .sv-empty i{font-size:24px; color:var(--ink-muted); margin-bottom:10px; display:block;}
  .sv-save-form{display:flex; gap:8px; margin-top:16px; max-width:380px; margin-left:auto; margin-right:auto;}
  .sv-save-form input{flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--border); font-size:13px; background:var(--surface); color:var(--ink); outline:none;}
  .chart-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px;}
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:12px; font-size:12.5px;}
  .bar-track{flex:1; height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:4px;}
  .settings-nav-item{display:flex; align-items:center; gap:10px; padding:13px 12px; border-radius:10px; font-size:13px; color:var(--ink-secondary); cursor:pointer; margin-bottom:10px;}
  .an-date-pill{display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; color:var(--ink-secondary); border:1px solid var(--border); border-radius:10px; padding:8px 12px; background:var(--surface); cursor:pointer;}
  .an-donut{width:130px; height:130px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .an-donut-hole{width:78px; height:78px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .an-donut-hole .n{font-family:'Sora',sans-serif; font-size:20px; font-weight:800; color:var(--ink);}
  .an-donut-hole .l{font-size:10.5px; color:var(--ink-muted);}
  .an-legend-row{display:flex; align-items:center; gap:8px; font-size:12.5px; margin-bottom:10px;}
  .an-legend-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .an-legend-label{flex:1; color:var(--ink-secondary);}
  .an-legend-val{font-weight:700; color:var(--ink); flex-shrink:0;}
  .an-area-row{display:flex; align-items:center; gap:10px; margin-bottom:14px; font-size:12.5px;}
  .an-area-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
  .an-area-name{width:88px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink);}
  .an-area-time{width:48px; text-align:right; flex-shrink:0; color:var(--ink-muted);}
  .st-avatar{width:56px; height:56px; border-radius:50%; object-fit:cover; flex-shrink:0; background:var(--accent-bg);}
  .st-avatar-fallback{width:56px; height:56px; border-radius:50%; flex-shrink:0; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Sora',sans-serif; font-size:20px; font-weight:800;}
  .st-field{margin-bottom:16px;}
  .st-field label{display:block; font-size:11.5px; font-weight:700; color:var(--ink-muted); text-transform:uppercase; margin-bottom:6px;}
  .st-field input, .st-field select{width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--border); font-size:13px; font-family:'Inter',sans-serif; background:var(--surface); color:var(--ink); box-sizing:border-box;}
  .st-field-row{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .appr-grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .appr-card{border:2px solid var(--border); border-radius:14px; padding:8px; cursor:pointer; text-align:left;}
  .appr-card.active{border-color:var(--accent);}
  .appr-preview{height:56px; border-radius:8px; margin-bottom:8px; position:relative; overflow:hidden;}
  .appr-check{position:absolute; top:5px; right:5px; width:16px; height:16px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:8px;}
  .appr-card-label{font-size:12px; font-weight:600; color:var(--ink); padding:0 2px 2px;}
  .appr-accent-row{display:flex; gap:10px; flex-wrap:wrap;}
  .appr-accent-dot{width:28px; height:28px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; border:2px solid transparent; box-shadow:0 0 0 1px var(--border) inset;}
  .appr-accent-dot.active{border-color:var(--ink);}
  .settings-nav-item.active{background:var(--accent-bg); color:var(--accent-text); font-weight:600;}
  @media (min-width:900px){
    .persona{display:none;}
    #filters{display:none;}
    #content{display:none;}
    #fab-holder{display:none;}
    .desktop-sidebar-body{display:block; padding:0 18px;}
    .ds-section-title{display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:700; color:var(--ink); margin-bottom:10px;}
    .ds-live-badge{display:flex; align-items:center; gap:5px; font-size:11px; font-weight:700; color:var(--teal-text);}
    .ds-live-dot{width:6px; height:6px; border-radius:50%; background:var(--teal-fill); box-shadow:0 0 0 3px var(--teal-bg); animation:breathe 1.8s ease-in-out infinite;}
    .ds-view-all{font-size:12px; font-weight:700; color:var(--accent-text); cursor:pointer;}
    .ds-stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:22px;}
    .ds-stat-card{background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:10px 7px;}
    .ds-stat-icon{width:24px; height:24px; border-radius:7px; display:flex; align-items:center; justify-content:center; margin-bottom:8px; font-size:11px;}
    .ds-stat-icon-round{width:30px; height:30px; border-radius:50%; font-size:13px;}
    .ds-stat-value{font-size:17px; font-weight:800; font-family:'Sora',sans-serif; color:var(--ink); letter-spacing:-.02em;}
    .ds-stat-label{font-size:9.5px; color:var(--ink-secondary); margin:1px 0 4px;}
    .ds-stat-delta{font-size:9.5px; font-weight:700;}
    .ds-places{display:flex; flex-direction:column; gap:2px; margin-bottom:20px;}
    .ds-place-row{display:flex; align-items:center; gap:10px; padding:7px 4px; border-radius:10px; cursor:pointer;}
    .ds-place-row:hover{background:var(--surface-2);}
    .ds-place-dot{width:28px; height:28px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px;}
    .ds-place-info{flex:1; min-width:0;}
    .ds-place-name{font-size:12.5px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .ds-place-meta{font-size:10.5px; color:var(--ink-muted);}
    .ds-place-time{font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px; flex-shrink:0;}
  }
  .desktop-nav{display:none;}
  .brand-collapse-desktop{display:none;}
  @media (min-width:900px){
    .brand-icons-mobile{display:none !important;}
    .brand-collapse-desktop{display:flex; width:28px; height:28px; border-radius:50%; border:1px solid var(--border); background:var(--surface); align-items:center; justify-content:center; color:var(--ink-muted); cursor:pointer;}
    #loc-banner{display:none !important;}
  }
  .promo-card{display:none;}
  .zoom-group{display:flex; flex-direction:column; background:rgba(255,255,255,.85); -webkit-border:1px solid rgba(255,255,255,.7); border-radius:14px; overflow:hidden; box-shadow:var(--shadow-card);}
  [data-theme="dark"] .zoom-group{background:rgba(24,34,52,.85); border-color:rgba(255,255,255,.08);}
  .zoom-group button{width:38px; height:32px; border:none; background:none; cursor:pointer; color:var(--ink-secondary); font-size:15px;}
  .zoom-group button:first-child{border-bottom:1px solid var(--border);}
  @media (min-width:900px){
    .desktop-nav{display:flex; flex-direction:column; gap:2px; padding:0 18px 18px;}
    .desktop-nav .nav-item{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px; font-size:14px; font-weight:500; color:var(--ink-secondary); cursor:pointer; transition:background .15s, color .15s;}
    .desktop-nav .nav-item i{font-size:18px; width:18px;}
    .desktop-nav .nav-item.active{background:var(--accent-bg); color:var(--accent-text); font-weight:600;}
    .desktop-nav .nav-item:hover:not(.active){background:var(--surface-2); color:var(--ink);}
    .promo-card{display:block; margin:0 18px 20px; background:linear-gradient(135deg,#6366F1 0%,#8B5CF6 55%,#A855F7 100%); border-radius:16px; padding:18px; color:#fff; position:relative; overflow:hidden; flex-shrink:0;}
    .promo-card::after{content:""; position:absolute; right:-30px; top:-30px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.12);}
    .promo-card p{font-size:14.5px; font-weight:700; margin:0 0 4px; position:relative;}
    .promo-card span{font-size:11.5px; opacity:.85; display:block; margin-bottom:14px; line-height:1.4; position:relative;}
    .promo-card button{width:100%; background:#fff; color:#3B5BFF; border:none; border-radius:9px; padding:8px; font-size:12px; font-weight:700; cursor:pointer;}
  }

  /* Adaptive desktop layout: side-by-side list + map instead of tabs */
  @media (min-width:900px){
    body{padding:0;}
    .frame{max-width:none; width:100%; padding:0; box-shadow:none; border-radius:0; background:var(--page);}
    .screen{flex-direction:row; height:100vh; border-radius:0; box-shadow:none; background:var(--page); padding:0; gap:0; position:relative;}
    .app-shell{display:flex; flex-direction:column; position:fixed; top:24px; left:24px; bottom:24px; width:307px; z-index:1000; background:rgba(255,255,255,.85); -webkit-border:1px solid rgba(255,255,255,.7); border-radius:40px; box-shadow:0 20px 60px rgba(15,23,42,.12); overflow:hidden; padding:0; transition:width .25s ease;}
    .app-shell.collapsed{width:84px; height:auto; bottom:auto; max-height:calc(100vh - 48px); padding-bottom:14px;}
    .app-shell.collapsed .app-shell-scroll{flex:none;}
    .app-shell.collapsed .brand-left-text, .app-shell.collapsed .nav-item span, .app-shell.collapsed .desktop-sidebar-body, .app-shell.collapsed > .promo-card{display:none !important;}
    .app-shell.collapsed .desktop-nav .nav-item{justify-content:center; padding:10px;}
    .app-shell.collapsed .desktop-nav .nav-item i{margin:0;}
    .app-shell.collapsed .brand-collapse-desktop i{transform:rotate(180deg);}
    .app-shell.collapsed .persona{display:none !important;}
    .app-shell.collapsed .brand{justify-content:center; padding-left:0;}
    .brand{position:relative; justify-content:flex-start; padding-left:26px;}
    .brand-collapse-desktop{position:absolute; right:0; top:50%; transform:translateY(-50%);}
    .app-shell.collapsed .brand-collapse-desktop{
      position:absolute; top:-4px; right:-6px; width:18px; height:18px;
      opacity:0; pointer-events:none; transform:scale(.8);
      transition:opacity .18s ease, transform .18s ease;
    }
    .app-shell.collapsed .brand:hover .brand-collapse-desktop{
      opacity:1; pointer-events:auto; transform:scale(1);
    }
    .app-shell.collapsed .app-logo-badge{transition:transform .18s ease;}
    .app-shell.collapsed .brand:hover .app-logo-badge{transform:scale(1.06);}
    .app-shell-scroll{flex:1; min-height:0; overflow-y:auto; padding:20px 0 6px; scrollbar-width:none; -ms-overflow-style:none;}
    .app-shell-scroll::-webkit-scrollbar{display:none;}
    [data-theme="dark"] .app-shell{background:rgba(24,34,52,.68); border-color:rgba(255,255,255,.08);}
    [data-theme="dark"] .card, [data-theme="dark"] .summary-strip{background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.08);}
    .map-pane-desktop{flex:1; width:100%; display:flex !important; flex-direction:column; border-radius:0; overflow:hidden; box-shadow:none;}
    .live-pill{display:none !important;}
    #bottomnav{display:none;}
  }
</style>
</head>
<body>

<div class="frame"><div class="screen" id="screen">
  <div class="app-shell">
  <div class="app-shell-scroll">
  <div class="mode-banner" id="mode-banner"></div>
  <div class="loc-banner" id="loc-banner" style="display:none;">
    <span id="loc-banner-text"></span>
    <button onclick="retryLocation()" style="margin-left:8px; font-size:11px; background:#fff; border:1px solid var(--blue-text); color:var(--blue-text); border-radius:12px; padding:2px 10px; cursor:pointer; font-family:'Inter',sans-serif;">Try again</button>
  </div>
  <div class="topbar">
    <div class="brand">
      <div class="wordmark"><span class="app-logo-badge"><svg viewBox="0 0 24 24" width="17" height="17" fill="none"><path d="M2 12h4l1.8-5 4 10 2.2-7 2 2h6" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="brand-left-text">Pulse</span></div>
      <div class="brand-icons-mobile" style="display:flex; align-items:center; gap:14px;">
        <i class="ti ti-moon theme-toggle-icon" id="theme-toggle" onclick="toggleTheme()" style="font-size:19px; color:var(--ink-secondary); cursor:pointer;"></i>
        <i class="ti ti-bell" style="font-size:19px; color:var(--ink-secondary);"></i>
      </div>
      <div class="brand-collapse-desktop" id="brand-collapse-btn" onclick="toggleSidebarCollapse()"><i class="fa-solid fa-chevron-left" style="font-size:10px;"></i></div>
    </div>
    <div class="persona">
      <button id="persona-resident" class="active" onclick="setPersona('resident')">Resident</button>
      <button id="persona-owner" onclick="setPersona('owner')">Business owner</button>
    </div>
  </div>

  <div class="desktop-nav">
    <div class="nav-item active" id="nav-livemap" onclick="showDesktopPage('livemap')"><i class="fa-solid fa-location-dot"></i><span id="navtext-livemap">Live Map</span></div>
    <div class="nav-item" id="nav-nearby" onclick="exploreActive=null; showDesktopPage('nearby')"><i class="fa-regular fa-compass"></i><span id="navtext-nearby">Nearby</span></div>
    <div class="nav-item" id="nav-saved" onclick="showDesktopPage('saved')"><i class="fa-regular fa-bookmark"></i><span id="navtext-saved">Saved Places</span></div>
    <div class="nav-item" id="nav-reports" onclick="showDesktopPage('reports')"><i class="fa-solid fa-shield-halved"></i><span id="navtext-reports">Reports</span></div>
    <div class="nav-item" id="nav-analytics" onclick="showDesktopPage('analytics')"><i class="fa-solid fa-chart-line"></i><span id="navtext-analytics">Analytics</span></div>
    <div class="nav-item" id="nav-settings" onclick="showDesktopPage('settings')"><i class="fa-solid fa-gear"></i><span id="navtext-settings">Settings</span></div>
  </div>

  <div id="desktop-sidebar-body" class="desktop-sidebar-body"></div>

  <div id="filters" class="filters"></div>
  <div id="content" class="content"></div>

  <div id="fab-holder"></div>
  <div id="toast" class="toast"></div>

  <div id="bottomnav" class="bottomnav">
    <button id="nav-feed" class="active" onclick="setTab('feed')"><i class="ti ti-list"></i>Feed</button>
    <button id="nav-map" onclick="setTab('map')"><i class="ti ti-map-2"></i>Map</button>
    <button id="nav-report" onclick="openReportModal()"><i class="ti ti-alert-triangle"></i>Report</button>
  </div>
  </div>
  <div class="promo-card">
    <p id="promo-title-text">Help improve Pulse</p>
    <span id="promo-sub-text">Report wait times and help others.</span>
    <button id="promo-btn-text" onclick="openReportModal()">+ Report now</button>
  </div>
  </div>

  <div class="map-pane-desktop" id="map-pane-desktop" style="display:none;">
    <div id="nearby-page" class="nearby-page" style="display:none;"></div>
    <div id="saved-page" class="nearby-page" style="display:none;"></div>
    <div id="reports-page" class="nearby-page" style="display:none;"></div>
    <div id="analytics-page" class="nearby-page" style="display:none;"></div>
    <div id="settings-page" class="nearby-page" style="display:none;"></div>
    <div class="map-frame-overlay" id="map-frame-overlay"></div>
    <div class="map-wrap" style="flex:1;" id="map-wrap-el">
      <div id="leaflet-map"></div>
      <div class="search-bar-wrap">
        <div class="search-pill">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="search-input-desktop" class="search-input" placeholder="Search places, businesses, addresses" oninput="onSearchInput(this.value,'desktop')" onfocus="if(!this.value) showRecentSearches('desktop')">
          <button type="button" class="search-filter-btn" title="Use my location" style="background:var(--accent-bg); color:var(--accent-text);" onclick="useMyLocationFromSearch()"><i class="fa-solid fa-location-crosshairs"></i></button>
          <button type="button" class="search-filter-btn" title="Filters"><i class="fa-solid fa-sliders"></i></button>
        </div>
        <div id="search-results-desktop" class="search-results"></div>
      </div>
      <div class="top-right-controls">

function getAuthToken(){ return localStorage.getItem('pulse_auth_token'); }
function setAuthToken(token){
  if(token) localStorage.setItem('pulse_auth_token', token);
  else localStorage.removeItem('pulse_auth_token');

async function loadCurrentUser(){
  const token = getAuthToken();
  if(!token || !API_BASE){ currentUser = null; return; }
  try{
    const res = await fetch(API_BASE + '/api/auth/me', {headers:{'Authorization':'Bearer '+token}});
    if(res.status === 401){
      // Server explicitly says this token is invalid/expired — safe to clear.
      setAuthToken(null);
      currentUser = null;
      return;
    }
    if(!res.ok){ currentUser = null; return; } // some other hiccup — leave the token alone, retry next load
    const data = await res.json();
    currentUser = (data && data.user) ? data.user : null;
  }catch(e){
    // Network/CORS failure — leave the token alone rather than guessing it's invalid.
    currentUser = null;
  }
}
async function authRequest(path, body){
  const token = getAuthToken();
  return api(path, {
    method:'POST',
    headers:{'Content-Type':'application/json', ...(token ? {'Authorization':'Bearer '+token} : {})},
    body: JSON.stringify(body||{})
  });
}

// Demo data lives on a small fixed grid (x:0-340, y:0-460). Convert

function demoToLatLng(x, y){
  if(!userLoc) return {lat:33.6, lng:73.0};
  const dLat = (230 - y) / 230 * 0.01;
  const dLng = (x - 170) / 170 * 0.01;
  return {lat: userLoc.lat + dLat, lng: userLoc.lng + dLng};
}
function locLatLng(l){
  return l.osm ? {lat:l.lat, lng:l.lng} : demoToLatLng(l.x, l.y);
}
function haversineMiles(lat1, lng1, lat2, lng2){
  const R = 3958.8; // Earth radius in miles
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function realDistanceMi(l){
  const origin = userLoc || {lat:33.6, lng:73.0};
  const p = locLatLng(l);
  const miles = haversineMiles(origin.lat, origin.lng, p.lat, p.lng);
  return { miles, label: miles < 0.1 ? '<0.1 mi' : miles.toFixed(1)+' mi' };
}

function getUserLocation(){
  return new Promise(resolve => {
    if(!navigator.geolocation){ resolve({error:'not_supported'}); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({lat: pos.coords.latitude, lng: pos.coords.longitude}),
      err => {
        const reasons = {1:'permission_denied', 2:'position_unavailable', 3:'timeout'};
        resolve({error: reasons[err.code] || 'unknown_error'});
      },
      {timeout: 15000}
    );
  });
}

async function fetchNearbyPlaces(lat, lng){
  const r = 2000;
  const query = `[out:json][timeout:20];(
    node["amenity"="restaurant"](around:${r},${lat},${lng});
    node["amenity"="fast_food"](around:${r},${lat},${lng});
    node["amenity"="cafe"](around:${r},${lat},${lng});
    node["shop"="bakery"](around:${r},${lat},${lng});
    node["amenity"="fuel"](around:${r},${lat},${lng});
    node["amenity"="pharmacy"](around:${r},${lat},${lng});
    node["amenity"="clinic"](around:${r},${lat},${lng});
    node["amenity"="hospital"](around:${r},${lat},${lng});
    node["amenity"="dentist"](around:${r},${lat},${lng});
    node["shop"="hairdresser"](around:${r},${lat},${lng});
    node["shop"="car_repair"](around:${r},${lat},${lng});
    node["amenity"="bank"](around:${r},${lat},${lng});
    node["shop"="laundry"](around:${r},${lat},${lng});
    node["shop"="dry_cleaning"](around:${r},${lat},${lng});
    node["shop"="supermarket"](around:${r},${lat},${lng});
    node["shop"="convenience"](around:${r},${lat},${lng});
  );out body 100;`;
  try{
    const res = await fetch('https://overpass-api.de/api/interpreter', {method:'POST', body: query});
    if(!res.ok) return [];
    const data = await res.json();
    const catMap = {
      restaurant:{category:'food', icon:'ti-tools-kitchen-2'},
      fast_food:{category:'food', icon:'ti-burger'},
      cafe:{category:'food', icon:'ti-coffee'},
      bakery:{category:'food', icon:'ti-bread'},
      fuel:{category:'fuel', icon:'ti-gas-station'},
      pharmacy:{category:'health', icon:'ti-first-aid-kit'},
      clinic:{category:'health', icon:'ti-stethoscope'},
      hospital:{category:'health', icon:'ti-building-hospital'},
      dentist:{category:'health', icon:'ti-stethoscope'},
      hairdresser:{category:'service', icon:'ti-scissors'},
      car_repair:{category:'service', icon:'ti-car'},
      bank:{category:'service', icon:'ti-building-bank'},
      laundry:{category:'errand', icon:'ti-wash'},
      dry_cleaning:{category:'errand', icon:'ti-wash'},
      supermarket:{category:'errand', icon:'ti-shopping-cart'},
      convenience:{category:'errand', icon:'ti-shopping-cart'},
    };
    const mapped = (data.elements || []).filter(el => el.tags && el.tags.name).map(el => {
      const kind = el.tags.amenity || el.tags.shop;
      const c = catMap[kind] || {category:'service', icon:'ti-map-pin'};
      return {
        id: 'osm_' + el.id, name: el.tags.name, category: c.category, icon: c.icon,
        distance: 'nearby', status: 'unknown', minutes: null, confirms: 0,
        updated: 'no reports yet', ownerOwned: false, ownerVerified: false,
        osm: true, lat: el.lat, lng: el.lon,
        hours: el.tags.opening_hours || null, // real OSM tag when contributors have added it — null means genuinely unknown
      };
    });
    // De-dupe: OSM sometimes has two nodes for the same real place.
    // Treat same name + within ~30m as a duplicate, keep the first.
    const deduped = [];
    for(const p of mapped){
      const dupe = deduped.find(x => x.name===p.name && Math.abs(x.lat-p.lat)<0.0003 && Math.abs(x.lng-p.lng)<0.0003);
      if(!dupe) deduped.push(p);
    }
    return deduped;
  }catch(e){ return []; }
}

function deltaLabel(current, baseline){
  if(baseline == null || baseline === 0) return null;
  const pct = Math.round(((current - baseline) / baseline) * 100);
  if(pct === 0) return null;
  const sign = pct > 0 ? '\u2191' : '\u2193';
  const color = pct > 0 ? 'var(--teal-text)' : 'var(--coral-text)';
  return `<span style="color:${color};">${sign} ${Math.abs(pct)}%</span>`;
}

function initMapIfNeeded(){
  if(leafletMap || typeof L === 'undefined') return;
  const center = userLoc || {lat:33.6, lng:73.0};
  const worldBounds = L.latLngBounds([-85,-185],[85,185]);
  leafletMap = L.map(leafletMapDiv, {zoomControl:false, minZoom:3, maxBounds:worldBounds, maxBoundsViscosity:1.0, fadeAnimation:false}).setView([center.lat, center.lng], 15);
  const startDark = document.documentElement.dataset.theme === 'dark';
  baseTileLayer = L.tileLayer(startDark ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png' : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    maxZoom:19, attribution:'&copy; OpenStreetMap contributors &copy; CARTO', keepBuffer:6, updateWhenZooming:false
  }).addTo(leafletMap);
  let tileErrorCount = 0;
  baseTileLayer.on('tileerror', ()=>{
    tileErrorCount++;
    if(tileErrorCount === 6 && !satelliteOn){ // CARTO seems down/rate-limited — fall back to standard OSM tiles
      leafletMap.removeLayer(baseTileLayer);
      baseTileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap contributors', keepBuffer:6, updateWhenZooming:false}).addTo(leafletMap);
      toast('Map tiles switched to a backup source');
    }
  });
  ['food','fuel','health','service','errand','road','police','signal'].forEach(cat=>{
    markerLayers[cat] = L.layerGroup().addTo(leafletMap);
  });
  if(userLoc && usingRealLocation){
    L.circleMarker([userLoc.lat, userLoc.lng], {radius:7, color:'#fff', weight:2, fillColor:'#378ADD', fillOpacity:1}).addTo(leafletMap);
  }
  const storedStyle = localStorage.getItem('pulse_map_style');
  if(storedStyle && storedStyle !== 'dark' && storedStyle !== 'standard'){
    setTimeout(()=>applyMapStyle(storedStyle), 0);
  }
}

let lastMarkersSignature = null;
function updateMapMarkers(){
  if(!leafletMap) return;
  const locSig = locations.map(l=>l.id+'|'+l.minutes+'|'+l.status).join(',');
  const roadSig = roadReports.length; // type (which drives the icon/color) never changes after creation
  const sigSig = signals.map(s=>s.id+'|'+s.color).join(',');
  const signature = locSig+'##'+roadSig+'##'+sigSig+'##'+JSON.stringify(activeLayers);
  if(signature === lastMarkersSignature) return; // nothing marker-relevant changed since last time — skip the expensive rebuild
  lastMarkersSignature = signature;

  Object.values(markerLayers).forEach(lg=>lg.clearLayers());

  locations.forEach(l=>{
    if(!activeLayers[l.category]) return;
    const pos = l.osm ? [l.lat, l.lng] : (()=>{const p=demoToLatLng(l.x,l.y); return [p.lat,p.lng];})();
    const c = statusColors[l.status];
    L.marker(pos, {icon:pinIconMinutes(l.minutes, c.fill)}).addTo(markerLayers[l.category]).on('click', ()=>openDetail(l.id));
  });

  roadReports.forEach(r=>{
    const layer = roadLayerFor(r.type);
    if(!activeLayers[layer]) return;
    const p = demoToLatLng(r.x, r.y);
    L.marker([p.lat,p.lng], {icon:pinIcon(r.icon, roadFillColor(r.type))}).addTo(markerLayers[layer]).on('click', ()=>openRoadDetail(r.id));
  });

  if(activeLayers.signal){
    signals.forEach(s=>{
      const p = demoToLatLng(s.x, s.y);
      const fill = s.color==='red' ? 'var(--coral-fill)' : 'var(--teal-fill)';
      L.marker([p.lat,p.lng], {icon:pinIcon('ti-traffic-lights', fill)}).addTo(markerLayers.signal).on('click', ()=>openSignalDetail(s.id));
    });
  }
  updateLayersButtons();
}

function openLayersPanel(){
  const defs = [
    {k:'food',icon:'ti-tools-kitchen-2',label:'Food'},
    {k:'fuel',icon:'ti-gas-station',label:'Fuel'},
    {k:'health',icon:'ti-first-aid-kit',label:'Health'},
    {k:'service',icon:'ti-scissors',label:'Service'},
    {k:'errand',icon:'ti-wash',label:'Errands'},
    {k:'road',icon:'ti-road',label:'Roads'},
    {k:'police',icon:'ti-shield',label:'Police'},
    {k:'signal',icon:'ti-traffic-lights',label:'Signals'},
  ];
  const allOn = Object.values(activeLayers).every(v=>v);
  document.getElementById('modal-holder').innerHTML = `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="sheet">
      <div class="sheet-head">
        <div><p class="sheet-title">Map layers</p><p class="sheet-sub">Toggle what shows on the map</p></div>
        <button class="close-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
      </div>
      <div class="layer-grid">
        ${defs.map(d=>`<div class="layer-opt ${activeLayers[d.k]?'on':''}" onclick="toggleLayer('${d.k}')"><span style="font-size:19px;">${emojiFor(d.icon)}</span><span>${d.label}</span></div>`).join('')}
      </div>
      ${allOn ? '' : `<button class="primary-btn" style="margin-top:4px;" onclick="showAllLayers()">Show everything</button>`}
    </div>
  </div>`;
}
function toggleLayer(k){
  activeLayers[k] = !activeLayers[k];
  updateMapMarkers();
  openLayersPanel();
}
function showAllLayers(){
  Object.keys(activeLayers).forEach(k=>activeLayers[k]=true);
  updateMapMarkers();
  openLayersPanel();
}

function positionMap(){
  if(!leafletMapDiv) return;
  const isDesktop = window.matchMedia('(min-width:900px)').matches;
  if(isDesktop){
    const wrap = document.querySelector('#map-pane-desktop .map-wrap');
    document.getElementById('map-pane-desktop').style.display = 'block';
    if(wrap && leafletMapDiv.parentElement !== wrap) wrap.appendChild(leafletMapDiv);
  } else if(tab==='map'){
    const wrap = document.getElementById('mobile-map-wrap');
    if(wrap && leafletMapDiv.parentElement !== wrap) wrap.appendChild(leafletMapDiv);
  } else {
    return; // mobile, not on Map tab — leave the div wherever it last was, off-screen is fine
  }
  initMapIfNeeded();
  updateMapMarkers();
}
let resizeDebounce;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeDebounce);
  resizeDebounce = setTimeout(()=>{
    positionMap();
    if(leafletMap) leafletMap.invalidateSize();
  }, 150);
});

function setTab(t){
  tab = t;
  document.getElementById('nav-feed').classList.toggle('active', t==='feed');
  document.getElementById('nav-map').classList.toggle('active', t==='map');
  render();
}

function setFilter(f){ filter = f; render(); }

function updateMapTheme(isDark){
  if(!leafletMap || !baseTileLayer || satelliteOn) return;
  leafletMap.removeLayer(baseTileLayer);
  baseTileLayer = L.tileLayer(
    isDark ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png' : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    {maxZoom:19, attribution:'&copy; OpenStreetMap contributors &copy; CARTO', keepBuffer:6, updateWhenZooming:false}
  );
  baseTileLayer.addTo(leafletMap);
  baseTileLayer.bringToBack();
}
function applyThemeMode(mode){
  if(mode) localStorage.setItem('pulse_theme_mode', mode);
  mode = localStorage.getItem('pulse_theme_mode') || 'light';
  const isDark = mode==='system' ? window.matchMedia('(prefers-color-scheme: dark)').matches : mode==='dark';
  document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
  document.querySelectorAll('.theme-toggle-icon').forEach(el=>{ el.className = 'ti theme-toggle-icon ' + (isDark ? 'ti-sun' : 'ti-moon'); });
  document.querySelectorAll('.theme-toggle-emoji').forEach(el=>{ el.textContent = isDark ? '\u2600\uFE0F' : '\u{1F319}'; });
  updateMapTheme(isDark);
}

const SUPPORTED_LANGS = Object.keys(TRANSLATIONS);
const RTL_LANGS = ['ar','ur'];
function getCurrentLanguage(){
  let lang = null;
  if(currentUser && currentUser.language) lang = currentUser.language;
  else { try{ lang = (JSON.parse(localStorage.getItem('pulse_guest_prefs'))||{}).language; }catch(e){} }
  if(!lang) lang = (navigator.language || 'en').split('-')[0];
  return SUPPORTED_LANGS.includes(lang) ? lang : 'en';
}
function t(key){
  const lang = getCurrentLanguage();
  return (TRANSLATIONS[lang] && TRANSLATIONS[lang][key]) || TRANSLATIONS.en[key] || key;
}
function applyLanguage(){
  const lang = getCurrentLanguage();
  document.documentElement.lang = lang;
  const navMap = {livemap:'navtext-livemap', nearby:'navtext-nearby', saved:'navtext-saved', reports:'navtext-reports', analytics:'navtext-analytics', settings:'navtext-settings'};
  const navKeyMap = {livemap:'nav_livemap', nearby:'nav_nearby', saved:'nav_saved', reports:'nav_reports', analytics:'nav_analytics', settings:'nav_settings'};
  Object.keys(navMap).forEach(p=>{
    const el = document.getElementById(navMap[p]);
    if(el) el.textContent = t(navKeyMap[p]);
  });
  const promoTitle = document.getElementById('promo-title-text');
  const promoSub = document.getElementById('promo-sub-text');
  const promoBtn = document.getElementById('promo-btn-text');
  if(promoTitle) promoTitle.textContent = t('promo_title');
  if(promoSub) promoSub.textContent = t('promo_sub');
  if(promoBtn) promoBtn.textContent = t('promo_btn');
  const searchInputs = document.querySelectorAll('#search-input-desktop, #search-input-mobile');
  searchInputs.forEach(el=>{ el.placeholder = t('search_placeholder'); });
  if(typeof renderDesktopSidebar==='function') renderDesktopSidebar();
  if(typeof currentDesktopPage!=='undefined' && typeof renderDesktopPage==='function') renderDesktopPage(currentDesktopPage);
}

const GUEST_PREFS_KEY = 'pulse_guest_prefs';
function getGuestPrefs(){
  try{ return JSON.parse(localStorage.getItem(GUEST_PREFS_KEY)) || {}; }catch(e){ return {}; }
}
function setGuestPref(key, val){
  const p = getGuestPrefs();
  p[key] = val;
  localStorage.setItem(GUEST_PREFS_KEY, JSON.stringify(p));
}
let pendingAvatarData = null;
function resizeImageToDataUrl(file, maxSize){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxSize){ h = Math.round(h*maxSize/w); w = maxSize; } }
        else { if(h > maxSize){ w = Math.round(w*maxSize/h); h = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function triggerPhotoUpload(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async e => {
    const file = e.target.files[0];
    if(!file) return;
    try{
      pendingAvatarData = await resizeImageToDataUrl(file, 160);
      const preview = document.getElementById('profile-avatar-preview');
      if(preview) preview.innerHTML = `<img src="${pendingAvatarData}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
      toast('Photo ready \u2014 click Save Changes to keep it');
    }catch(err){ toast('Could not read that image'); }
  };
  input.click();
}
async function saveProfileChanges(){
  const nameEl = document.getElementById('profile-name-input');
  const phoneEl = document.getElementById('profile-phone-input');
  const userEl = document.getElementById('profile-username-input');
  const langEl = document.getElementById('profile-lang-select');
  const tzEl = document.getElementById('profile-tz-select');
  const language = langEl ? langEl.value : null;
  const timezone = tzEl ? tzEl.value : null;

  if(!currentUser){
    if(language) setGuestPref('language', language);
    if(timezone) setGuestPref('timezone', timezone);
    applyLanguage();
    toast('Saved on this device for now \u2014 log in to keep it permanently.');
    return;
  }

  const btn = document.getElementById('profile-save-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving\u2026'; }
  const payload = {
    name: nameEl ? nameEl.value.trim() : currentUser.name,
    phone: phoneEl ? phoneEl.value.trim() : currentUser.phone,
    username: userEl ? userEl.value.trim() : currentUser.username,
    language, timezone,
  };
  if(pendingAvatarData) payload.avatarData = pendingAvatarData;
  const data = await authRequest('/api/auth/profile', payload);

function animateCounters(scope){
  scope.querySelectorAll('.summary-stat .n, .ds-stat-value').forEach(el=>{
    const target = parseInt(el.textContent, 10);
    if(isNaN(target)) return;
    const duration = 500;
    const start = performance.now();
    function step(now){
      const progress = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = Math.round(target * eased);
      if(progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

let heatLayer = null;
let heatOn = false;
function toggleHeatmap(){
  if(!leafletMap) return;
  heatOn = !heatOn;
  document.querySelectorAll('.heat-switch').forEach(el=>el.classList.toggle('on', heatOn));
  if(heatOn){
    Object.values(markerLayers).forEach(lg=>leafletMap.removeLayer(lg));
    const pts = [];
    locations.forEach(l=>{
      if(!activeLayers[l.category]) return;
      const pos = l.osm ? [l.lat,l.lng] : (()=>{const p=demoToLatLng(l.x,l.y); return [p.lat,p.lng];})();
      const weight = l.status==='red' ? 1 : l.status==='amber' ? 0.6 : 0.3;
      for(let i=0;i<12;i++) pts.push([pos[0]+(Math.random()-0.5)*0.006, pos[1]+(Math.random()-0.5)*0.006, weight]);
    });
    heatLayer = L.heatLayer(pts, {radius:32, blur:24, maxZoom:17}).addTo(leafletMap);
  } else {
    if(heatLayer){ leafletMap.removeLayer(heatLayer); heatLayer = null; }
    Object.values(markerLayers).forEach(lg=>lg.addTo(leafletMap));
  }
}

let routeLayer = null, routeStartMarker = null, routeEndMarker = null, routeAltLayers = [];
function closeRoute(){
  if(routeLayer && leafletMap){ leafletMap.removeLayer(routeLayer); routeLayer = null; }
  if(routeStartMarker && leafletMap){ leafletMap.removeLayer(routeStartMarker); routeStartMarker = null; }
  if(routeEndMarker && leafletMap){ leafletMap.removeLayer(routeEndMarker); routeEndMarker = null; }
  if(routeAltLayers && routeAltLayers.length && leafletMap){ routeAltLayers.forEach(l=>leafletMap.removeLayer(l)); routeAltLayers = []; }
  currentRouteOptions = [];
  const panel = document.getElementById('route-panel');
  if(panel) panel.classList.remove('show');
}
const ORS_PROFILES = {driving:'driving-car', walking:'foot-walking', cycling:'cycling-regular'};
let directionsMode = 'driving';
function setDirectionsMode(mode){
  if(mode==='transit'){ toast('Transit directions aren\u2019t supported yet.'); return; }
  directionsMode = mode;
  document.querySelectorAll('.dir-mode-icon').forEach(el=>el.classList.toggle('active', el.dataset.mode===mode));
}
let currentRouteOptions = [];
let selectedRouteIdx = 0;
let currentRouteDestInfo = null;
function reportLatLng(r){
  return { lat: (r.lat!=null ? r.lat : demoToLatLng(r.x, r.y).lat), lng: (r.lng!=null ? r.lng : demoToLatLng(r.x, r.y).lng) };
}
function findRealTrafficWarnings(geometry){
  // Real check: any jam/closure report from roadReports within ~400m of the actual route path.
  // Sample toward ~40 points regardless of route length so short routes aren't under-sampled.
  const stride = Math.max(1, Math.floor(geometry.length / 40));
  const sample = geometry.filter((_, i) => i % stride === 0 || i === geometry.length - 1);
  const hits = [];
  roadReports.forEach(r => {
    if(r.type !== 'jam' && r.type !== 'closure') return;
    const pos = reportLatLng(r);
    const near = sample.some(([lat,lng]) => haversineMiles(lat, lng, pos.lat, pos.lng) * 1609 < 400);
    if(near) hits.push(r);
  });
  return hits;
}
function renderRoutePanel(){
  const panel = document.getElementById('route-panel');
  if(!panel || !currentRouteOptions.length) return;
  const route = currentRouteOptions[selectedRouteIdx];
  const km = (route.distanceMeters/1000).toFixed(1);
  const mins = Math.max(1, Math.round(route.durationSeconds/60));
  const warnings = findRealTrafficWarnings(route.geometry);

  if(typeof L !== 'undefined' && leafletMap){
    if(routeLayer) leafletMap.removeLayer(routeLayer);
    if(routeAltLayers){ routeAltLayers.forEach(l=>leafletMap.removeLayer(l)); }
    routeAltLayers = currentRouteOptions.map((r,i)=> i===selectedRouteIdx ? null :
      L.polyline(r.geometry, {color:'#9CA3AF', weight:4, opacity:.6}).addTo(leafletMap).on('click', ()=>{ selectRouteOption(i); })
    ).filter(Boolean);
    routeLayer = L.polyline(route.geometry, {color:'#2563EB', weight:5, opacity:.9, lineJoin:'round'}).addTo(leafletMap);
    routeLayer.bringToFront();
  }

  panel.innerHTML = `
    <div class="route-panel-head">
      <div>
        <div class="route-summary">${mins} min</div>
        <div class="route-sub">${km} km &middot; to ${currentRouteDestInfo.name}</div>
      </div>
      <button class="close-btn" onclick="closeRoute()" title="Exit navigation"><i class="fa-solid fa-xmark"></i></button>
    </div>
    ${currentRouteOptions.length > 1 ? `<div class="route-opt-row">${currentRouteOptions.map((r,i)=>{
      const m = Math.max(1, Math.round(r.durationSeconds/60));
      const k = (r.distanceMeters/1000).toFixed(1);
      return `<div class="route-opt-card ${i===selectedRouteIdx?'active':''}" onclick="selectRouteOption(${i})"><div class="route-opt-time">${m} min</div><div class="route-opt-dist">${k} km${i===0?' &middot; Fastest':''}</div></div>`;
    }).join('')}</div>` : ''}
    ${warnings.length ? `<div class="route-warning"><i class="fa-solid fa-triangle-exclamation"></i>${warnings.length===1 ? warnings[0].detail || (warnings[0].type==='closure'?'Road closure':'Traffic jam')+' reported near '+warnings[0].name : warnings.length+' real reports (jam/closure) along this route'}</div>` : ''}
    <div>
      ${route.steps && route.steps.length ? route.steps.map(s=>`<div class="route-step">
        <span class="route-step-icon"><i class="fa-solid fa-arrow-up"></i></span>
        <div style="flex:1;">${s.instruction}${s.distance ? `<div style="font-size:11px; color:var(--ink-muted); margin-top:2px;">${s.distance < 1000 ? Math.round(s.distance)+' m' : (s.distance/1000).toFixed(1)+' km'}</div>` : ''}</div>
      </div>`).join('') : `<p style="font-size:12px; color:var(--ink-muted);">Step-by-step turns aren't available for this route, but the path is drawn on the map.</p>`}
    </div>
  `;
}
function selectRouteOption(idx){
  selectedRouteIdx = idx;
  renderRoutePanel();
  if(leafletMap && routeLayer) leafletMap.fitBounds(routeLayer.getBounds(), {paddingTopLeft:[360,40], paddingBottomRight:[40,40]});
}
async function startRouteTo(destPos, destName, destIcon, destFill, originOverride){
  closeModal();
  exploreActive = null;
  const explorePanel = document.getElementById('explore-panel');
  if(explorePanel) explorePanel.classList.remove('show');
  showDesktopPage('livemap');
  initMapIfNeeded();

  const panel = document.getElementById('route-panel');
  if(!panel) return;
  panel.classList.add('show');
  panel.innerHTML = `<div style="text-align:center; padding:16px 0; color:var(--ink-muted); font-size:13px;"><i class="fa-solid fa-spinner fa-spin" style="margin-right:6px;"></i>Finding a route to ${destName}...</div>`;

  const origin = originOverride || await getUserLocation();
  if(origin.error){
    panel.innerHTML = `<div>
      <p style="font-size:13px; color:var(--ink-secondary); margin-bottom:14px;">Couldn't get your location to route from (${origin.error.replace(/_/g,' ')}). Enable location access, or type a starting point manually in the search box.</p>
      <button class="primary-btn" style="width:100%;" onclick="closeRoute()">Close</button>
    </div>`;
    return;
  }

  const profile = ORS_PROFILES[directionsMode] || 'driving-car';
  const wantAlt = profile === 'driving-car';
  const data = await api(`/api/directions?from=${origin.lat},${origin.lng}&to=${destPos.lat},${destPos.lng}&profile=${profile}${wantAlt ? '&alternatives=true' : ''}`);
  if(!data || data.error){
    panel.innerHTML = `<div>
      <p style="font-size:13px; color:var(--ink-secondary); margin-bottom:14px;">Couldn't load a route right now${data && data.error ? ' — '+data.error : ''}.</p>
      <button class="primary-btn" style="width:100%;" onclick="closeRoute()">Close</button>
    </div>`;
    return;
  }

  closeRoute();
  panel.classList.add('show');

  currentRouteOptions = (data.routes && data.routes.length ? data.routes : [data]);
  selectedRouteIdx = 0;
  currentRouteDestInfo = {name: destName};

  if(typeof L !== 'undefined' && leafletMap){
    routeStartMarker = L.circleMarker([origin.lat, origin.lng], {radius:7, color:'#fff', weight:2, fillColor:'#378ADD', fillOpacity:1}).addTo(leafletMap);
    routeEndMarker = L.marker([destPos.lat, destPos.lng], {icon: pinIcon(destIcon || 'ti-map-pin', destFill || 'var(--accent)')}).addTo(leafletMap);
  }
  renderRoutePanel();
  if(leafletMap && routeLayer) leafletMap.fitBounds(routeLayer.getBounds(), {paddingTopLeft:[360,40], paddingBottomRight:[40,40]});
}
async function openDirections(id){
  const l = locations.find(x=>String(x.id)===String(id));
  if(!l) return;
  const destPos = l.osm ? {lat:l.lat, lng:l.lng} : demoToLatLng(l.x, l.y);
  const c = statusColors[l.status] || statusColors.unknown;
  const originOverride = await resolveTypedOrigin();
  await startRouteTo(destPos, l.name, l.icon, c.fill, originOverride);
}

async function loadBusyTimes(id){
  const data = await api('/api/busy-times?locationId=' + encodeURIComponent(id));
  const holder = document.getElementById('busy-times-' + id);
  if(!holder || !data || !data.hasData) return;
  const hourLabel = h => h===0 ? '12 AM' : h<12 ? h+' AM' : h===12 ? '12 PM' : (h-12)+' PM';
  holder.innerHTML = `<div style="margin:10px 0 0; padding-top:10px; border-top:1px solid var(--border);">
    <p style="font-size:11px; color:var(--ink-muted); margin:0;">Based on ${data.buckets.reduce((s,b)=>s+b.count,0)} real check-ins, this place tends to be busiest around <strong style="color:var(--ink);">${hourLabel(data.busiestHour)}</strong> (avg ${data.busiestAvgWait} min wait).</p>
  </div>`;
}
async function loadWaitSparkline(id){
  const data = await api('/api/location-history?locationId=' + encodeURIComponent(id));
  const holder = document.getElementById('wait-sparkline-' + id);
  if(!holder || !data || !data.points || data.points.length < 2) return;
  const pts = data.points;
  const maxM = Math.max(...pts.map(p=>p.minutes), 1);
  const w = 100, h = 28;
  const coords = pts.map((p,i)=> {
    const x = pts.length===1 ? 0 : (i/(pts.length-1))*w;
    const y = h - (p.minutes/maxM)*h;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  holder.innerHTML = `<div style="margin:0 0 10px; padding-top:10px; border-top:1px solid var(--border);">
    <p style="font-size:11px; color:var(--ink-muted); margin:0 0 4px;">Recent wait times (real check-ins)</p>
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%; height:32px;"><polyline points="${coords}" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>
  </div>`;
}

async function rateLocation(id, stars){
  let l = locations.find(x=>String(x.id)===String(id));
  if(!l) return;
  if(l.osm){
    const res = await api('/api/report', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({kind:'wait', name:l.name, x:100, y:70})});
    if(res && res.id){ l.id = res.id; l.osm = false; id = res.id; }
  }
  const oldCount = l.ratingCount || 0;
  const oldSum = (l.ratingAvg || 0) * oldCount;
  l.ratingCount = oldCount + 1;
  l.ratingAvg = Math.round(((oldSum + stars) / l.ratingCount) * 10) / 10;
  api('/api/rate', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({locationId:id, stars})});
  toast('Thanks for rating!');
  closeModal();
  render();
}

async function resolveLocation(){
  const locBanner = document.getElementById('loc-banner');
  const locBannerText = document.getElementById('loc-banner-text');
  const loc = await getUserLocation();
  const fallback = {lat: 33.6, lng: 73.0};
  const gotRealLocation = loc && !loc.error;
  const centerForPlaces = gotRealLocation ? loc : (userLoc || fallback);
  if(gotRealLocation){
    userLoc = loc; usingRealLocation = true;
    locBanner.style.display = 'none';
  } else {
    if(!userLoc){ userLoc = fallback; usingRealLocation = false; }
    const reasonText = {
      permission_denied: 'Location permission denied',
      position_unavailable: "This device can't get a location fix",
      timeout: "Couldn't get a location fix (common on desktops without GPS)",
      not_supported: "This browser doesn't support location",
      unknown_error: 'Could not get location',
    };
    locBannerText.textContent = (reasonText[loc && loc.error] || 'Could not get location') + ' \u2014 try again, or just search your area above';
    locBanner.style.display = 'flex';
  }
  render();
  if(leafletMap) leafletMap.setView([centerForPlaces.lat, centerForPlaces.lng], 15);

  locations = locations.filter(l => !l.osm);
  const places = await fetchNearbyPlaces(centerForPlaces.lat, centerForPlaces.lng);
  osmPlaces = places;
  locations = locations.concat(places);
  render();
  fetchWeather(centerForPlaces.lat, centerForPlaces.lng);
}

const WEATHER_CODE_ICON = {
  0:['ti-sun','Clear sky'], 1:['ti-sun','Mainly clear'], 2:['ti-cloud','Partly cloudy'], 3:['ti-cloud','Overcast'],
  45:['ti-cloud-fog','Fog'], 48:['ti-cloud-fog','Fog'],
  51:['ti-cloud-drizzle','Drizzle'], 53:['ti-cloud-drizzle','Drizzle'], 55:['ti-cloud-drizzle','Drizzle'],
  61:['ti-cloud-rain','Light rain'], 63:['ti-cloud-rain','Rain'], 65:['ti-cloud-rain','Heavy rain'],
  71:['ti-snowflake','Light snow'], 73:['ti-snowflake','Snow'], 75:['ti-snowflake','Heavy snow'],
  80:['ti-cloud-rain','Showers'], 81:['ti-cloud-rain','Showers'], 82:['ti-cloud-rain','Violent showers'],
  95:['ti-cloud-bolt','Thunderstorm'], 96:['ti-cloud-bolt','Thunderstorm'], 99:['ti-cloud-bolt','Thunderstorm'],
};
async function fetchWeather(lat, lng){
  let wx = null, aq = null;
  try{
    const wxRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,weather_code`);
    if(wxRes.ok) wx = await wxRes.json();
  }catch(e){ console.warn('Weather fetch failed', e); }
  try{
    const aqRes = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lng}&current=us_aqi`);
    if(aqRes.ok) aq = await aqRes.json();
  }catch(e){ console.warn('AQI fetch failed', e); }

  if(!wx || !wx.current) return;
  const temp = Math.round(wx.current.temperature_2m);
  const [icon, label] = WEATHER_CODE_ICON[wx.current.weather_code] || ['ti-cloud', 'Weather'];
  const aqi = aq && aq.current ? Math.round(aq.current.us_aqi) : null;
  const html = `<i class="ti ${icon}"></i><div><div class="t">${temp}\u00B0C</div><div class="d">${label}${aqi!=null?' \u00B7 AQI '+aqi:''}</div></div>`;
  ['weather-card-desktop','weather-card-mobile'].forEach(id=>{
    const el = document.getElementById(id);
    if(el){ el.innerHTML = html; el.classList.add('show'); }
  });
}

async function boot(){

  const banner = document.getElementById('mode-banner');

  const data = await api('/api/feed');
  if(data){
    locations = data.locations;
    roadReports = data.roadReports;

    banner.classList.remove('show');

  render(); // show demo data immediately, don't block on location/Overpass

  await resolveLocation();

function pulseDataBytes(){
  let bytes = 0;
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf('pulse_')===0) bytes += (k.length + (localStorage.getItem(k)||'').length) * 2; // UTF-16 estimate
  }
  return bytes;
}
function fmtBytes(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}
async function loadStorageInfo(){
  const el = document.getElementById('storage-info');
  if(!el) return;
  let usage = 0, quota = 0;
  if(navigator.storage && navigator.storage.estimate){
    try{ const est = await navigator.storage.estimate(); usage = est.usage||0; quota = est.quota||0; }catch(e){}
  }
  const appDataBytes = pulseDataBytes();
  const cacheKeys = ['pulse_recent_searches'];
  let cacheBytes = 0;
  cacheKeys.forEach(k=>{ const v = localStorage.getItem(k); if(v) cacheBytes += (k.length+v.length)*2; });
  const pct = quota ? Math.min(100, (usage/quota*100)) : 0;

  el.innerHTML = `
    <div class="report-row">
      <div class="report-icon" style="background:var(--amber-bg); color:var(--amber-text);"><i class="fa-solid fa-broom"></i></div>
      <div style="flex:1;"><div style="font-weight:600; font-size:13px;">Cache</div><div style="font-size:11.5px; color:var(--ink-muted);">Temporary data stored by the app &middot; ${fmtBytes(cacheBytes)}</div></div>
      <button class="primary-btn" style="width:auto; padding:8px 16px; background:var(--surface-2); color:var(--ink);" onclick="clearAppCache()">Clear Cache</button>
    </div>
    <div class="report-row">
      <div class="report-icon" style="background:var(--blue-bg); color:var(--blue-text);"><i class="fa-solid fa-map"></i></div>
      <div style="flex:1;"><div style="font-weight:600; font-size:13px;">Offline Maps</div><div style="font-size:11.5px; color:var(--ink-muted);">No offline maps downloaded &middot; 0 MB</div></div>
      <button class="primary-btn" style="width:auto; padding:8px 16px; background:var(--surface-2); color:var(--ink);" onclick="manageOfflineMaps()">Manage Maps</button>
    </div>
    <div class="report-row">
      <div class="report-icon" style="background:var(--purple-bg); color:var(--purple);"><i class="fa-solid fa-box-archive"></i></div>

      <button class="primary-btn" style="width:auto; padding:8px 16px; background:var(--surface-2); color:var(--ink);" onclick="confirmClearAllData()">Clear Data</button>
    </div>
    <div style="margin-top:18px;">
      <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--ink-muted); margin-bottom:6px;"><span>Storage Used</span><span>${fmtBytes(usage)} / ${quota ? fmtBytes(quota) : 'unknown'} &middot; ${pct.toFixed(1)}%</span></div>
      <div style="height:8px; border-radius:6px; background:var(--surface-2); overflow:hidden;"><div style="height:100%; width:${pct}%; background:var(--accent); border-radius:6px;"></div></div>
    </div>`;
}
