let pendingLocRole = 'Home';
let locSetDebounce;
function onLocSetSearch(q){
  clearTimeout(locSetDebounce);
  const resultsEl = document.getElementById('loc-set-results');
  if(!resultsEl) return;
  if(!q || q.trim().length < 3){ resultsEl.classList.remove('show'); resultsEl.innerHTML=''; return; }
  locSetDebounce = setTimeout(async ()=>{
    try{
      const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=5&q=' + encodeURIComponent(q);
      const res = await fetch(url);
      const results = await res.json();
      if(!results.length){ resultsEl.innerHTML = `<div class="search-result-item" style="color:var(--ink-muted);">No matches found</div>`; resultsEl.classList.add('show'); return; }
      resultsEl.innerHTML = results.map(r=>`<div class="search-result-item" onclick='selectLocSetResult(${r.lat},${r.lon},${JSON.stringify(r.display_name)})'>${r.display_name}</div>`).join('');
      resultsEl.classList.add('show');
    }catch(e){ resultsEl.classList.remove('show'); }
  }, 400);
}
function selectLocSetResult(lat, lng, label){
  const shortLabel = label.split(',')[0];
  const cols = getSavedCollections();
  const existingId = (cols[pendingLocRole]||[]).find(id=>String(id).indexOf('c_')===0);
  if(existingId){
    cols[pendingLocRole] = cols[pendingLocRole].filter(id=>id!==existingId);
    setSavedCollections(cols);
  }
  saveCustomAddress(shortLabel, lat, lng, pendingLocRole);
  localStorage.setItem('pulse_default_location', JSON.stringify({label:shortLabel, lat, lng}));
  toast(`Set as ${pendingLocRole}`);
  const input = document.getElementById('loc-set-search');
  if(input) input.value = '';
  const resultsEl = document.getElementById('loc-set-results');
  if(resultsEl) resultsEl.classList.remove('show');
  renderSettingsPage();
}

function setNearbyFilter(f){ nearbyFilter = f; renderNearbyPage(); }

// ---------- Saved Places (real, localStorage-backed — no accounts exist so this is per-browser) ----------
const COLLECTION_META = {
  'Favorites': {icon:'fa-heart', bg:'var(--coral-bg)', fg:'var(--coral-text)'},
  'Home': {icon:'fa-house', bg:'var(--amber-bg)', fg:'var(--amber-text)'},
  'Work': {icon:'fa-briefcase', bg:'var(--blue-bg)', fg:'var(--blue-text)'}
};
function svColMeta(name){ return COLLECTION_META[name] || {icon:'fa-folder', bg:'var(--surface-2)', fg:'var(--ink-secondary)'}; }
function getSavedCollections(){
  let cols;
  try{ cols = JSON.parse(localStorage.getItem('pulse_saved_collections') || '{}'); }
  catch(e){ cols = {}; }
  ['Favorites','Home','Work'].forEach(n=>{ if(!cols[n]) cols[n] = []; });
  return cols;
}
function setSavedCollections(obj){ localStorage.setItem('pulse_saved_collections', JSON.stringify(obj)); }
function getSavedOrder(){
  try{ return JSON.parse(localStorage.getItem('pulse_saved_order') || '[]'); }catch(e){ return []; }
}
function setSavedOrder(arr){ localStorage.setItem('pulse_saved_order', JSON.stringify(arr)); }
function bumpSavedOrder(id){
  let order = getSavedOrder().filter(x=>x!==String(id));
  order.unshift(String(id));
  setSavedOrder(order);
}
function getSavedCustom(){
  try{ return JSON.parse(localStorage.getItem('pulse_saved_custom') || '{}'); }catch(e){ return {}; }
}
function setSavedCustom(obj){ localStorage.setItem('pulse_saved_custom', JSON.stringify(obj)); }
function getSavedItemMeta(id){
  if(String(id).indexOf('c_')===0){
    const c = getSavedCustom()[id];
    if(!c) return null;
    return {id, name:c.name, custom:true};
  }
  const l = locations.find(x=>String(x.id)===String(id));
  if(!l) return null;
  return {id, name:l.name, custom:false, location:l};
}
function isSaved(locationId){
  const cols = getSavedCollections();
  return Object.values(cols).some(arr => arr.includes(String(locationId)));
}
function toggleSaveLocation(locationId, collection){
  const cols = getSavedCollections();
  const c = collection || 'Favorites';
  if(!cols[c]) cols[c] = [];
  const idx = cols[c].indexOf(String(locationId));
  if(idx >= 0){
    cols[c].splice(idx, 1);
    setSavedCollections(cols);
    if(!Object.values(cols).some(arr=>arr.includes(String(locationId)))){
      setSavedOrder(getSavedOrder().filter(x=>x!==String(locationId)));
    }
  } else {
    cols[c].push(String(locationId));
    setSavedCollections(cols);
    bumpSavedOrder(locationId);
  }
  toast(idx >= 0 ? 'Removed from '+c : 'Saved to '+c);
  const btn = document.getElementById('save-btn-'+locationId);
  if(btn) btn.innerHTML = isSaved(locationId) ? '<i class="fa-solid fa-bookmark"></i>' : '<i class="fa-regular fa-bookmark"></i>';
  if(document.getElementById('saved-page')) renderSavedPage();
}
function removeFromCollection(id, colName){
  const cols = getSavedCollections();
  if(cols[colName]) cols[colName] = cols[colName].filter(x=>x!==String(id));
  setSavedCollections(cols);
  if(!Object.values(cols).some(arr=>arr.includes(String(id)))){
    setSavedOrder(getSavedOrder().filter(x=>x!==String(id)));
  }
  toast('Removed');
  renderSavedPage();
}
function removeSavedEverywhere(id){
  const cols = getSavedCollections();
  Object.keys(cols).forEach(k=>{ cols[k] = cols[k].filter(x=>x!==String(id)); });
  setSavedCollections(cols);
  setSavedOrder(getSavedOrder().filter(x=>x!==String(id)));
  toast('Removed');
  renderSavedPage();
}
function saveCustomAddress(name, lat, lng, collection){
  const id = 'c_' + Date.now();
  const custom = getSavedCustom();
  custom[id] = {name, lat, lng};
  setSavedCustom(custom);
  const cols = getSavedCollections();
  const c = collection || 'Favorites';
  if(!cols[c]) cols[c] = [];
  cols[c].push(id);
  setSavedCollections(cols);
  bumpSavedOrder(id);
  toast('Saved to '+c);
  renderSavedPage();
}
async function submitSaveAddress(collection){
  const input = document.getElementById('sv-save-input');
  const q = input.value.trim();
  if(q.length < 3){ toast('Type at least 3 characters'); return; }
  const btn = document.getElementById('sv-save-btn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q);
    const res = await fetch(url);
    const results = await res.json();
    if(!results.length){ toast('No matches found'); btn.disabled=false; btn.textContent='Save'; return; }
    const r = results[0];
    saveCustomAddress(r.display_name.split(',')[0], r.lat, r.lon, collection);
  }catch(e){
    toast('Could not search that address');
    btn.disabled = false; btn.textContent = 'Save';
  }
}
let savedActiveCollection = null;
function setSavedCollection(name){ savedActiveCollection = name; renderSavedPage(); }
function createCollection(){
  const name = prompt('New collection name:');
  if(!name || !name.trim()) return;
  const cols = getSavedCollections();
  if(!cols[name]) cols[name] = [];
  setSavedCollections(cols);
  savedActiveCollection = name;
  renderSavedPage();
}
function translateCollectionName(name){
  const map = {'Favorites':'favorites_collection', 'Home':'home_collection', 'Work':'work_collection', 'Recently Saved':'recently_saved_collection'};
  return map[name] ? t(map[name]) : name; // user-created custom collections keep their own name
}

    headerLabel = t('recently_saved_collection');

    activeIds = cols[savedActiveCollection] || [];

// ---------- Opening hours (standard OSM opening_hours syntax — real data,
// either the actual OSM tag on live places, or hand-set on the demo seed
// data above. Anything missing or too exotic to parse returns null
// ("unknown") rather than guessing open or closed. ----------
const OH_DAY_MAP = {Mo:1, Tu:2, We:3, Th:4, Fr:5, Sa:6, Su:0};
function ohParseDayPart(part){
  const days = new Set();
  const tokens = part.split(',').map(t=>t.trim()).filter(Boolean);
  for(const t of tokens){
    const range = t.match(/^([A-Za-z]{2})-([A-Za-z]{2})$/);
    if(range){
      const a = OH_DAY_MAP[range[1]], b = OH_DAY_MAP[range[2]];
      if(a==null || b==null) return null;
      let d = a;
      while(true){ days.add(d); if(d===b) break; d=(d+1)%7; }
    } else {
      const d = OH_DAY_MAP[t];
      if(d==null) return null;
      days.add(d);
    }
  }
  return days.size ? [...days] : null;
}
function parseOpeningHours(spec){
  if(!spec) return null;
  const s = spec.trim();
  if(/^24\/7$/i.test(s)) return [{days:[0,1,2,3,4,5,6], open:'00:00', close:'24:00'}];
  const rules = [];
  for(const g of s.split(';').map(x=>x.trim()).filter(Boolean)){
    if(/\boff\b|\bclosed\b/i.test(g) && !/\d/.test(g)){
      const days = ohParseDayPart(g.replace(/\boff\b|\bclosed\b/i,'').trim());
      if(!days) return null;
      rules.push({days, closed:true});
      continue;
    }
    const m = g.match(/^([A-Za-z,\-\s]+?)\s+(\d{1,2}:\d{2})-(\d{1,2}:\d{2})$/);
    if(!m) return null; // unrecognized format — unknown, not guessed
    const days = ohParseDayPart(m[1]);
    if(!days) return null;
    rules.push({days, open:m[2], close:m[3]});
  }
  return rules.length ? rules : null;
}
function isOpenNow(l){
  if(!l.hours) return null;
  const rules = parseOpeningHours(l.hours);
  if(!rules) return null;
  const now = new Date();
  const day = now.getDay();
  const mins = now.getHours()*60 + now.getMinutes();
  let isOpen = false; // a day with no matching rule is implicitly closed, not unknown
  for(const r of rules){
    if(!r.days.includes(day)) continue;
    if(r.closed){ isOpen = false; continue; }
    const [oh,om] = r.open.split(':').map(Number);
    const [ch,cm] = r.close.split(':').map(Number);
    const openMins = oh*60+om, closeMins = ch*60+cm;
    isOpen = closeMins > openMins ? (mins>=openMins && mins<closeMins) : (mins>=openMins || mins<closeMins);
  }
  return isOpen;
}
let npFilters = { category:'all', minRating:0, sortBy:'distance', minDistance:0, maxDistance:20, openNow:false };
let npShowAll = false;
function setNearbyFilter(f){ nearbyFilter = f; npShowAll = false; renderNearbyPage(); }
function openFiltersModal(){
  document.getElementById('np-filters-overlay').style.display = 'flex';
}
function closeFiltersModal(){
  document.getElementById('np-filters-overlay').style.display = 'none';
}
function setNpCategory(k){
  npFilters.category = k;
  document.querySelectorAll('.np-cat-btn').forEach(b=>b.classList.toggle('active', b.dataset.k===k));
}
function setNpRating(r){
  npFilters.minRating = r;
  document.querySelectorAll('.np-rating-btn').forEach(b=>b.classList.toggle('active', Number(b.dataset.r)===r));
}
function setNpDistanceRange(which, v){
  v = Number(v);
  if(which==='min') npFilters.minDistance = Math.min(v, npFilters.maxDistance - 0.1);
  else npFilters.maxDistance = Math.max(v, npFilters.minDistance + 0.1);
  const minEl = document.getElementById('np-distance-min');
  const maxEl = document.getElementById('np-distance-max');
  if(minEl) minEl.value = npFilters.minDistance;
  if(maxEl) maxEl.value = npFilters.maxDistance;
  const pct = x => (x - 0) / (20 - 0) * 100;
  const fill = document.getElementById('np-range-fill');
  if(fill){ fill.style.left = pct(npFilters.minDistance)+'%'; fill.style.right = (100-pct(npFilters.maxDistance))+'%'; }
  const label = document.getElementById('np-distance-value');
  if(label) label.textContent = npFilters.minDistance.toFixed(1) + ' mi \u2013 ' + npFilters.maxDistance.toFixed(1) + ' mi';
}
function toggleNpSortMenu(e){
  e.stopPropagation();
  const menu = document.getElementById('np-sort-menu');
  menu.style.display = menu.style.display==='block' ? 'none' : 'block';
}
function setNpSort(v){
  npFilters.sortBy = v;
  const label = document.getElementById('np-sort-label');
  if(label) label.textContent = ({distance:'Distance', rating:'Rating', wait:'Wait time'})[v];
  document.querySelectorAll('.np-sort-opt').forEach(o=>o.classList.toggle('active', o.dataset.v===v));
  document.getElementById('np-sort-menu').style.display = 'none';
}
function applyNpFilters(){
  closeFiltersModal();
  npShowAll = false;
  renderNearbyPage();
}
function resetNpFilters(){
  npFilters = { category:'all', minRating:0, sortBy:'distance', minDistance:0, maxDistance:20, openNow:false };
  npShowAll = false;
  closeFiltersModal();
  renderNearbyPage();
}
function toggleShowAllNearby(){ npShowAll = !npShowAll; renderNearbyPage(); }

const EXPLORE_CATS = {
  food:{label:'Restaurants', match:l=>l.category==='food'},
  fuel:{label:'Fuel Stations', match:l=>l.category==='fuel'},
  health:{label:'Health', match:l=>l.category==='health'},
  errand:{label:'Errands', match:l=>l.category==='errand'},
  all:{label:'Explore Nearby', match:l=>true},
};
let exploreActive = null;
let exploreSub = 'all';
function openExplore(category){
  exploreActive = category;
  exploreSub = 'all';
  exploreArmed = false;
  showDesktopPage('livemap');
  renderExplorePanel();
  setTimeout(()=>{ exploreArmed = true; }, 0);
}
function closeExplore(){
  exploreActive = null;
  const panel = document.getElementById('explore-panel');
  if(panel) panel.classList.remove('show');
  setTimeout(()=>{
    const input = document.getElementById('search-input-'+exploreOpenedFrom);
    if(input){
      input.focus();
      showRecentSearches(exploreOpenedFrom);
    }
  }, 0);
}
function setExploreSub(sub){ exploreSub = sub; renderExplorePanel(); }
function renderExplorePanel(){
  const panel = document.getElementById('explore-panel');
  if(!panel || !exploreActive) return;
  const cfg = EXPLORE_CATS[exploreActive] || EXPLORE_CATS.all;
  let items = locations.filter(cfg.match);
  if(exploreSub==='openNow') items = items.filter(l=>isOpenNow(l)===true);
  else if(exploreSub==='under15') items = items.filter(l=>l.minutes!=null && l.minutes<15);
  else if(exploreSub==='topRated') items = items.filter(l=>l.ratingCount && l.ratingAvg>=4);
  items = items.slice().sort((a,b)=>realDistanceMi(a).miles-realDistanceMi(b).miles);

  const subChips = [
    {k:'all', label:'All'}, {k:'openNow', label:'Open Now'},
    {k:'under15', label:'Wait < 15 min'}, {k:'topRated', label:'4+ rated'},
  ];

  panel.innerHTML = `
    <div style="display:flex; flex-direction:column; height:100%;">
      <div class="explore-back-row">
        <button class="explore-back-btn" onclick="closeExplore()"><i class="fa-solid fa-arrow-left"></i></button>
        <span class="explore-title">${cfg.label}</span><span class="explore-count">(${items.length})</span>
      </div>
      <div class="explore-chips-row">${subChips.map(c=>`<div class="explore-chip ${exploreSub===c.k?'active':''}" onclick="setExploreSub('${c.k}')">${c.label}</div>`).join('')}</div>
      <div style="flex:1; overflow-y:auto;">
        ${items.length ? items.map(l=>{
          const c = statusColors[l.status] || statusColors.unknown;
          const open = isOpenNow(l);
          return `<div class="explore-card">
            <div class="explore-card-photo" style="background:${c.bg};">${emojiFor(l.icon)}</div>
            <div style="flex:1; min-width:0;">
              <div class="explore-card-name">${l.name}</div>
              <div class="explore-card-meta">
                ${l.ratingCount ? renderStars(l.ratingAvg, l.ratingCount) : t('no_ratings_yet')}
                <span>&middot; ${l.minutes==null ? 'No wait data' : l.minutes+' '+t('unit_min')}</span>
                <span>&middot; ${realDistanceMi(l).label}</span>
                ${open===true ? `<span style="color:var(--teal-text);">&middot; ${t('open_now')}</span>` : open===false ? '<span style="color:var(--coral-text);">&middot; Closed</span>' : ''}
              </div>
              <div class="explore-card-actions">
                <button class="explore-card-dir-btn" onclick="openDirections('${l.id}')"><i class="fa-solid fa-diamond-turn-right"></i>${t('btn_directions')}</button>
              </div>
            </div>
          </div>`;
        }).join('') : `<p style="color:var(--ink-muted); font-size:13px; padding:20px 4px;">No places match this filter yet.</p>`}
      </div>
    </div>`;
  panel.classList.add('show');
}
function renderNearbyPage(q){
  const page = document.getElementById('nearby-page');
  const query = (q!=null ? q : (document.getElementById('np-search-input')?.value || '')).toLowerCase();
  let items = locations.filter(l => l.name.toLowerCase().includes(query));
  if(nearbyFilter==='under10') items = items.filter(l=>l.minutes!=null && l.minutes<10);
  if(nearbyFilter==='verified') items = items.filter(l=>l.ownerVerified);
  if(nearbyFilter==='walking') items = items.filter(l=>realDistanceMi(l).miles <= 1);

  const catMap = {health:'health', service:'service', health2:'health', fuel:'fuel', food:'food', errand:'errand', food2:'food', gym:'service'};
  if(npFilters.category!=='all' && npFilters.category!=='more' && catMap[npFilters.category]){
    items = items.filter(l => l.category === catMap[npFilters.category]);
  }
  if(npFilters.minRating > 0){
    items = items.filter(l => l.ratingCount && l.ratingAvg >= npFilters.minRating);
  }
  items = items.filter(l => { const d = realDistanceMi(l).miles; return d >= npFilters.minDistance && d <= npFilters.maxDistance; });
  if(npFilters.openNow) items = items.filter(l => isOpenNow(l) === true);
  if(npFilters.sortBy==='rating') items = items.slice().sort((a,b)=>(b.ratingAvg||0)-(a.ratingAvg||0));
  else if(npFilters.sortBy==='wait') items = items.slice().sort((a,b)=>(a.minutes==null?999:a.minutes)-(b.minutes==null?999:b.minutes));
  else if(npFilters.sortBy==='distance') items = items.slice().sort((a,b)=>realDistanceMi(a).miles-realDistanceMi(b).miles);

  const chips = [
    {k:'all', label:'All'}, {k:'under10', label:'Under 10 min'},
    {k:'verified', label:'Verified'}, {k:'walking', label:'Walking Distance'},
  ];
  const visibleItems = npShowAll ? items : items.slice(0, 8);

  page.innerHTML = `
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:26px;">
      <div class="np-search" style="flex:1; margin-bottom:0;"><i class="fa-solid fa-magnifying-glass" style="color:var(--ink-muted);"></i><input id="np-search-input" placeholder="Search places, businesses, addresses" value="${q||''}" oninput="renderNearbyPage(this.value)"></div>
      <button onclick="openFiltersModal()" style="display:flex; align-items:center; gap:8px; height:54px; padding:0 20px; border-radius:28px; border:1px solid var(--border); background:var(--surface); font-size:13px; font-weight:600; color:var(--ink); cursor:pointer; flex-shrink:0; box-shadow:0 2px 8px rgba(0,0,0,.04);"><i class="fa-solid fa-sliders"></i>Filters</button>
    </div>
    <div class="np-chips">${chips.map(c=>`<div class="np-chip ${nearbyFilter===c.k?'active':''}" onclick="setNearbyFilter('${c.k}')">${c.label}</div>`).join('')}</div>
    <div class="np-grid">
      ${visibleItems.length ? visibleItems.map(l=>{
        const c = statusColors[l.status];
        return `<div class="np-card">
          <div class="np-photo" style="${l.photoUrl ? `background-image:url('${l.photoUrl}');` : `background:${c.bg}; color:${c.text};`}">${l.photoUrl ? '' : emojiFor(l.icon)}</div>
          <div class="np-body">
            <div class="np-name">${l.name}</div>
            <div class="np-meta-row"><i class="fa-solid fa-arrow-down" style="font-size:9px; color:${c.text};"></i><span style="color:${c.text}; font-weight:700;">${l.minutes==null ? 'No data' : l.minutes+' '+t('unit_min')+' wait'}</span><span style="color:var(--ink-muted);">\u00B7 ${realDistanceMi(l).label}</span></div>
            <div class="np-rating">${l.ratingCount ? renderStars(l.ratingAvg, l.ratingCount) : t('no_ratings_yet')}${l.ownerVerified ? ' \u00B7 <span style="color:var(--teal-text);">Verified</span>' : ''}${isOpenNow(l)===true ? ` \u00B7 <span style="color:var(--teal-text);">${t('open_now')}</span>` : isOpenNow(l)===false ? ' \u00B7 <span style="color:var(--coral-text);">Closed</span>' : ''}</div>
            <button class="np-dir-btn" onclick="openDirections('${l.id}')"><i class="fa-solid fa-diamond-turn-right"></i>${t('btn_directions')}</button>
          </div>
        </div>`;
      }).join('') : `<p style="grid-column:1/-1; color:var(--ink-muted); font-size:13px;">No places match your search.</p>`}
    </div>
    ${items.length > 8 ? `<div style="text-align:center; margin-top:18px;"><button onclick="toggleShowAllNearby()" style="border:none; background:none; color:var(--accent-text); font-weight:600; font-size:13px; cursor:pointer;">${npShowAll ? 'Show less' : 'View more places'} <i class="fa-solid fa-chevron-${npShowAll?'up':'down'}" style="font-size:10px; margin-left:4px;"></i></button></div>` : ''}

    <div id="np-filters-overlay" class="np-filters-overlay">
      <div class="np-filters-modal">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <p style="font-size:16px; font-weight:700; margin:0;">Filters</p>
          <button onclick="closeFiltersModal()" style="border:none; background:none; font-size:18px; color:var(--ink-muted); cursor:pointer;">&times;</button>
        </div>
        <p style="font-size:12px; font-weight:700; color:var(--ink-muted); margin-bottom:10px;">Categories</p>
        <div class="np-cat-grid">
          ${NP_CATEGORIES.map(c=>`<div class="np-cat-btn ${npFilters.category===c.k?'active':''}" data-k="${c.k}" onclick="setNpCategory('${c.k}')"><i class="fa-solid ${c.icon}"></i><span>${c.label}</span></div>`).join('')}
        </div>
        <p style="font-size:12px; font-weight:700; color:var(--ink-muted); margin:18px 0 8px;">Distance <span id="np-distance-value" style="font-weight:600; color:var(--ink);">${npFilters.minDistance.toFixed(1)} mi \u2013 ${npFilters.maxDistance.toFixed(1)} mi</span></p>
        <div class="np-range-wrap">
          <div class="np-range-track"></div>
          <div class="np-range-fill" id="np-range-fill" style="left:${((npFilters.minDistance-0)/(20-0)*100).toFixed(2)}%; right:${(100-(npFilters.maxDistance-0)/(20-0)*100).toFixed(2)}%;"></div>
          <input type="range" id="np-distance-min" min="0" max="20" step="0.1" value="${npFilters.minDistance}" oninput="setNpDistanceRange('min', this.value)">
          <input type="range" id="np-distance-max" min="0" max="20" step="0.1" value="${npFilters.maxDistance}" oninput="setNpDistanceRange('max', this.value)">
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:2px;">
          <span style="font-size:11px; color:var(--ink-muted);">0 mi</span>
          <span style="font-size:11px; color:var(--ink-muted);">20 mi</span>
        </div>
        <p style="font-size:12px; font-weight:700; color:var(--ink-muted); margin:18px 0 8px;">Rating</p>
        <div style="display:flex; gap:8px;">
          <div class="np-rating-btn ${npFilters.minRating===4?'active':''}" data-r="4" onclick="setNpRating(4)">4+ <i class="fa-solid fa-star" style="font-size:10px; color:#F59E0B;"></i></div>
          <div class="np-rating-btn ${npFilters.minRating===3?'active':''}" data-r="3" onclick="setNpRating(3)">3+ <i class="fa-solid fa-star" style="font-size:10px; color:#F59E0B;"></i></div>
          <div class="np-rating-btn ${npFilters.minRating===2?'active':''}" data-r="2" onclick="setNpRating(2)">2+ <i class="fa-solid fa-star" style="font-size:10px; color:#F59E0B;"></i></div>
          <div class="np-rating-btn ${npFilters.minRating===0?'active':''}" data-r="0" onclick="setNpRating(0)">Any</div>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between; margin-top:18px;">
          <div><p style="font-size:13px; font-weight:600; margin:0;">Open Now</p><p style="font-size:11px; color:var(--ink-muted); margin:2px 0 0;">Only for places with real hours on file</p></div>
          <label class="np-toggle"><input type="checkbox" ${npFilters.openNow?'checked':''} onchange="npFilters.openNow=this.checked"><span class="np-toggle-slider"></span></label>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between; margin-top:18px;">
          <p style="font-size:13px; font-weight:600; margin:0;">Sort By</p>
          <div class="np-sort-wrap">
            <button type="button" class="np-sort-btn" onclick="toggleNpSortMenu(event)"><span id="np-sort-label">${({distance:'Distance', rating:'Rating', wait:'Wait time'})[npFilters.sortBy]}</span><i class="fa-solid fa-chevron-down"></i></button>
            <div class="np-sort-menu" id="np-sort-menu" style="display:none;">
              <div class="np-sort-opt ${npFilters.sortBy==='distance'?'active':''}" data-v="distance" onclick="setNpSort('distance')">Distance</div>
              <div class="np-sort-opt ${npFilters.sortBy==='rating'?'active':''}" data-v="rating" onclick="setNpSort('rating')">Rating</div>
              <div class="np-sort-opt ${npFilters.sortBy==='wait'?'active':''}" data-v="wait" onclick="setNpSort('wait')">Wait time</div>
            </div>
          </div>
        </div>
        <div style="display:flex; gap:10px; margin-top:22px;">
          <button onclick="resetNpFilters()" style="flex:1; padding:12px; border-radius:11px; border:1px solid var(--border); background:var(--surface); font-weight:600; font-size:13px; cursor:pointer;">Reset</button>
          <button onclick="applyNpFilters()" class="primary-btn" style="flex:1; margin-bottom:0;">Apply Filters</button>
        </div>
      </div>
    </div>
  `;
}

function toggleSidebarCollapse(){
  document.querySelector('.app-shell').classList.toggle('collapsed');
}
boot();

document.addEventListener('click', (e)=>{
  document.querySelectorAll('.search-results.show').forEach(panel=>{
    if(!panel.closest('.search-bar-wrap').contains(e.target)){
      panel.classList.remove('show');
    }
  });
  const sortMenu = document.getElementById('np-sort-menu');
  if(sortMenu && sortMenu.style.display==='block' && !sortMenu.closest('.np-sort-wrap').contains(e.target)){
    sortMenu.style.display = 'none';
  }
  const explorePanel = document.getElementById('explore-panel');
  if(exploreArmed && explorePanel && explorePanel.classList.contains('show') && !e.composedPath().includes(explorePanel)){
    exploreActive = null;
    explorePanel.classList.remove('show');
  }
});

document.addEventListener('keydown', (e)=>{
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==='k'){
    e.preventDefault();
    const input = document.getElementById('search-input-desktop') || document.getElementById('search-input-mobile');
    if(input) input.focus();
  }
});
